name: Dependabot auto-merge

on:
  # pull_request_target so fork-based dependabot rebases keep working; the
  # job only reads metadata and approves/queues the merge, never checks out
  # PR code, and is restricted to dependabot by the job condition.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Approve and auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata

      # Explicit semver-major updates stay manual. Grouped PRs report a blank
      # update-type; the groups in dependabot.yml are restricted to
      # minor+patch, and the CI gate runs on the PR either way.
      - name: Skip major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update — leaving for manual review."

      - name: Approve
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge (squash)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
