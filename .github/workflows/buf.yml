name: Buf

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  buf-breaking:
    name: buf-breaking
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.66.0'

      - name: buf lint
        run: buf lint

      - name: buf breaking
        if: github.event_name != 'push'
        run: buf breaking --against '.git#branch=origin/main' --against-config buf.yaml --path proto/identity/identity.proto
