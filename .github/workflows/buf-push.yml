name: Buf Push

# Publish the proto module (and its generated docs) to the Buf Schema
# Registry at buf.build/elloloop/identity whenever the schema changes on main.
on:
  push:
    branches: [main]
    paths:
      - 'proto/**'
      - 'buf.yaml'

permissions:
  contents: read

jobs:
  buf-push:
    name: buf-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.66.0'

      - name: buf push
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push --error-format=github-actions
