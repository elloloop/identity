name: Browser E2E

# Drives the server-rendered auth UI (internal/app/ui, served at /auth/)
# through a real headless Chrome via chromedp. The suite is gated behind the
# `browsere2e` build tag so the default unit pass never runs it, and it boots
# the real server against a throwaway postgres testcontainer (Docker is
# available on ubuntu-latest runners).
#
# This workflow is intentionally NON-REQUIRED: it is not pinned by branch
# protection. It runs on PRs that touch the auth UI / serving wiring and on a
# manual trigger, as a smoke signal — not a merge gate.

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/app/ui/**'
      - 'internal/app/**'
      - 'tests/browsere2e/**'
      - '.github/workflows/browsere2e.yml'
  workflow_dispatch:

# Cancel in-progress runs for the same ref so PR pushes don't pile up.
concurrency:
  group: browsere2e-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'

permissions:
  contents: read

jobs:
  browsere2e:
    name: Browser E2E (chromedp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Installs Google Chrome stable on the runner. chromedp's exec allocator
      # discovers it via PATH (google-chrome / google-chrome-stable); when it
      # is absent the suite t.Skips cleanly rather than failing.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: stable

      - name: Run browser e2e suite
        run: |
          set -euo pipefail
          go test -tags=browsere2e -count=1 -timeout=600s -v ./tests/browsere2e/...
