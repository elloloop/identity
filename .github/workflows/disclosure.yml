name: Disclosure

# Catches confidential terms (a client's names, private hosts, internal
# infrastructure) in PRs and in what the merge queue lands, without a
# maintainer having to remember to look (AGENTS.md §13). The term list
# lives only in the CONFIDENTIAL_TERMS repository secret, one term per
# line; nothing here ever prints, comments or labels with a matched term.
# Issues and comments are checked by disclosure-discussion.yml. No workflow
# checks reviews; the review gate reads them (AGENTS.md §13).
#
# This workflow triggers only on pull_request_target and merge_group, so
# its one job is the only thing that reports the "Disclosure" check, and it
# can be made required: a run from another event would attach a skipped
# "Disclosure" job to the PR head, which GitHub counts as success. Every
# event on a PR (a push, a reopen, an edit of the title) runs it again on
# the same head, and the latest run is the one that counts, so every run
# reads every commit: a run that read less would replace a failing result
# with a passing one.
#
# scripts/disclosure-collect.sh decides what text an event carries and
# whose it is; scripts/disclosure-check.sh matches it. Both are tested in
# tests/policy.
#
# pull_request_target runs this file from the BASE branch with the base
# repository's token and secrets, so a fork PR whose author has write access
# is checked too. That is safe only because no PR code is ever checked out or
# run: the PR's text, commit messages and added lines are read through the
# API as data, and the only
# checkout is the base branch's own copy of the scripts. A merge_group run
# takes this file and the scripts from the queued commit, so it runs only
# reviewed code as long as code-owner review is required to queue a PR:
# an auto-merge rule that queues a dependency bot's PR unreviewed would
# run that PR's copy here.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  # One check name on the PR and in the merge queue, so it can be required.
  disclosure:
    name: Disclosure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: disclosure-pr-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
      cancel-in-progress: true
    steps:
      # No ref: under pull_request_target the default is the base branch,
      # never the PR head; under merge_group, the queued commit.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/disclosure-collect.sh
            scripts/disclosure-check.sh
          sparse-checkout-cone-mode: false

      # The token reads the commits, files and the author's repository
      # permission (metadata: read, which every job token holds).
      - name: Collect the text, commit messages and added lines
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target) kind=pr ;;
            merge_group) kind=merge-group ;;
            *) echo "::error::Unexpected event $EVENT_NAME."; exit 1 ;;
          esac
          status=0
          bash scripts/disclosure-collect.sh "$kind" > "$RUNNER_TEMP/disclosure-text" || status=$?
          case "$status" in
            0) echo "check=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "::notice::Not checked: the item's author has no write access. See AGENTS.md §13 for what covers it instead." ;;
            11)
              echo "::error::There are more commits, or a commit has more files, than the GitHub API lists, so not all of it can be checked. Split it into smaller PRs or commits."
              exit 1
              ;;
            2)
              echo "::error::A GitHub API read failed (often the hourly request limit), so nothing was checked. Re-run this check."
              exit 1
              ;;
            *) exit "$status" ;;
          esac

      - name: Check for confidential terms
        if: steps.collect.outputs.check == 'true'
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          status=0
          bash scripts/disclosure-check.sh < "$RUNNER_TEMP/disclosure-text" || status=$?
          case "$status" in
            0) echo "No confidential terms found." ;;
            3) echo "::notice::The confidential-terms secret is not set; the disclosure check was skipped." ;;
            1)
              if [ "$EVENT_NAME" = "merge_group" ]; then
                echo "::error::A queued PR's squash commit message, a file name, an added line or a file's content contains a confidential term. Remove that PR from the queue and fix it before it lands. See AGENTS.md §13."
              else
                echo "::error::The title, description, branch name, a commit message, a file name, an added line or a file's content contains a confidential term. Use neutral examples (acme, example.com, example.test) instead. A later commit cannot clear an earlier one: rewrite the branch without it, force-push, and tell a maintainer, since the replaced commit stays public by SHA until GitHub purges it. See AGENTS.md §13."
              fi
              exit 1
              ;;
            *) exit "$status" ;;
          esac
