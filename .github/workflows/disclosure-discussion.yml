name: Disclosure (discussion)

# Catches confidential terms in issues, comments, PR reviews and inline
# review comments (AGENTS.md §13); disclosure.yml checks the PRs
# themselves. These triggers live apart from that workflow so that no run
# from them ever attaches a skipped "Disclosure" check to a PR head, which
# GitHub would count as success for the required check. The term list lives
# only in the CONFIDENTIAL_TERMS repository secret; nothing here ever
# prints, comments or labels with a matched term.
#
# Which copy of this file and the scripts runs: issues and issue_comment
# run the default branch's. pull_request_review and
# pull_request_review_comment run the PR's merge ref: on a same-repository
# PR, the branch's own, unreviewed copy runs with the term list and
# issues: write, and anyone who can review the PR can trigger it. That is no
# escalation: only people who can push branches here open such PRs, they
# already hold write access, and the secret is theirs to use. A review on a
# fork PR gets a read-only token and no secrets, so it is never checked;
# the collect script says so.

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions: {}

jobs:
  discussion:
    name: Disclosure (discussion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Labels and comments go through the issues API, which takes a PR number
    # too, so issues: write covers a review on a PR as well.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/disclosure-collect.sh
            scripts/disclosure-check.sh
          sparse-checkout-cone-mode: false

      # The token reads the author's repository permission (metadata: read,
      # which every job token holds).
      - name: Collect the text
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            issues) kind=issue ;;
            issue_comment) kind=comment ;;
            pull_request_review) kind=review ;;
            pull_request_review_comment) kind=review-comment ;;
            *) echo "::error::Unexpected event $EVENT_NAME."; exit 1 ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          status=0
          bash scripts/disclosure-collect.sh "$kind" > "$RUNNER_TEMP/disclosure-text" || status=$?
          case "$status" in
            0) echo "check=true" >> "$GITHUB_OUTPUT" ;;
            10) echo "::notice::Not checked: no one with write access wrote or sent this. See AGENTS.md §13." ;;
            12) echo "::notice::Not checked: reviews on fork PRs get no secrets. See AGENTS.md §13." ;;
            2)
              echo "::error::A GitHub API read failed (often the hourly request limit), so nothing was checked. Re-run this check."
              exit 1
              ;;
            *) exit "$status" ;;
          esac

      - name: Check for confidential terms
        id: check
        if: steps.collect.outputs.check == 'true'
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: |
          status=0
          bash scripts/disclosure-check.sh < "$RUNNER_TEMP/disclosure-text" || status=$?
          case "$status" in
            0) echo "No confidential terms found." ;;
            3) echo "::notice::The confidential-terms secret is not set; the disclosure check was skipped." ;;
            1) echo "found=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Label and ask the author to redact
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          KIND: ${{ steps.collect.outputs.kind }}
          ITEM_ID: ${{ github.event.comment.id || github.event.review.id }}
          AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.event.issue.user.login }}
        run: |
          set -euo pipefail
          label=needs-redaction
          if ! gh label list --search "$label" --json name --jq '.[].name' | grep -qx "$label"; then
            gh label create "$label" --color B60205 \
              --description "Contains details that must be removed before this can stay public"
          fi
          gh api --method POST "repos/$GH_REPO/issues/$NUMBER/labels" -f "labels[]=$label" > /dev/null

          # One request per offending item: an edit that still matches does
          # not post again.
          case "$KIND" in
            issue) item="issue"; what="This issue's title or description" ;;
            comment) item="comment-$ITEM_ID"; what="Your comment" ;;
            review) item="review-$ITEM_ID"; what="Your review" ;;
            review-comment) item="review-comment-$ITEM_ID"; what="Your review comment" ;;
            *) echo "::error::Unexpected kind $KIND."; exit 1 ;;
          esac
          marker="<!-- disclosure-check:$item -->"
          posted="$(gh api "repos/$GH_REPO/issues/$NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))] | length" \
            | awk '{n += $1} END {print n + 0}')"
          if [ "$posted" -eq 0 ]; then
            body="$(printf '%s\n%s\n' "$marker" \
              "@$AUTHOR $what appears to contain something that should not be public here, such as a private product, host or domain name. Please edit it to remove that, and use neutral examples (\`acme\`, \`example.com\`, \`example.test\`) instead. A maintainer will clear the \`$label\` label, and the earlier revision from the edit history, once it is clean.")"
            gh api --method POST "repos/$GH_REPO/issues/$NUMBER/comments" -f "body=$body" > /dev/null
          fi
          echo "Labelled $label and asked the author to redact."
