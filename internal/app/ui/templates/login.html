{{define "content"}}
        <div class="header">
            <h1 id="title">Welcome back</h1>
            <p id="subtitle">Log in to your account to continue</p>
        </div>

        <div id="error-message" class="error-message" role="alert"></div>
        <div id="success-message" class="success-message" role="status"></div>

        <!-- OAuth provider buttons: rendered from the server-injected
             per-project provider list, linking into the hosted flow with the
             page's own return_to / project_key passed through. -->
        <div id="oauth-buttons" class="oauth-buttons"></div>
        <div id="divider" class="divider">or</div>
        <div id="no-methods" class="no-methods">No sign-in methods are enabled for this project.</div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email" placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <!-- CAPTCHA widget, rendered only when configured and only in the
                 modes (login / sign-up) the server actually enforces. -->
            <div id="captcha-container" class="captcha-container"></div>

            <button type="submit" class="submit-btn" id="submit-btn">Log in</button>
        </form>

        <div class="toggle-mode">
            <span id="toggle-text">Don't have an account?</span>
            <button type="button" id="toggle-link">Sign up</button>
        </div>
        
        <div id="result-data" class="result-data"></div>
{{end}}

{{define "scripts"}}
    <script nonce="{{.Nonce}}">
        {{.JSONConfig}}
        const config = window.serverConfig || { passwordLoginEnabled: true, passwordSignupEnabled: true };
        // The page's CSP nonce, so the CAPTCHA loader injected below carries
        // it and Turnstile propagates it to the resources it loads.
        const scriptNonce = document.currentScript ? document.currentScript.nonce : '';

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const resultData = document.getElementById('result-data');

        // Hub routing context: an app sends users here as
        // /auth/?return_to=<app-url>&project_key=<pk>. Both values pass
        // through to the hosted OAuth start URL, and the key scopes the
        // password RPCs via the X-Project-Key header. Served on a project's
        // own auth-domain, neither is needed — the Host resolves the project.
        const pageQuery = new URLSearchParams(window.location.search);
        const projectKey = pageQuery.get('project_key') || '';
        const returnTo = pageQuery.get('return_to') || '';

        const passwordEnabled = config.passwordLoginEnabled !== false;
        if (!passwordEnabled) {
            form.style.display = 'none';
        }
        if (!passwordEnabled || !config.passwordSignupEnabled) {
            document.querySelector('.toggle-mode').style.display = 'none';
        }

        // OAuth buttons render only for the providers the server enabled for
        // THIS project, and only when the hosted flow can actually complete:
        // the /oauth/start routes are mounted, the page knows where to send
        // the user back (return_to), and a borrowed (hub-shared) provider —
        // whose flow must start on the hub origin — has the project_key it
        // needs to re-scope the callback.
        const oauthProviders = Array.isArray(config.oauthProviders) ? config.oauthProviders : [];
        const renderableProviders = oauthProviders.filter((p) => !p.needsProjectKey || projectKey);
        const oauthReady = !!config.hostedOAuthEnabled && renderableProviders.length > 0 && returnTo !== '';
        const providerLabels = { google: 'Google', microsoft: 'Microsoft', github: 'GitHub', apple: 'Apple', oidc: 'OIDC' };

        function providerLabel(key) {
            if (providerLabels[key]) return providerLabels[key];
            return key.charAt(0).toUpperCase() + key.slice(1);
        }

        if (oauthReady) {
            const container = document.getElementById('oauth-buttons');
            for (const provider of renderableProviders) {
                const params = new URLSearchParams({ return_to: returnTo });
                if (projectKey) params.set('project_key', projectKey);
                const a = document.createElement('a');
                a.className = 'oauth-btn';
                // startOrigin routes the flow to the origin the provider's
                // client is registered for (the project's own auth-domain, or
                // the hub for a borrowed provider); '' means this origin.
                a.href = (provider.startOrigin || '') + '/oauth/start/' + encodeURIComponent(provider.key) + '?' + params.toString();
                a.textContent = 'Continue with ' + providerLabel(provider.key);
                container.appendChild(a);
            }
            container.style.display = 'flex';
            if (passwordEnabled) {
                document.getElementById('divider').style.display = 'flex';
            }
        }

        if (!passwordEnabled && !oauthReady) {
            // Name the real reason: an OAuth-only project with providers
            // configured may still be un-renderable HERE (hosted flow off,
            // missing return_to, or a hub-shared provider without the
            // project_key it needs).
            const noMethods = document.getElementById('no-methods');
            if (oauthProviders.length > 0 && !config.hostedOAuthEnabled) {
                noMethods.textContent = 'OAuth providers are configured, but the hosted sign-in flow is disabled on this server (GATEWAY_OAUTH_ALLOWED_RETURN_URLS is empty).';
            } else if (oauthProviders.length > 0 && returnTo === '') {
                noMethods.textContent = 'Sign-in with ' + oauthProviders.map((p) => providerLabel(p.key)).join(', ') + ' is available, but this page was opened without a return_to destination. Use your app\'s sign-in link.';
            } else if (oauthProviders.length > 0 && renderableProviders.length === 0) {
                noMethods.textContent = 'Sign-in for this project goes through the central hub and needs a project_key. Use your app\'s sign-in link.';
            }
            noMethods.style.display = 'block';
        }

        // CAPTCHA: the server injects the provider, PUBLIC site key and the
        // per-flow enforcement flags, so the widget renders exactly in the
        // modes where the server will require a token. The token is attached
        // to the request of whichever enforced mode is submitted.
        const captchaAvailable = config.captchaProvider === 'turnstile' && !!config.captchaSiteKey && !!config.captchaScriptURL;
        const captchaLoadFailedMsg = 'The CAPTCHA failed to load. Check your connection and reload the page.';
        const captchaContainer = document.getElementById('captcha-container');
        let captchaToken = '';
        let captchaWidgetId = null;
        let turnstileLoad = null;

        function captchaRequired() {
            if (!captchaAvailable) return false;
            return isLogin ? !!config.captchaEnforceLogin : !!config.captchaEnforceSignup;
        }

        function loadTurnstile() {
            if (turnstileLoad) return turnstileLoad;
            turnstileLoad = new Promise((resolve, reject) => {
                if (window.turnstile) { resolve(); return; }
                const s = document.createElement('script');
                s.src = config.captchaScriptURL;
                if (scriptNonce) s.nonce = scriptNonce;
                s.async = true;
                s.defer = true;
                s.onload = () => resolve();
                s.onerror = () => {
                    turnstileLoad = null; // allow a retry on the next sync
                    reject(new Error('captcha script failed to load'));
                };
                document.head.appendChild(s);
            });
            return turnstileLoad;
        }

        async function ensureCaptcha() {
            if (captchaWidgetId !== null) return;
            try {
                await loadTurnstile();
            } catch {
                errorMsg.textContent = captchaLoadFailedMsg;
                errorMsg.style.display = 'block';
                return;
            }
            // Re-check after the await: a concurrent call may have rendered.
            if (captchaWidgetId !== null) return;
            captchaWidgetId = window.turnstile.render(captchaContainer, {
                sitekey: config.captchaSiteKey,
                callback: (token) => { captchaToken = token; },
                'error-callback': () => { captchaToken = ''; },
                'expired-callback': () => { captchaToken = ''; },
            });
        }

        function resetCaptcha() {
            captchaToken = '';
            if (captchaWidgetId !== null && window.turnstile) {
                window.turnstile.reset(captchaWidgetId);
            }
        }

        function syncCaptchaVisibility() {
            if (captchaRequired()) {
                captchaContainer.style.display = 'block';
                ensureCaptcha();
            } else {
                captchaContainer.style.display = 'none';
            }
        }

        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            resultData.style.display = 'none';
            
            if (isLogin) {
                title.textContent = 'Welcome back';
                subtitle.textContent = 'Log in to your account to continue';
                submitBtn.textContent = 'Log in';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign up';
            } else {
                title.textContent = 'Create an account';
                subtitle.textContent = 'Enter your details to get started';
                submitBtn.textContent = 'Sign up';
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Log in';
            }
            syncCaptchaVisibility();
        });

        // Show the widget if the page loads directly in sign-up mode.
        syncCaptchaVisibility();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // The current mode requires a CAPTCHA token when enforced. With no
            // rendered widget there is nothing the user can complete — keep the
            // load-failure guidance instead of asking for the impossible.
            if (captchaRequired() && !captchaToken) {
                errorMsg.textContent = captchaWidgetId === null
                    ? captchaLoadFailedMsg
                    : 'Please complete the CAPTCHA to continue.';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            resultData.style.display = 'none';

            const endpoint = isLogin
                ? '/identity.v1.IdentityService/PasswordLogin'
                : '/identity.v1.IdentityService/PasswordSignup';

            const payload = { email, password };

            try {
                const headers = { 'Content-Type': 'application/json' };
                // Scope the RPC to the routed project when this page was
                // reached through the hub with a project_key — the browser
                // cannot rely on Host-based resolution there.
                if (projectKey) headers['X-Project-Key'] = projectKey;
                if (captchaRequired()) {
                    // Exchange the captcha solution for an assurance token:
                    // the auth RPCs read X-Assurance-Token, never a raw
                    // captcha in the body.
                    const exchange = await fetch('/identity.v1.IdentityService/IssueAssuranceToken', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ platform: 'web', webToken: captchaToken })
                    });
                    const exchangeData = await exchange.json();
                    if (!exchange.ok) {
                        resetCaptcha();
                        throw new Error(exchangeData.message || exchangeData.code || 'Verification failed');
                    }
                    headers['X-Assurance-Token'] = exchangeData.assuranceToken;
                }
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    // A used/expired token can't be replayed — mint a fresh one.
                    if (captchaRequired()) resetCaptcha();
                    throw new Error(data.message || data.code || 'Authentication failed');
                }
                
                successMsg.textContent = isLogin ? 'Successfully logged in!' : 'Account created successfully!';
                successMsg.style.display = 'block';
                
                if (data.accessToken || data.access_token) {
                    const token = data.accessToken || data.access_token;
                    resultData.textContent = 'Token: ' + token.substring(0, 30) + '...';
                    resultData.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLogin ? 'Log in' : 'Sign up';
            }
        });
    </script>
{{end}}
