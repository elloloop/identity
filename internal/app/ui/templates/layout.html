<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{{block "title" .}}Authentication{{end}}</title>
    <style nonce="{{.Nonce}}">
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted-text);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted-text);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            /* A real outline survives forced-colors mode; the shadow is the
               designed ring in normal rendering. */
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        button.submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.submit-btn:active {
            transform: translateY(1px);
        }

        .toggle-mode {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted-text);
        }

        .toggle-mode button {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-mode button:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .result-data {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted-text);
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            display: none;
            word-wrap: break-word;
        }

        .oauth-buttons {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        a.oauth-btn {
            display: block;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        a.oauth-btn:hover {
            border-color: var(--primary);
            background: rgba(15, 23, 42, 0.8);
        }

        .divider {
            display: none;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: var(--muted-text);
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .no-methods {
            display: none;
            text-align: center;
            color: var(--muted-text);
            font-size: 14px;
            padding: 16px 0;
        }

        /* CAPTCHA widget mount: hidden until a widget renders (login page). */
        .captcha-container {
            display: none;
            margin-bottom: 16px;
        }

        /* Server-rendered states (action pages): the message classes above
           start hidden for the script-driven login page; these show them. */
        .is-visible {
            display: block;
        }

        .notice-message {
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(148, 163, 184, 0.12);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
        }

        .fine-print {
            margin: 20px 0 0;
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted-text);
            text-align: center;
        }

        .fine-print a, .toggle-mode a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .fine-print a:hover, .toggle-mode a:hover {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
{{template "content" .}}
    </div>
{{block "scripts" .}}{{end}}
</body>
</html>
