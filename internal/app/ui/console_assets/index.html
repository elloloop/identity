  const PAGE_OVERVIEW = 'overview';
  const PAGE_ACCESS = 'access';
  const PAGES = Object.freeze([
    { id: PAGE_OVERVIEW, title: 'Overview', lead: 'What this project is and how an app reaches it.' },
    { id: PAGE_ACCESS, title: 'Sign-up and access', lead: 'Who may create an account and sign in to this project.', sections: ['access', 'anonymous'] },
    { id: 'accounts', title: 'Accounts', lead: 'The kinds of account people have, how they sign in and how they recover.', sections: ['accounts', 'login', 'recovery_emails'] },
    { id: 'organizations', title: 'Organizations', lead: 'Groups of people inside this project. The API calls an organization a tenant.', sections: ['tenants'] },
    { id: 'children', title: 'Child accounts', lead: 'Guardians, dates of birth and the ages that make someone a child.', sections: ['guardian', 'age_gate', 'jurisdictions'] },
    { id: 'origins', title: 'Web origins', lead: 'The websites whose pages may call this project from a browser.', sections: ['cors'] },
  ]);

  // ── State ────────────────────────────────────────────────────────────

  const LOAD = Object.freeze({ idle: 'idle', loading: 'loading', ready: 'ready', failed: 'failed' });
  const OUTCOME = Object.freeze({ saved: 'saved', failed: 'failed', conflict: 'conflict' });

  // Everything the page knows lives here and nowhere else: tokens are never
  // written to storage or a cookie, so reloading the page signs out.
  const state = {
    session: null,
    projects: null,
    canCreateProject: false,
    refusal: null,
    records: new Map(),
    saving: null,
  };

  const view = { projectId: '', page: '', cards: [], dots: new Map() };

  // The server writes its answers as protojson, which leaves a field out when
  // it holds its zero value and writes a 64-bit number as a string: a project
  // nobody has configured answers with no version at all, meaning this one.
  const ZERO_VERSION = '0';

  function recordFor(projectId) {
    let record = state.records.get(projectId);
    if (!record) {
      record = { status: LOAD.idle, failure: null, settings: {}, version: ZERO_VERSION, savingSection: '', edits: {}, problems: {}, outcomes: {} };
      state.records.set(projectId, record);
    }
    return record;
  }

  function storedSection(record, name) {
    return isRecord(record.settings[name]) ? record.settings[name] : {};
  }

  // A section as the form shows it: what the server stores, with the
  // person's unsaved edits over it. Fields the form does not draw ride along
  // untouched.
  function draftSection(record, name) {
    return Object.assign({}, storedSection(record, name), record.edits[name]);
  }

  function hasEdits(record, name) {
    return Object.keys(record.edits[name] || {}).length > 0;
  }

  function hasUnsavedEdits(record) {
    return Object.keys(record.edits).some((name) => hasEdits(record, name));
  }

  function anyUnsavedEdits() {
    return Array.from(state.records.values()).some(hasUnsavedEdits);
  }

  function setEdit(record, name, field, value) {
    const stored = KINDS[field.kind].plain(storedSection(record, name)[field.key], field);
    const edits = record.edits[name] || {};
    if (sameValue(value, stored)) delete edits[field.key];
    else edits[field.key] = value;
    if (Object.keys(edits).length) record.edits[name] = edits;
    else delete record.edits[name];
    if (record.outcomes[name] && record.outcomes[name].kind === OUTCOME.saved) delete record.outcomes[name];
  }

  function setProblem(record, name, key, message) {
    const problems = record.problems[name] || {};
    if (message) problems[key] = message;
    else delete problems[key];
    record.problems[name] = problems;
  }

  function readSettings(text) {
    if (text === undefined || text === '') return {};
    let settings = null;
    try {
      settings = JSON.parse(text);
    } catch (cause) {
      settings = null;
    }
    if (!isRecord(settings)) throw new RpcError(Code.unreadable);
    return settings;
  }

  // Takes the server's settings and their version, keeping only the edits
  // that still differ from them.
  function acceptSettings(record, answer) {
    record.settings = readSettings(answer.settingsJson);
    record.version = answer.version === undefined ? ZERO_VERSION : String(answer.version);
    for (const name of Object.keys(record.edits)) {
      const fields = SECTIONS[name].fields;
      for (const key of Object.keys(record.edits[name])) {
        setEdit(record, name, fields.find((field) => field.key === key), record.edits[name][key]);
      }
    }
  }

  // The section as it will be saved: everything the server stores in it,
  // drawn or not, with the edits over it, unless the section is marked exact. A
  // field that does not apply under the other choices is not drawn and is
  // emptied here, because the server refuses a section that carries one.
  // Fields are settled in order, so one may depend on those before it.
  function settle(def, draft) {
    const section = def.exact
      ? Object.fromEntries(def.fields.filter((field) => Object.hasOwn(draft, field.key)).map((field) => [field.key, draft[field.key]]))
      : Object.assign({}, draft);
    const hidden = new Set();
    const cleared = [];
    for (const field of def.fields) {
      if (!field.applies || field.applies(section)) continue;
      hidden.add(field);
      if (!field.key) continue;
      const kind = KINDS[field.kind];
      const empty = kind.plain(undefined, field);
      if (sameValue(kind.plain(section[field.key], field), empty)) continue;
      section[field.key] = empty;
      cleared.push(field.label);
    }
    return { section, hidden, cleared };
  }

  function sectionState(record, name) {
    const def = SECTIONS[name];
    const settled = settle(def, draftSection(record, name));
    const problems = record.problems[name] || {};
    const blocked = def.fields.some((field) => field.key && !settled.hidden.has(field) && problems[field.key]);
    const checks = def.check ? def.check(settled.section) : [];
    const dirty = hasEdits(record, name);
    return { settled, checks, dirty, blocked: blocked || checks.length > 0 };
  }

  // ── Form controls ────────────────────────────────────────────────────
  //
  // A control draws one field and reports edits through its access object. Its sync
  // re-reads the value from state; sync(true) also drops whatever the person
  // had half typed.

  function helpLine(field, id) {
    return field.help ? h('p', { class: 'help', id: id + '-help', text: field.help }) : null;
  }

  function problemLine(id) {
    return h('p', { class: 'field-problem', id: id + '-problem', role: 'alert', hidden: true });
  }

  function showProblem(line, input, message) {
    line.textContent = message || '';
    line.hidden = !message;
    input.setAttribute('aria-invalid', String(Boolean(message)));
  }

  function buildToggle(field, access) {
    const id = uid('field');
    const input = h('input', {
      class: 'switch', id, type: 'checkbox', role: 'switch',
      'aria-describedby': describedBy(field.help && id + '-help'),
      change: () => access.set(input.checked),
    });
    const node = h('div', { class: 'field-split' },
      h('div', { class: 'field-text' }, h('label', { class: 'field-label', for: id, text: field.label }), helpLine(field, id)),
      input);
    return { node, sync: () => { input.checked = access.value(); } };
  }

  function buildChoice(field, access) {
    const name = uid('choice');
    const options = field.options.map((option) => {
      const input = h('input', { type: 'radio', name, value: option.value, change: () => access.set(option.value) });
      const node = h('label', { class: 'choice' }, input,
        h('span', { class: 'choice-title', text: option.title }),
        option.text && h('span', { class: 'choice-text', text: option.text }));
      return { option, input, node };
    });
    const node = h('fieldset', null,
      h('legend', { class: 'field-label', text: field.label }),
      field.help && h('p', { class: 'help', text: field.help }),
      h('div', { class: field.options.length === 3 ? 'choices choices-three' : 'choices' }, options.map((item) => item.node)));
    return {
      node,
      sync: () => {
        const value = access.value();
        for (const item of options) item.input.checked = item.option.value === value;
      },
    };
  }

  function buildList(field, access) {
    const id = uid('field');
    const entry = ENTRIES[field.entry];
    const chips = h('ul', { class: 'chips', 'aria-label': field.label });
    const none = h('p', { class: 'chips-none', text: 'None listed.' });
    const problem = problemLine(id);
    const input = h('input', {
      class: 'input', id, type: 'text', placeholder: field.placeholder,
      autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false',
      'aria-describedby': describedBy(field.help && id + '-help', id + '-problem'),
      keydown: (event) => {
        if (event.isComposing || (event.key !== 'Enter' && event.key !== ',')) return;
        event.preventDefault();
        commit();
      },
      paste: (event) => {
        const pasted = event.clipboardData ? event.clipboardData.getData('text').trim() : '';
        if (!ENTRY_SEPARATOR.test(pasted)) return;
        event.preventDefault();
        input.value = (input.value + ' ' + pasted).trim();
        commit();
      },
      // Text left in the box would otherwise be dropped without a word when
      // the person goes on to Save.
      blur: () => { if (input.value.trim()) commit(); },
      input: () => { if (!input.value.trim()) fail(''); },
    });

    function fail(message) {
      showProblem(problem, input, message);
      access.setProblem(message);
    }

    function draw() {
      const values = access.value();
      chips.replaceChildren(...values.map((value) => h('li', { class: 'chip' },
        h('span', { text: value }),
        h('button', {
          class: 'chip-remove', type: 'button', 'aria-label': 'Remove ' + value,
          click: () => {
            access.set(access.value().filter((other) => other !== value));
            draw();
            announce('Removed ' + value + '.');
            input.focus();
          },
        }, icon('close')))));
      chips.hidden = values.length === 0;
      none.hidden = values.length > 0;
    }

    function commit() {
      const typed = input.value.split(ENTRY_SEPARATOR).map((part) => part.trim()).filter(Boolean);
      const values = access.value().slice();
      const refused = [];
      let reason = '';
      for (const raw of typed) {
        const value = entry.clean(raw);
        const why = entry.refuse(value);
        if (why) {
          refused.push(raw);
          reason = reason || why;
        } else if (values.includes(value)) {
          announce(value + ' is already listed.');
        } else {
          values.push(value);
        }
      }
      input.value = refused.join(', ');
      if (values.length !== access.value().length) {
        access.set(values);
        draw();
      }
      fail(reason);
    }

    const node = h('div', null,
      h('label', { class: 'field-label', for: id, text: field.label }),
      helpLine(field, id),
      chips, none,
      h('div', { class: 'entry' }, input, h('button', { class: 'btn', type: 'button', click: () => { commit(); input.focus(); } }, 'Add')),
      problem);
    return {
      node,
      sync: (reset) => {
        if (reset) {
          input.value = '';
          showProblem(problem, input, '');
        }
        draw();
      },
    };
  }

  function buildNumber(field, access) {
    const id = uid('field');
    const amount = (count) => (field.seconds ? count + ' seconds (' + spokenSeconds(count) + ')' : String(count));
    const help = field.help + ' Leave it empty for the default of ' + amount(field.fallback) + '. At most ' + amount(field.max) + '.';
    const hint = h('span', { class: 'input-hint', id: id + '-hint' });
    const problem = problemLine(id);
    const input = h('input', {
      class: 'input input-number', id, type: 'number', inputmode: 'numeric', min: 0, max: field.max, step: 1,
      placeholder: field.fallback,
      'aria-describedby': describedBy(id + '-help', id + '-hint', id + '-problem'),
      input: () => {
        const text = input.value.trim();
        const count = Number(text);
        // A browser reports text that is not a number as empty; badInput is
        // what tells that from a box the person cleared.
        const bad = input.validity.badInput || !Number.isInteger(count) || count < 0 || count > field.max;
        showProblem(problem, input, bad ? 'Enter a whole number from 0 to ' + field.max + ', or leave it empty.' : '');
        access.setProblem(bad ? problem.textContent : '');
        if (!bad) access.set(count);
        describe();
      },
    });

    function describe() {
      const count = access.value();
      if (count === 0) hint.textContent = 'Default: ' + amount(field.fallback);
      else hint.textContent = field.seconds ? spokenSeconds(count) : '';
    }

    const node = h('div', null,
      h('label', { class: 'field-label', for: id, text: field.label }),
      h('p', { class: 'help', id: id + '-help', text: help }),
      h('div', { class: 'number-row' }, input, hint),
      problem);
    return {
      node,
      sync: (reset) => {
        if (reset || !access.problem()) {
          input.value = access.value() ? String(access.value()) : '';
          showProblem(problem, input, '');
        }
        describe();
      },
    };
  }

  function buildMethods(field, access) {
    const boxes = h('div', { class: 'checks' });
    const summary = h('p', { class: 'help', role: 'status' });
    let items = [];

    function chosen() {
      return access.value() ? access.value().split(',') : [];
    }

    function describe() {
      summary.textContent = chosen().length ? 'Only the ticked methods are allowed.' : 'Every method is allowed.';
    }

    function draw() {
      const ticked = chosen();
      const known = field.options.map((option) => option.value);
      // A method this page has no name for stays in the list, shown as the
      // server spells it, so saving cannot drop it.
      const others = ticked.filter((method) => !known.includes(method)).map((method) => ({ value: method, title: method }));
      items = field.options.concat(others).map((option) => {
        const input = h('input', {
          type: 'checkbox', checked: ticked.includes(option.value),
          change: () => {
            access.set(items.filter((item) => item.input.checked).map((item) => item.option.value).join(','));
            describe();
          },
        });
        return { option, input, node: h('label', { class: 'check' }, input, h('span', { text: option.title })) };
      });
      boxes.replaceChildren(...items.map((item) => item.node));
      describe();
    }

    const node = h('fieldset', null,
      h('legend', { class: 'field-label', text: field.label }),
      field.help && h('p', { class: 'help', text: field.help }),
      boxes, summary);
    return { node, sync: draw };
  }

  function buildJSON(field, access) {
    const id = uid('field');
    const problem = problemLine(id);
    const input = h('textarea', {
      class: 'input', id, rows: 8, placeholder: pretty(field.example),
      autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false',
      'aria-describedby': describedBy(field.help && id + '-help', id + '-problem'),
      input: () => {
        const outcome = read(input.value);
        showProblem(problem, input, outcome.problem);
        access.setProblem(outcome.problem);
        if (!outcome.problem) access.set(outcome.value);
      },
    });

    function read(text) {
      if (!text.trim()) return { value: {}, problem: '' };
      let value;
      try {
        value = JSON.parse(text);
      } catch (cause) {
        return { problem: 'This is not valid JSON yet. ' + cause.message };
      }
      return { value, problem: field.refuse(value) };
    }

    function write() {
      const value = access.value();
      input.value = Object.keys(value).length ? pretty(value) : '';
      showProblem(problem, input, '');
    }

    const node = h('div', null,
      h('div', { class: 'editor-row' },
        h('label', { class: 'field-label', for: id, text: field.label }),
        h('button', { class: 'btn btn-small', type: 'button', click: () => { if (!access.problem()) write(); } }, 'Tidy up')),
      helpLine(field, id),
      input, problem);
    return {
      node,
      // The person's own text is kept, layout and all, for as long as it
      // still says what the state holds.
      sync: (reset) => {
        const typed = read(input.value);
        if (reset || (!access.problem() && !sameValue(typed.value, access.value()))) write();
      },
    };
  }

  function buildSelect(field, access) {
    const id = uid('field');
    const input = h('select', {
      class: 'input', id,
      'aria-describedby': describedBy(field.help && id + '-help'),
      change: () => access.set(input.value),
    });

    function fill() {
      const value = access.value();
      const offered = field.options(access.draft());
      if (value && !offered.includes(value)) offered.push(value);
      showOnce(input, offered, () => [h('option', { value: '', text: field.none })].concat(
        offered.map((option) => h('option', { value: option, text: option }))));
      input.value = value;
    }

    const node = h('div', null,
      h('label', { class: 'field-label', for: id, text: field.label }),
      helpLine(field, id),
      h('div', { class: 'select-row' }, input));
    return { node, sync: fill, update: fill };
  }

  // How each kind of field is drawn, and plain: its value in the one form
  // the page edits and compares, where unset and the default are the same.
  const KINDS = Object.freeze({
    [KIND.choice]: { build: buildChoice, plain: (value, field) => token(value) || field.unset || '' },
    [KIND.toggle]: { build: buildToggle, plain: (value) => value === true },
    [KIND.list]: { build: buildList, plain: (value) => (Array.isArray(value) ? value.filter((item) => typeof item === 'string') : []) },
    [KIND.number]: { build: buildNumber, plain: (value) => (Number.isInteger(value) ? value : 0) },
    [KIND.methods]: { build: buildMethods, plain: (value) => (typeof value === 'string' ? value.split(',').map(token).filter(Boolean).join(',') : '') },
    [KIND.json]: { build: buildJSON, plain: (value) => (isRecord(value) ? value : {}) },
    [KIND.select]: { build: buildSelect, plain: (value, field) => field.clean(value) },
  });

  // ── A section's card ─────────────────────────────────────────────────

  function buildField(record, name, field, refresh) {
    if (field.kind === KIND.heading) {
      return { field, wrapper: h('div', { class: 'field-heading' }, h('h3', { text: field.label }), field.help && h('p', { class: 'help', text: field.help })) };
    }
    const kind = KINDS[field.kind];
    const access = {
      value: () => kind.plain(draftSection(record, name)[field.key], field),
      draft: () => draftSection(record, name),
      problem: () => (record.problems[name] || {})[field.key] || '',
      set: (value) => {
        setEdit(record, name, field, value);
        refresh();
      },
      setProblem: (message) => {
        setProblem(record, name, field.key, message);
        refresh();
      },
    };
    const control = kind.build(field, access);
    return { field, control, wrapper: h('div', { class: 'field' }, control.node) };
  }

  function buildCard(record, projectId, name) {
    const def = SECTIONS[name];
    // A problem belongs to text in a box that is gone once the card is
    // rebuilt, and would block saving with nothing to show for it.
    delete record.problems[name];

    const titleId = uid('section');
    const unsaved = h('span', { class: 'pill pill-unsaved', text: 'Unsaved changes', hidden: true });
    const banner = h('div', { class: 'card-pad', hidden: true });
    const body = h('fieldset', { class: 'card-body' });
    const note = h('p', { class: 'card-note', hidden: true });
    const messages = h('div', { class: 'card-messages', hidden: true });
    const status = h('p', { class: 'card-status', role: 'status' });
    const discard = h('button', { class: 'btn btn-quiet', type: 'button', click: () => discardSection(record, card) }, 'Discard');
    const save = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Save');
    const card = { name, record };
    const items = def.fields.map((field) => buildField(record, name, field, () => card.refresh()));
    body.append(...items.map((item) => item.wrapper));

    card.node = h('form', {
      class: 'card', method: 'post', novalidate: true, 'aria-labelledby': titleId,
      submit: (event) => {
        event.preventDefault();
        saveSection(projectId, name);
      },
    },
    h('div', { class: 'card-head' },
      h('div', null, h('h2', { id: titleId, text: def.title }), h('p', { text: def.summary })),
      unsaved),
    banner, body, note, messages,
    h('div', { class: 'card-foot' }, status, h('div', { class: 'card-actions' }, discard, save)));

    card.sync = (reset) => {
      for (const item of items) {
        if (item.control) item.control.sync(reset);
      }
    };

    card.refresh = () => {
      const current = sectionState(record, name);
      const saving = state.saving === card.record && record.savingSection === name;
      const outcome = record.outcomes[name];
      body.disabled = saving;
      for (const item of items) {
        item.wrapper.hidden = current.settled.hidden.has(item.field);
        if (!item.control) continue;
        item.wrapper.classList.toggle('is-edited', Object.hasOwn(record.edits[name] || {}, item.field.key));
        if (item.control.update) item.control.update();
      }
      unsaved.hidden = !current.dirty;

      const closed = def.banner ? def.banner(storedSection(record, name)) : null;
      banner.hidden = !closed;
      showOnce(banner, closed, () => (closed ? [alertBox('warn', closed)] : []));

      const cleared = current.settled.cleared;
      note.hidden = cleared.length === 0;
      note.textContent = cleared.length
        ? 'Saving also clears ' + LIST_FORMAT.format(cleared) + ': under these choices ' + (cleared.length === 1 ? 'it does' : 'they do') + ' not apply.'
        : '';

      const failure = outcome && outcome.kind !== OUTCOME.saved ? outcome : null;
      messages.hidden = !failure && current.checks.length === 0;
      showOnce(messages, [current.checks, failure], () => current.checks.map((text) => alertBox('warn', { text }))
        .concat(failure ? [alertBox(failure.kind === OUTCOME.conflict ? 'warn' : 'error', failure.problem)] : []));

      let words = '';
      let tone = '';
      if (saving) {
        words = 'Saving…';
      } else if (current.blocked) {
        words = 'Fix what is marked above to save.';
        tone = 'is-blocked';
      } else if (current.dirty) {
        words = 'Unsaved changes';
        tone = 'is-unsaved';
      } else if (outcome && outcome.kind === OUTCOME.saved) {
        // Without this, a setting saved a moment ago and not yet enforced
        // looks like a save that did not work.
        words = applyDelay() ? 'Saved. It takes effect within ' + applyDelay() + '.' : 'Saved';
        tone = 'is-saved';
      }
      showOnce(status, [words, tone], () => (words ? [tone === 'is-saved' && icon('check'), saving && h('span', { class: 'spinner', 'aria-hidden': 'true' }), words].filter(Boolean) : []));
      status.className = 'card-status ' + tone;

      setDisabled(save, !current.dirty || current.blocked || Boolean(state.saving));
      setDisabled(discard, saving || !(current.dirty || Object.keys(record.problems[name] || {}).length));
      refreshDots();
    };
    return card;
  }

  function discardSection(record, card) {
    if (state.saving === record) return;
    delete record.edits[card.name];
    delete record.problems[card.name];
    delete record.outcomes[card.name];
    card.sync(true);
    refreshCards();
    announce(SECTIONS[card.name].title + ': changes discarded.');
  }

  function refreshCards() {
    for (const card of view.cards) card.refresh();
    refreshDots();
  }

  function refreshDots() {
    const record = view.projectId ? recordFor(view.projectId) : null;
    for (const page of PAGES) {
      const dot = view.dots.get(page.id);
      if (dot) dot.hidden = !(record && (page.sections || []).some((name) => hasEdits(record, name)));
    }
  }

  // One section is saved at a time, and one save at a time per project: each
  // write names the version it read, so a second write sent alongside would
  // be refused as a conflict with the first.
  async function saveSection(projectId, name) {
    const record = recordFor(projectId);
    const current = sectionState(record, name);
    if (state.saving || record.status !== LOAD.ready || !current.dirty || current.blocked) return;

    const focused = document.activeElement;
    state.saving = record;
    record.savingSection = name;
    delete record.outcomes[name];
    refreshCards();

    let outcome;
    try {
      const answer = await authed('UpdateProjectSettings', {
        projectId,
        settingsJson: JSON.stringify({ [name]: current.settled.section }),
        expectedVersion: record.version,
      });
      acceptSettings(record, answer);
      delete record.edits[name];
      outcome = { kind: OUTCOME.saved };
    } catch (err) {
      if (err.code === Code.sessionEnded) return;
      outcome = await saveFailure(record, projectId, err);
      if (!outcome) return;
    }

    state.saving = null;
    record.savingSection = '';
    record.outcomes[name] = outcome;
    for (const card of view.cards) {
      if (card.record === record) card.sync(outcome.kind === OUTCOME.saved && card.name === name);
    }
    refreshCards();
    if (outcome.kind === OUTCOME.saved) announce(SECTIONS[name].title + ' saved.');
    // The fields were disabled while the save ran, which drops focus.
    if (focused && focused.isConnected && document.activeElement === document.body) focused.focus();
  }

  // Why a save failed, as the card's outcome; null when the session ended.
  // A conflict loads what the server holds now and leaves the person's edits
  // over it: an edit names only the fields they changed, so the other
  // person's changes show through everywhere else.
  async function saveFailure(record, projectId, err) {
    if (err.code !== Code.aborted) return { kind: OUTCOME.failed, problem: saveProblem(err) };
    try {
      acceptSettings(record, await authed('GetProjectSettings', { projectId }));
    } catch (reloadErr) {
      if (reloadErr.code === Code.sessionEnded) return null;
      return {
        kind: OUTCOME.failed,
        problem: { text: "Someone else changed this project's settings while you were editing, and the latest could not be loaded. Your changes are still here. Save again to retry." },
      };
    }
    return {
      kind: OUTCOME.conflict,
      problem: {
        title: 'Someone else changed these settings',
        text: "This project's settings changed while you were editing, so nothing was saved. The latest are loaded now and your unsaved changes are still in the form. Check them, then save again.",
      },
    };
  }

  // ── Loading ──────────────────────────────────────────────────────────

  async function loadProjects() {
    const session = state.session;
    state.projects = null;
    state.refusal = null;
    render();
    try {
      const answer = await authed('ListMyProjects', {});
      state.projects = Array.isArray(answer.projects) ? answer.projects.filter((project) => isRecord(project) && project.projectId) : [];
      state.canCreateProject = answer.canCreateProject === true;
    } catch (err) {
      if (err.code === Code.sessionEnded) return;
      state.refusal = err;
    }
    if (state.session === session) render({ focus: true });
  }

  // Marks the settings as loading before it first waits, so the caller can
  // draw that state straight away.
  async function loadSettings(projectId) {
    const session = state.session;
    const record = recordFor(projectId);
    record.status = LOAD.loading;
    record.failure = null;
    try {
      acceptSettings(record, await authed('GetProjectSettings', { projectId }));
      record.status = LOAD.ready;
    } catch (err) {
      if (err.code === Code.sessionEnded) return;
      record.status = LOAD.failed;
      record.failure = err;
    }
    if (state.session === session && view.projectId === projectId) renderMain();
  }

  // ── Routes ───────────────────────────────────────────────────────────

  const ROUTE_PROJECT = 'p';
  const HOME_HREF = '#/';
  const PRODUCT_TITLE = 'Project console';

  function projectHref(projectId, page) {
    return HOME_HREF + ROUTE_PROJECT + '/' + encodeURIComponent(projectId) + '/' + page;
  }

  function parseRoute() {
    const parts = location.hash.slice(1).split('/').filter(Boolean).map((part) => {
      try {
        return decodeURIComponent(part);
      } catch (cause) {
        return '';
      }
    });
    if (parts[0] !== ROUTE_PROJECT || !parts[1]) return { projectId: '', page: '' };
    return { projectId: parts[1], page: PAGES.some((page) => page.id === parts[2]) ? parts[2] : PAGE_OVERVIEW };
  }

  function currentProject(route) {
    return (state.projects || []).find((project) => project.projectId === route.projectId) || null;
  }

  // ── Pages ────────────────────────────────────────────────────────────

  const shell = {
    root: byId('app'), frame: byId('frame'), sidebar: byId('sidebar'), main: byId('main'),
    account: byId('account-email'), signOut: byId('sign-out'), skip: byId('skip'),
  };

  function render(options) {
    if (!state.session) return;
    const route = parseRoute();
    const project = currentProject(route);
    const entered = project && view.projectId !== project.projectId;
    view.projectId = project ? project.projectId : '';
    view.page = project ? route.page : '';
    // Settings are read afresh each time a project is opened; edits made
    // earlier in this visit are kept and laid over them.
    if (entered) loadSettings(project.projectId);
    renderSidebar(project);
    renderMain(options);
  }

  function renderSidebar(project) {
    shell.frame.classList.toggle('frame-wide', !project);
    shell.sidebar.hidden = !project;
    view.dots = new Map();
    if (!project) {
      shell.sidebar.replaceChildren();
      return;
    }
    const picker = h('select', {
      class: 'input', id: 'project-picker',
      change: () => { location.hash = projectHref(picker.value, view.page); },
    }, state.projects.map((other) => h('option', { value: other.projectId, text: other.name || other.projectId })));
    picker.value = project.projectId;

    let current = null;
    const links = PAGES.map((page) => {
      const dot = h('span', { class: 'nav-dot', role: 'img', 'aria-label': 'unsaved changes', hidden: true });
      view.dots.set(page.id, dot);
      const link = h('a', { href: projectHref(project.projectId, page.id), 'aria-current': page.id === view.page ? 'page' : null },
        h('span', { text: page.title }), dot);
      if (page.id === view.page) current = link;
      return h('li', null, link);
    });

    shell.sidebar.replaceChildren(
      h('a', { class: 'back', href: HOME_HREF }, icon('back'), 'All projects'),
      h('label', { class: 'eyebrow', for: 'project-picker', text: 'Project' }),
      picker,
      h('nav', { 'aria-label': 'Project settings' }, h('ul', { class: 'nav' }, links)));
    // On a phone the pages are a strip that scrolls sideways.
    if (current) current.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function renderMain(options) {
    const focus = Boolean(options && options.focus);
    const held = shell.main.contains(document.activeElement);
    const route = parseRoute();
    view.cards = [];
    shell.main.replaceChildren(...mainNodes(route).filter(Boolean));
    for (const card of view.cards) card.sync(true);
    refreshCards();
    if (focus) window.scrollTo(0, 0);
    if (focus || held) {
      const heading = shell.main.querySelector('h1');
      if (heading) heading.focus({ preventScroll: true });
    }
  }

  function mainNodes(route) {
    if (state.refusal) return refusalPage(state.refusal);
    if (!state.projects) return loadingPage();
    if (!route.projectId) return projectsPage();
    const project = currentProject(route);
    if (!project) return missingProjectPage();
    const page = PAGES.find((candidate) => candidate.id === route.page);
    document.title = page.title + ' · ' + (project.name || project.projectId) + ' · ' + PRODUCT_TITLE;
    return page.sections ? settingsPage(project, page) : overviewPage(project, page);
  }

  function pageHead(eyebrow, title, lead, actions) {
    return h('header', { class: 'page-head' },
      h('div', null,
        eyebrow && h('p', { class: 'eyebrow', text: eyebrow }),
        h('h1', { tabindex: '-1', text: title }),
        lead && h('p', { class: 'lead', text: lead })),
      actions);
  }

  function statePage(options) {
    document.title = options.title + ' · ' + PRODUCT_TITLE;
    return [h('section', { class: 'card empty' },
      h('span', { class: 'empty-mark' }, icon(options.icon)),
      h('h1', { tabindex: '-1', text: options.title }),
      h('p', { text: options.text }),
      options.detail && h('p', { class: 'alert-detail', text: options.detail }),
      options.actions && h('div', { class: 'actions' }, options.actions))];
  }

  function skeleton(lines) {
    return h('div', { class: 'card-pad', 'aria-hidden': 'true' },
      Array.from({ length: lines }, (unused, index) => h('div', { class: index % 2 ? 'skeleton skeleton-line is-short' : 'skeleton skeleton-line' })));
  }

  function loadingPage() {
    document.title = PRODUCT_TITLE;
    return [
      h('div', { class: 'page-head' }, h('div', { class: 'skeleton skeleton-title' }),
        serverOptions.selfServiceProjects === true && h('button', { class: 'btn btn-primary', type: 'button', disabled: true }, icon('plus'), 'New project')),
      h('p', { class: 'visually-hidden', role: 'status', text: 'Loading your projects.' }),
      h('div', { class: 'skeleton skeleton-block' }),
    ];
  }

  function refusalPage(err) {
    const again = h('button', { class: 'btn', type: 'button', click: loadProjects }, 'Try again');
    if (err.code === Code.unimplemented) {
      return statePage({ icon: 'lock', title: 'The console is not turned on', text: 'This server does not offer the project console. Its operator can turn it on.' });
    }
    if (needsVerifiedEmail(err)) return verifyEmailPage();
    if (err.code === Code.permissionDenied || err.code === Code.failedPrecondition) {
      return statePage({
        icon: 'lock', title: 'This account cannot use the console',
        text: 'The console is for a person who signed up on this server with their own account.',
        detail: said(err), actions: [again],
      });
    }
    const common = commonProblem(err);
    return statePage({
      icon: 'alert', title: 'Your projects could not be loaded',
      text: common ? common.text : 'Something went wrong on the way.', detail: common ? '' : said(err), actions: [again],
    });
  }

  function verifyEmailPage() {
    const status = h('p', { class: 'help', role: 'status' });
    const send = h('button', {
      class: 'btn', type: 'button',
      click: async () => {
        setBusy(send, true, 'Sending…');
        try {
          await authed('SendEmailVerification', {});
          status.textContent = 'Sent. Follow the link in the message, then check again.';
        } catch (err) {
          if (err.code === Code.sessionEnded) return;
          const common = commonProblem(err);
          status.textContent = common ? common.text : 'The message could not be sent. ' + said(err);
        }
        setBusy(send, false);
      },
    }, 'Send the message again');
    const nodes = statePage({
      icon: 'mail', title: 'Verify your email address',
      text: 'The console opens once your email address is verified. Follow the link in the verification message sent to you.',
      actions: [send, h('button', { class: 'btn btn-primary', type: 'button', click: loadProjects }, 'Check again')],
    });
    nodes[0].append(status);
    return nodes;
  }

  function projectsPage() {
    document.title = 'Projects · ' + PRODUCT_TITLE;
    const lead = 'A project is its own set of accounts, with its own rules for who can sign in.';
    const create = () => state.canCreateProject &&
      h('button', { class: 'btn btn-primary', type: 'button', click: openProjectDialog }, icon('plus'), 'New project');
    if (!state.projects.length) {
      return [pageHead('', 'Projects', lead), h('section', { class: 'card empty' },
        h('span', { class: 'empty-mark' }, icon('folder')),
        h('h2', { text: 'No projects yet' }),
        h('p', {
          text: state.canCreateProject
            ? 'Create your first project to get the key your app signs people in with, then choose who may sign in.'
            : 'You are not a member of any project. A project you are added to will show up here.',
        }),
        state.canCreateProject && h('div', { class: 'actions' }, create()))];
    }
    return [
      pageHead('', 'Projects', lead, create()),
      h('ul', { class: 'card project-list' }, state.projects.map(projectRow)),
      !state.canCreateProject && h('p', { class: 'footnote', text: 'New projects are created by the operator of this server.' }),
    ];
  }

  // A role this page has no name for is shown as the server spells it.
  const ROLE_LABELS = Object.freeze({ owner: 'Owner', admin: 'Admin' });

  function roleLabel(role) {
    return ROLE_LABELS[role] || role || 'Member';
  }

  function projectRow(project) {
    const record = state.records.get(project.projectId);
    const name = project.name || project.projectId;
    return h('li', null, h('a', { class: 'project-row', href: projectHref(project.projectId, PAGE_OVERVIEW) },
      h('span', { class: 'project-avatar', 'aria-hidden': 'true', text: name.trim().charAt(0) }),
      h('span', { class: 'project-main' },
        h('span', { class: 'project-name', text: name }),
        h('span', { class: 'project-id', text: project.projectId })),
      record && hasUnsavedEdits(record) && h('span', { class: 'pill pill-unsaved', text: 'Unsaved changes' }),
      h('span', { class: 'pill', text: roleLabel(project.role) }),
      h('span', { class: 'project-date', text: formatDate(project.createdAt) }),
      icon('chevron')));
  }

  function missingProjectPage() {
    return statePage({
      icon: 'folder', title: 'Project not found',
      text: 'You are not a member of a project with this id.',
      actions: [h('a', { class: 'btn', href: HOME_HREF }, 'All projects')],
    });
  }

  function copyable(value, label) {
    const status = h('span', { class: 'copy-status', role: 'status' });
    // Without the clipboard, the value can still be selected whole and copied.
    const button = navigator.clipboard && h('button', {
      class: 'btn btn-small', type: 'button',
      click: () => {
        navigator.clipboard.writeText(value).then(() => {
          status.textContent = 'Copied';
          setTimeout(() => { status.textContent = ''; }, COPIED_NOTICE_MS);
        }, () => {
          status.textContent = 'Could not copy. Select the text and copy it.';
        });
      },
    }, icon('copy'), label);
    return h('div', { class: 'copyable' }, h('code', { class: 'code-value', text: value }), button, status);
  }

  function fact(term, value) {
    return h('div', { class: 'fact' }, h('dt', { text: term }), h('dd', null, value));
  }

  function overviewPage(project, page) {
    const record = recordFor(project.projectId);
    return [
      pageHead(project.name || project.projectId, page.title, page.lead),
      accessSummary(project, record),
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('div', null, h('h2', { text: 'Publishable key' }),
          h('p', { text: 'Your app sends this key in the ' + PROJECT_KEY_HEADER + ' request header, so the server knows which project a request is for. It names the project and is not a secret.' }))),
        h('div', { class: 'card-pad' }, project.publishableKey
          ? [copyable(project.publishableKey, 'Copy key'), h('pre', { class: 'code-block', text: PROJECT_KEY_HEADER + ': ' + project.publishableKey })]
          : alertBox('warn', { text: "This project has no publishable key. Ask the server's operator to issue one." }))),
      h('section', { class: 'card' },
        h('div', { class: 'card-head' }, h('h2', { text: 'Project' })),
        h('dl', null,
          fact('Name', project.name || 'Unnamed'),
          fact('Project ID', copyable(project.projectId, 'Copy ID')),
          fact('Your role', [h('span', { class: 'pill', text: roleLabel(project.role) }), ' ', h('span', { class: 'help', text: 'Owners and admins can both change these settings.' })]),
          fact('Created', formatDate(project.createdAt) || 'Unknown'))),
    ];
  }

  function accessSummary(project, record) {
    const head = h('div', { class: 'card-head' }, h('h2', { text: 'Who can sign in' }));
    if (record.status === LOAD.failed) return h('section', { class: 'card' }, head, h('div', { class: 'card-pad' }, loadFailure(project, record)));
    if (record.status !== LOAD.ready) return h('section', { class: 'card' }, head, skeleton(2));

    const mode = token(storedSection(record, 'access').mode);
    const option = SECTIONS.access.fields[0].options.find((candidate) => candidate.value === mode);
    const change = h('a', { class: option ? 'btn' : 'btn btn-primary', href: projectHref(project.projectId, PAGE_ACCESS) }, option ? 'Change' : 'Choose who can sign in');
    const summary = option
      ? alertBox(mode === MODE.closed ? 'warn' : 'ok', { title: option.title, text: option.text, detail: applyDelayNote() }, [change])
      : alertBox('warn', {
        title: 'Closed: no access mode chosen',
        text: 'Nobody can sign up or sign in to this project until you choose who may. Every new project starts this way.',
        detail: applyDelayNote(),
      }, [change]);
    return h('section', { class: 'card' }, head, h('div', { class: 'card-pad' }, summary));
  }

  function loadFailure(project, record) {
    const again = h('button', {
      class: 'btn', type: 'button',
      click: () => {
        loadSettings(project.projectId);
        renderMain();
      },
    }, 'Try again');
    return alertBox('error', loadProblem(record.failure), [again]);
  }

  function settingsPage(project, page) {
    const record = recordFor(project.projectId);
    const head = pageHead(project.name || project.projectId, page.title, page.lead);
    if (record.status === LOAD.failed) return [head, loadFailure(project, record)];
    if (record.status !== LOAD.ready) {
      return [head, h('p', { class: 'visually-hidden', role: 'status', text: 'Loading settings.' })].concat(
        page.sections.map(() => h('div', { class: 'skeleton skeleton-block' })));
    }
    view.cards = page.sections.map((name) => buildCard(record, project.projectId, name));
    return [head].concat(view.cards.map((card) => card.node));
  }

  // ── New project ──────────────────────────────────────────────────────

  const projectDialog = {
    root: byId('project-dialog'), form: byId('project-form'), name: byId('project-name'),
    message: byId('project-message'), create: byId('project-create'), cancel: byId('project-cancel'),
    busy: false,
  };

  function openProjectDialog() {
    projectDialog.name.value = '';
    showIn(projectDialog.message, 'error', null);
    projectDialog.root.showModal();
    projectDialog.name.focus();
  }

  async function createProject() {
    if (projectDialog.busy) return;
    const session = state.session;
    const name = projectDialog.name.value.trim();
    if (!name) {
      showIn(projectDialog.message, 'error', { text: 'Give the project a name.' });
      projectDialog.name.focus();
      return;
    }
    projectDialog.busy = true;
    setBusy(projectDialog.create, true, 'Creating…');
    showIn(projectDialog.message, 'error', null);
    try {
      const answer = await authed('CreateProject', { name });
      if (!isRecord(answer.project) || !answer.project.projectId) throw new RpcError(Code.unreadable);
      state.projects = (state.projects || []).concat(answer.project);
      projectDialog.root.close();
      announce('Project ' + name + ' created.');
      location.hash = projectHref(answer.project.projectId, PAGE_OVERVIEW);
    } catch (err) {
      if (err.code !== Code.sessionEnded) showIn(projectDialog.message, 'error', createProblem(err));
      // Creating has no retry key, so a request whose answer was lost may
      // have made the project: show the person the list as it now is.
      if (err.code === Code.network || err.code === Code.unreadable) refreshProjects(session);
    }
    projectDialog.busy = false;
    setBusy(projectDialog.create, false);
  }

  async function refreshProjects(session) {
    try {
      const answer = await authed('ListMyProjects', {});
      if (state.session !== session || !Array.isArray(answer.projects)) return;
      state.projects = answer.projects.filter((project) => isRecord(project) && project.projectId);
      state.canCreateProject = answer.canCreateProject === true;
      render();
    } catch (err) {
      // The list on screen stays; the dialog already says what went wrong.
    }
  }

  // ── Confirming ───────────────────────────────────────────────────────

  const DIALOG_ACCEPTED = 'accepted';
  const confirmDialog = { root: byId('confirm-dialog'), title: byId('confirm-title'), text: byId('confirm-text'), accept: byId('confirm-accept'), cancel: byId('confirm-cancel') };

  function confirm(options) {
    confirmDialog.title.textContent = options.title;
    confirmDialog.text.textContent = options.text;
    confirmDialog.accept.textContent = options.accept;
    confirmDialog.root.returnValue = '';
    confirmDialog.root.showModal();
    return new Promise((resolve) => {
      confirmDialog.root.addEventListener('close', () => resolve(confirmDialog.root.returnValue === DIALOG_ACCEPTED), { once: true });
    });
  }

  // ── Signing in and out ───────────────────────────────────────────────

  const signin = {
    root: byId('signin'), lead: byId('signin-lead'), message: byId('signin-message'),
    form: byId('signin-form'), email: byId('signin-email'), password: byId('signin-password'), submit: byId('signin-submit'),
    codeForm: byId('code-form'), code: byId('code-input'), codeSubmit: byId('code-submit'), codeBack: byId('code-back'),
    challenge: '',
  };

  function showPasswordStep(kind, problem) {
    signin.challenge = '';
    signin.code.value = '';
    signin.password.value = '';
    signin.codeForm.hidden = true;
    signin.form.hidden = false;
    showIn(signin.message, kind, problem);
    (signin.email.value ? signin.password : signin.email).focus();
  }

  function showCodeStep(challenge) {
    signin.challenge = challenge;
    signin.form.hidden = true;
    signin.codeForm.hidden = false;
    showIn(signin.message, 'info', { text: 'Your password is right. This account also asks for a verification code.' });
    signin.code.focus();
  }

  function showSignIn(kind, problem) {
    for (const dialog of document.querySelectorAll('dialog[open]')) dialog.close();
    shell.root.hidden = true;
    signin.root.hidden = false;
    document.title = PRODUCT_TITLE;
    showPasswordStep(kind, problem);
  }

  function startSession(answer, email) {
    if (!answer.accessToken || !answer.refreshToken) {
      showPasswordStep('error', { text: 'The server did not open a session for this account.' });
      return;
    }
    state.session = { accessToken: answer.accessToken, refreshToken: answer.refreshToken, refreshing: null };
    shell.account.textContent = (isRecord(answer.user) && answer.user.email) || email;
    signin.root.hidden = true;
    shell.root.hidden = false;
    loadProjects();
  }

  async function submitPassword() {
    const email = signin.email.value.trim();
    const password = signin.password.value;
    if (!email || !password) {
      showIn(signin.message, 'error', { text: 'Enter your email address and your password.' });
      (email ? signin.password : signin.email).focus();
      return;
    }
    setBusy(signin.submit, true, 'Signing in…');
    showIn(signin.message, '', null);
    try {
      const answer = await rpc('PasswordLogin', { email, password });
      signin.password.value = '';
      if (answer.totpRequired && answer.loginChallengeId) showCodeStep(answer.loginChallengeId);
      else startSession(answer, email);
    } catch (err) {
      showPasswordStep('error', signInProblem(err));
    }
    setBusy(signin.submit, false);
  }

  async function submitCode() {
    const code = signin.code.value.trim();
    if (!code) {
      showIn(signin.message, 'error', { text: 'Enter the verification code.' });
      signin.code.focus();
      return;
    }
    setBusy(signin.codeSubmit, true, 'Verifying…');
    showIn(signin.message, '', null);
    try {
      const answer = await rpc('VerifyTotp', { loginChallengeId: signin.challenge, code });
      startSession(answer, signin.email.value.trim());
      signin.code.value = '';
    } catch (err) {
      // The server spends the sign-in's challenge on the first code it is
      // shown, right or wrong, so the way on is the password again.
      showPasswordStep('error', codeProblem(err));
    }
    setBusy(signin.codeSubmit, false);
  }

  function endSession(session, problem) {
    if (state.session !== session) return;
    state.session = null;
    state.projects = null;
    state.canCreateProject = false;
    state.refusal = null;
    state.saving = null;
    state.records = new Map();
    view.projectId = '';
    view.page = '';
    view.cards = [];
    shell.account.textContent = '';
    shell.main.replaceChildren();
    shell.sidebar.replaceChildren();
    showSignIn(problem ? 'warn' : '', problem);
  }

  async function signOut() {
    const session = state.session;
    if (!session) return;
    if (anyUnsavedEdits()) {
      const sure = await confirm({
        title: 'Sign out with unsaved changes?',
        text: 'Changes you have not saved will be lost.',
        accept: 'Sign out',
      });
      if (!sure || state.session !== session) return;
    }
    const refreshToken = session.refreshToken;
    // Whoever uses this browser next should not find the address waiting.
    signin.email.value = '';
    endSession(session, null);
    try {
      await rpc('Logout', { refreshToken });
    } catch (err) {
      if (!state.session) {
        showIn(signin.message, 'warn', { text: 'You are signed out of this page, but the server could not be told. That session lasts until it expires on its own.' });
      }
    }
  }

  // ── Wiring ───────────────────────────────────────────────────────────

  signin.lead.textContent = serverOptions.selfServiceProjects === true
    ? 'Create projects and decide who can sign in to them.'
    : 'Manage the projects you belong to.';

  signin.form.addEventListener('submit', (event) => {
    event.preventDefault();
    submitPassword();
  });
  signin.codeForm.addEventListener('submit', (event) => {
    event.preventDefault();
    submitCode();
  });
  signin.codeBack.addEventListener('click', () => showPasswordStep('', null));

  shell.signOut.addEventListener('click', signOut);
  shell.skip.addEventListener('click', () => shell.main.focus());

  projectDialog.form.addEventListener('submit', (event) => {
    event.preventDefault();
    createProject();
  });
  projectDialog.cancel.addEventListener('click', () => { if (!projectDialog.busy) projectDialog.root.close(); });
  projectDialog.root.addEventListener('cancel', (event) => { if (projectDialog.busy) event.preventDefault(); });

  confirmDialog.accept.addEventListener('click', () => confirmDialog.root.close(DIALOG_ACCEPTED));
  confirmDialog.cancel.addEventListener('click', () => confirmDialog.root.close(''));

  window.addEventListener('hashchange', () => render({ focus: true }));
  window.addEventListener('beforeunload', (event) => {
    if (!anyUnsavedEdits()) return;
    event.preventDefault();
    // Some browsers ask before leaving only when this is set.
    event.returnValue = '';
  });

  showSignIn('', null);
})();
</script>
</body>
</html>
