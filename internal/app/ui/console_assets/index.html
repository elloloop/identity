<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Project console</title>
<style nonce="{{.Nonce}}">
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --sunken: #f1f2f5;
  --line: #dde0e6;
  --line-strong: #c2c7d0;
  --text: #161a22;
  --muted: #5a6373;
  --accent: #0d6b63;
  --accent-strong: #0a5750;
  --accent-soft: #e2f2ef;
  --on-accent: #ffffff;
  --danger: #b3261e;
  --danger-soft: #fdecea;
  --danger-line: #f1b5b0;
  --warn: #7a4f00;
  --warn-soft: #fff4d6;
  --warn-line: #e6c263;
  --ok: #1a7446;
  --knob: #ffffff;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
  --radius: 10px;
  --radius-control: 7px;
  --topbar: 52px;
  --sidebar: 256px;
  --gutter: 20px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1015;
    --surface: #151920;
    --sunken: #1b2029;
    --line: #272d38;
    --line-strong: #3b4351;
    --text: #e7eaf0;
    --muted: #9ba4b3;
    --accent: #4fc9ba;
    --accent-strong: #6fd8cb;
    --accent-soft: #11302c;
    --on-accent: #04211d;
    --danger: #ff9389;
    --danger-soft: #371a18;
    --danger-line: #6e2f2a;
    --warn: #f3c969;
    --warn-soft: #30270f;
    --warn-line: #6f581c;
    --ok: #62d394;
    --knob: #f4f6f8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
h1, h2, h3, p, ul, dl, dd, fieldset, legend, pre { margin: 0; padding: 0; }
ul { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1 { font-size: 22px; line-height: 1.25; font-weight: 650; letter-spacing: -0.01em; }
h1:focus-visible { outline: none; }
h2 { font-size: 15px; line-height: 1.35; font-weight: 650; }
h3 { font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
code { font-family: var(--mono); font-size: 13px; }
.lead { margin-top: 4px; max-width: 64ch; color: var(--muted); }
.help { max-width: 66ch; color: var(--muted); font-size: 13px; }
.eyebrow { display: block; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.spinner { width: 14px; height: 14px; flex: none; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); font-size: 15px; font-weight: 650; text-decoration: none; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.mark-ground { fill: var(--accent); }
.mark-figure { fill: none; stroke: var(--on-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600; line-height: 1; text-decoration: none; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--sunken); }
.btn-primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { border-color: var(--accent-strong); background: var(--accent-strong); }
.btn-quiet { border-color: transparent; background: transparent; }
.btn-small { min-height: 28px; padding: 0 10px; font-size: 12px; }
.btn-block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.btn:disabled:hover, .btn[aria-disabled="true"]:hover { background: var(--surface); }
.btn-primary:disabled:hover, .btn-primary[aria-disabled="true"]:hover { border-color: var(--accent); background: var(--accent); }
.btn-quiet[aria-disabled="true"]:hover { background: transparent; }

.input { width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--surface); color: var(--text); }
.input::placeholder { color: var(--muted); opacity: 0.8; }
.input:focus-visible { outline-offset: 0; border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--danger); }
select.input { -webkit-appearance: none; appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
textarea.input { display: block; min-height: 148px; margin-top: 8px; resize: vertical; font-family: var(--mono); font-size: 13px; line-height: 1.5; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill-unsaved { border-color: var(--warn-line); background: var(--warn-soft); color: var(--warn); }
.pill-unsaved::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.alert { display: flex; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); }
.alert > .icon { margin-top: 2px; color: var(--muted); }
.alert-text { display: grid; gap: 4px; min-width: 0; }
.alert-detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.alert-error { border-color: var(--danger-line); background: var(--danger-soft); }
.alert-error > .icon { color: var(--danger); }
.alert-warn { border-color: var(--warn-line); background: var(--warn-soft); }
.alert-warn > .icon { color: var(--warn); }
.alert-ok > .icon { color: var(--ok); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

.auth { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 384px; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.auth-card h1 { margin-top: 22px; }
.auth-card form { display: grid; gap: 14px; margin-top: 20px; }
.auth-message { margin-top: 16px; }
.auth-foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.stack { display: grid; gap: 6px; }
.field-label { display: block; font-weight: 600; }

.skip { position: absolute; top: -48px; left: 12px; z-index: 30; }
.skip:focus { top: 9px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: var(--topbar); padding: 0 var(--gutter); border-bottom: 1px solid var(--line); background: var(--surface); }
.topbar-end { display: flex; align-items: center; gap: 12px; min-width: 0; }
.account { max-width: 32ch; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }

.frame { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); align-items: start; }
.frame-wide { grid-template-columns: minmax(0, 1fr); }
.sidebar { position: sticky; top: var(--topbar); height: calc(100vh - var(--topbar)); padding: 16px 12px 24px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; padding: 4px 8px; border-radius: 6px; color: var(--muted); font-size: 13px; text-decoration: none; }
.back:hover { background: var(--sunken); color: var(--text); }
.sidebar .eyebrow { margin-bottom: 6px; padding: 0 8px; }
.nav { display: grid; gap: 2px; margin-top: 16px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 7px; color: var(--text); font-weight: 500; text-decoration: none; }
.nav a:hover { background: var(--sunken); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.nav-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--warn); }

.content { width: 100%; max-width: 860px; padding: 28px 32px 72px; }
.content:focus { outline: none; }
.frame-wide .content { margin: 0 auto; }
.content > * + * { margin-top: var(--gutter); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
.footnote { color: var(--muted); font-size: 13px; }

.card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px var(--gutter); }
.card-head p { max-width: 66ch; margin-top: 2px; color: var(--muted); font-size: 13px; }
.card-pad { padding: 0 var(--gutter) 16px; }
.card-pad > * + * { margin-top: 12px; }
.card-body { padding: 0 var(--gutter); }
.card-note { margin: 0 var(--gutter) 16px; color: var(--muted); font-size: 13px; }
.card-messages { display: grid; gap: 10px; margin: 0 var(--gutter) 16px; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px var(--gutter); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); background: var(--sunken); }
.card-status { display: inline-flex; align-items: center; gap: 6px; min-height: 20px; color: var(--muted); font-size: 13px; }
.card-status.is-unsaved { color: var(--warn); }
.card-status.is-saved { color: var(--ok); }
.card-status.is-blocked { color: var(--danger); }
.card-actions { display: flex; gap: 8px; margin-left: auto; }

.field { position: relative; padding: 16px 0; border-top: 1px solid var(--line); }
.field.is-edited::before { content: ""; position: absolute; top: 16px; bottom: 16px; left: calc(-1 * var(--gutter)); width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.field .help { margin-top: 2px; }
.field-heading { padding-top: 18px; border-top: 1px solid var(--line); }
.field-heading + .field { padding-top: 10px; border-top: 0; }
.field-split { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.field-text { min-width: 0; }
.field-problem { margin-top: 6px; color: var(--danger); font-size: 13px; }

.switch { -webkit-appearance: none; appearance: none; position: relative; width: 38px; height: 22px; flex: none; margin: 1px 0 0; border: 0; border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background 0.15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--knob); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(16px); }
.switch:disabled { opacity: 0.5; cursor: not-allowed; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.choices-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice { position: relative; display: grid; gap: 2px; align-content: start; padding: 11px 14px 11px 40px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; }
.choice:hover { border-color: var(--muted); }
.choice input { position: absolute; top: 13px; left: 14px; width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.choice input:focus-visible { outline: none; }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice-title { font-weight: 600; }
.choice-text { color: var(--muted); font-size: 13px; }

.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 10px 0 8px; }
.check { display: flex; align-items: center; gap: 8px; }
.check input { width: 16px; height: 16px; flex: none; margin: 0; accent-color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 2px 3px 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken); font-size: 13px; }
.chip span { overflow-wrap: anywhere; }
.chip-remove { display: grid; place-items: center; width: 22px; height: 22px; flex: none; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; }
.chip-remove:hover { background: var(--line); color: var(--text); }
.chips-none { margin-top: 10px; color: var(--muted); font-size: 13px; font-style: italic; }
.entry { display: flex; gap: 8px; margin-top: 10px; }
.entry .input { max-width: 380px; }

.number-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.input-number { width: 140px; }
.input-hint { color: var(--muted); font-size: 13px; }
.editor-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 6px; }
.select-row { max-width: 320px; margin-top: 8px; }

.project-list { overflow: hidden; }
.project-list li + li { border-top: 1px solid var(--line); }
.project-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--text); text-decoration: none; }
.project-row:hover { background: var(--sunken); }
.project-row:focus-visible { outline-offset: -2px; }
.project-row > .icon { color: var(--muted); }
.project-avatar { display: grid; place-items: center; width: 36px; height: 36px; flex: none; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: 15px; font-weight: 700; text-transform: uppercase; }
.project-main { display: grid; flex: 1; min-width: 0; }
.project-name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.project-id { overflow: hidden; color: var(--muted); font-family: var(--mono); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.project-date { color: var(--muted); font-size: 13px; white-space: nowrap; }

.empty { display: grid; justify-items: center; gap: 10px; padding: 48px 24px; text-align: center; }
.empty p { max-width: 48ch; color: var(--muted); }
.empty .actions { justify-content: center; }
.empty-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--sunken); color: var(--muted); }

.fact { display: grid; grid-template-columns: 160px minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px var(--gutter); border-top: 1px solid var(--line); }
.fact dt { color: var(--muted); font-size: 13px; }
.copyable { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.code-value { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sunken); overflow-wrap: anywhere; user-select: all; }
.copy-status { color: var(--muted); font-size: 12px; }
.code-block { padding: 12px 14px; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); font-family: var(--mono); font-size: 13px; white-space: pre; }

.skeleton { border-radius: 6px; background: linear-gradient(90deg, var(--sunken) 25%, var(--line) 50%, var(--sunken) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.skeleton-title { width: 180px; height: 22px; }
.skeleton-line { height: 14px; }
.skeleton-line.is-short { width: 55%; }
.skeleton-block { height: 120px; border-radius: var(--radius); }
@keyframes shimmer { to { background-position: -200% 0; } }

.dialog { width: min(440px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3); }
.dialog::backdrop { background: rgba(8, 11, 16, 0.55); }
.dialog-body { display: grid; gap: 12px; padding: 22px 22px 18px; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; background: var(--sunken); }

@media (max-width: 860px) {
  .frame { display: block; }
  .sidebar { position: static; height: auto; padding: 12px 16px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .back { margin-bottom: 8px; }
  .nav { display: flex; gap: 4px; margin: 12px -16px 0; padding: 0 16px; overflow-x: auto; }
  .nav a { padding: 10px; border-bottom: 2px solid transparent; border-radius: 0; white-space: nowrap; }
  .nav a[aria-current="page"] { border-bottom-color: var(--accent); background: none; }
  .content { padding: 20px 16px 56px; }
  .choices, .choices-three, .checks { grid-template-columns: minmax(0, 1fr); }
  .fact { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .account, .project-date { display: none; }
  .project-row { flex-wrap: wrap; }
  /* A phone zooms the page into a text field whose type is under 16px. */
  input, select, textarea { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner, .skeleton { animation: none; }
  .switch, .switch::after { transition: none; }
}
@media (forced-colors: active) {
  .switch { -webkit-appearance: auto; appearance: auto; width: 16px; height: 16px; }
  .switch::after { content: none; }
  .choice:has(input:checked) { outline: 2px solid Highlight; }
}
</style>
</head>
<body>
<main class="auth" id="signin">
  <div class="auth-card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect class="mark-ground" width="26" height="26" rx="7"/><circle class="mark-figure" cx="13" cy="10" r="3.5"/><path class="mark-figure" d="M13 13.5v6.5M13 17h3"/></svg>
      <span>Project console</span>
    </div>
    <h1>Sign in</h1>
    <p class="lead" id="signin-lead"></p>
    <div class="auth-message" id="signin-message" hidden></div>
    <form id="signin-form" method="post" novalidate>
      <div class="stack">
        <label class="field-label" for="signin-email">Email</label>
        <input class="input" id="signin-email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="stack">
        <label class="field-label" for="signin-password">Password</label>
        <input class="input" id="signin-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary btn-block" id="signin-submit" type="submit">Sign in</button>
    </form>
    <form id="code-form" method="post" novalidate hidden>
      <div class="stack">
        <label class="field-label" for="code-input">Verification code</label>
        <input class="input" id="code-input" name="code" type="text" autocomplete="one-time-code" autocapitalize="none" spellcheck="false" aria-describedby="code-help" required>
        <p class="help" id="code-help">The 6-digit code from your authenticator app, or one of your recovery codes.</p>
      </div>
      <button class="btn btn-primary btn-block" id="code-submit" type="submit">Verify</button>
      <button class="btn btn-quiet btn-block" id="code-back" type="button">Use a different account</button>
    </form>
    <p class="auth-foot">New here? <a href="../auth/">Create an account</a></p>
    <noscript><p class="auth-foot">The console needs JavaScript to run.</p></noscript>
  </div>
</main>

<div id="app" hidden>
  <button class="btn skip" id="skip" type="button">Skip to content</button>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect class="mark-ground" width="26" height="26" rx="7"/><circle class="mark-figure" cx="13" cy="10" r="3.5"/><path class="mark-figure" d="M13 13.5v6.5M13 17h3"/></svg>
      <span>Project console</span>
    </a>
    <div class="topbar-end">
      <span class="account" id="account-email"></span>
      <button class="btn btn-small" id="sign-out" type="button">Sign out</button>
    </div>
  </header>
  <div class="frame" id="frame">
    <aside class="sidebar" id="sidebar" hidden></aside>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>

<div class="visually-hidden" id="live" role="status" aria-live="polite"></div>

<dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <div class="dialog-body">
    <h2 id="confirm-title"></h2>
    <p id="confirm-text"></p>
  </div>
  <div class="dialog-actions">
    <button class="btn" id="confirm-cancel" type="button">Cancel</button>
    <button class="btn btn-primary" id="confirm-accept" type="button"></button>
  </div>
</dialog>

<dialog class="dialog" id="project-dialog" aria-labelledby="project-title">
  <form id="project-form" method="post" novalidate>
    <div class="dialog-body">
      <h2 id="project-title">New project</h2>
      <p class="help" id="project-help">You will own the project. It starts closed: nobody can sign up or sign in to it until you choose who may.</p>
      <div class="stack">
        <label class="field-label" for="project-name">Name</label>
        <input class="input" id="project-name" name="name" type="text" maxlength="100" autocomplete="off" aria-describedby="project-help" required>
      </div>
      <div id="project-message" hidden></div>
    </div>
    <div class="dialog-actions">
      <button class="btn" id="project-cancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="project-create" type="submit">Create project</button>
    </div>
  </form>
</dialog>

<script nonce="{{.Nonce}}">
(function () {
  'use strict';

  // What the server said about itself when it rendered this page.
  const serverOptions = {{.Options}};

  // ── The wire ─────────────────────────────────────────────────────────

  // Relative to the page, so the console keeps working when the whole server
  // is published under a path prefix.
  const RPC_BASE = '../identity.v1.IdentityService/';
  const PROJECT_KEY_HEADER = 'X-Project-Key';

  const Code = Object.freeze({
    aborted: 'aborted',
    failedPrecondition: 'failed_precondition',
    invalidArgument: 'invalid_argument',
    notFound: 'not_found',
    permissionDenied: 'permission_denied',
    resourceExhausted: 'resource_exhausted',
    unauthenticated: 'unauthenticated',
    unavailable: 'unavailable',
    unimplemented: 'unimplemented',
    // The rest are the page's own, for an outcome no server code names: no
    // answer arrived, the answer could not be read, or the session ended
    // while the call was on its way.
    network: 'network',
    unreadable: 'unreadable',
    sessionEnded: 'session_ended',
    unknown: 'unknown',
  });

  // The Connect code an HTTP status stands for when the answer carries none
  // of its own, as when a proxy in front of the server answers.
  const CODE_BY_STATUS = Object.freeze({
    401: Code.unauthenticated,
    403: Code.permissionDenied,
    404: Code.unimplemented,
    429: Code.unavailable,
    502: Code.unavailable,
    503: Code.unavailable,
    504: Code.unavailable,
  });

  // Phrases the server puts in a refusal's message, which is all that tells
  // these refusals apart from others with the same code.
  const EMAIL_VERIFICATION_MARK = 'email verification required';
  const PASSWORD_CHANGE_MARK = 'password_change_required';
  const DATE_OF_BIRTH_MARK = 'dob_required';
  const HUMAN_CHECK_MARK = 'assurance';

  class RpcError extends Error {
    constructor(code, message) {
      super(message || '');
      this.code = code;
    }
  }

  async function rpc(method, message, accessToken) {
    const headers = { 'Content-Type': 'application/json' };
    if (accessToken) headers.Authorization = 'Bearer ' + accessToken;
    let response;
    try {
      response = await fetch(RPC_BASE + method, { method: 'POST', headers, body: JSON.stringify(message), cache: 'no-store' });
    } catch (cause) {
      throw new RpcError(Code.network);
    }
    let answer = null;
    try {
      answer = await response.json();
    } catch (cause) {
      answer = null;
    }
    if (response.ok) {
      if (!isRecord(answer)) throw new RpcError(Code.unreadable);
      return answer;
    }
    const code = isRecord(answer) && typeof answer.code === 'string' && answer.code;
    const text = isRecord(answer) && typeof answer.message === 'string' ? answer.message : '';
    throw new RpcError(code || CODE_BY_STATUS[response.status] || Code.unknown, text);
  }

  // A call as the signed-in account. An access token is short-lived, so a
  // call the server answers unauthenticated is retried once with a fresh one;
  // when that does not help the session is over.
  async function authed(method, message) {
    const session = state.session;
    if (!session) throw new RpcError(Code.sessionEnded);
    const used = session.accessToken;
    try {
      return await rpc(method, message, used);
    } catch (err) {
      if (err.code !== Code.unauthenticated) throw err;
    }
    // Another call may have refreshed the session while this one was out.
    if (session.accessToken === used) {
      try {
        await refreshSession(session);
      } catch (err) {
        endSession(session, SESSION_OVER);
        throw new RpcError(Code.sessionEnded);
      }
    }
    try {
      return await rpc(method, message, session.accessToken);
    } catch (err) {
      if (err.code !== Code.unauthenticated) throw err;
      endSession(session, SESSION_OVER);
      throw new RpcError(Code.sessionEnded);
    }
  }

  // A refresh token works once, and presenting a spent one signs the account
  // out everywhere, so calls that fail together share one refresh.
  function refreshSession(session) {
    if (!session.refreshing) {
      session.refreshing = rpc('RefreshToken', { refreshToken: session.refreshToken }).then((answer) => {
        if (!answer.accessToken || !answer.refreshToken) throw new RpcError(Code.unauthenticated);
        session.accessToken = answer.accessToken;
        session.refreshToken = answer.refreshToken;
      }).finally(() => {
        session.refreshing = null;
      });
    }
    return session.refreshing;
  }

  // ── Small tools ──────────────────────────────────────────────────────

  const ENTRY_SEPARATOR = /[\s,;]+/;
  const EMAIL_SHAPE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const DOMAIN_LABEL = /^[a-z0-9-]{1,63}$/;
  const NON_ASCII = /[^\u0000-\u007f]/;
  const ORIGIN_SHAPE = /^[a-z][a-z0-9+.-]*:\/\/[^\s\/?#]+$/;
  const MAX_DOMAIN_LENGTH = 253;
  const COPIED_NOTICE_MS = 2500;
  const JSON_INDENT = 2;

  const DATE_FORMAT = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  const LIST_FORMAT = new Intl.ListFormat('en', { style: 'long', type: 'conjunction' });

  const TIME_UNITS = Object.freeze([
    { seconds: 86400, one: 'day', many: 'days' },
    { seconds: 3600, one: 'hour', many: 'hours' },
    { seconds: 60, one: 'minute', many: 'minutes' },
  ]);

  const byId = (id) => document.getElementById(id);
  const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);
  const sameValue = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const token = (value) => (typeof value === 'string' ? value.trim().toLowerCase() : '');
  const hasItems = (value) => Array.isArray(value) && value.length > 0;
  const pretty = (value) => JSON.stringify(value, null, JSON_INDENT);

  let lastId = 0;
  function uid(prefix) {
    lastId += 1;
    return prefix + '-' + lastId;
  }

  // Builds an element. A function-valued entry is an event listener, every
  // other one an attribute; text only ever reaches the page as text nodes.
  function h(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [name, value] of Object.entries(attrs || {})) {
      if (value === false || value === null || value === undefined) continue;
      if (typeof value === 'function') node.addEventListener(name, value);
      else if (name === 'text') node.textContent = value;
      else if (name === 'class') node.className = value;
      else node.setAttribute(name, value === true ? '' : String(value));
    }
    for (const child of children.flat(Infinity)) {
      if (child === false || child === null || child === undefined) continue;
      node.append(child);
    }
    return node;
  }

  function icon(name) {
    return byId('icon-' + name).content.firstElementChild.cloneNode(true);
  }

  function describedBy(...ids) {
    return ids.filter(Boolean).join(' ') || null;
  }

  function setDisabled(button, disabled) {
    button.setAttribute('aria-disabled', String(disabled));
  }

  function setBusy(button, busy, label) {
    if (busy) {
      button.dataset.label = button.textContent;
      button.replaceChildren(h('span', { class: 'spinner', 'aria-hidden': 'true' }), label);
    } else if (button.dataset.label !== undefined) {
      button.textContent = button.dataset.label;
      delete button.dataset.label;
    }
    button.disabled = busy;
  }

  function announce(text) {
    const live = byId('live');
    live.textContent = '';
    requestAnimationFrame(() => {
      live.textContent = text;
    });
  }

  function spokenSeconds(total) {
    for (const unit of TIME_UNITS) {
      if (total >= unit.seconds && total % unit.seconds === 0) {
        const count = total / unit.seconds;
        return count + ' ' + (count === 1 ? unit.one : unit.many);
      }
    }
    return total + (total === 1 ? ' second' : ' seconds');
  }

  function formatDate(value) {
    const date = value ? new Date(value) : null;
    return date && !Number.isNaN(date.getTime()) ? DATE_FORMAT.format(date) : '';
  }

  // How long the server may go on applying the settings it had read before a
  // save, in words; empty when a save applies at once.
  function applyDelay() {
    const seconds = serverOptions.settingsApplyWithinSeconds;
    return Number.isInteger(seconds) && seconds > 0 ? spokenSeconds(seconds) : '';
  }

  function applyDelayNote() {
    const delay = applyDelay();
    return delay ? 'After you save a change, sign-ups and sign-ins follow it within ' + delay + '.' : '';
  }

  function alertBox(kind, problem, actions) {
    const mark = kind === 'ok' ? 'check' : kind === 'info' ? 'info' : 'alert';
    return h('div', { class: 'alert alert-' + kind, role: kind === 'error' ? 'alert' : 'status' },
      icon(mark),
      h('div', { class: 'alert-text' },
        problem.title && h('strong', { text: problem.title }),
        h('p', { text: problem.text }),
        problem.detail && h('p', { class: 'alert-detail', text: problem.detail }),
        actions && h('div', { class: 'actions' }, actions)));
  }

  function showIn(container, kind, problem) {
    container.replaceChildren(...(problem ? [alertBox(kind, problem)] : []));
    container.hidden = !problem;
  }

  // Redraws container only when what it shows has changed, so a message a
  // screen reader has announced is not announced again on every keystroke.
  function showOnce(container, content, build) {
    const key = JSON.stringify(content);
    if (container.dataset.shown === key) return;
    container.dataset.shown = key;
    container.replaceChildren(...build());
  }

  // ── Words for what went wrong ────────────────────────────────────────

  const SESSION_OVER = { text: 'Your session has ended. Sign in again to continue.' };
  const UNREACHABLE = 'The server could not be reached. Check your connection and try again.';
  const CONSOLE_OFF = 'The project console is not turned on for this server.';
  const VERIFY_EMAIL = 'Verify your email address first. Follow the link in the message sent to you, then try again.';

  function said(err) {
    return err.message ? 'The server said: ' + err.message : '';
  }

  function mentions(err, mark) {
    return err.message.toLowerCase().includes(mark);
  }

  function needsVerifiedEmail(err) {
    return err.code === Code.failedPrecondition && mentions(err, EMAIL_VERIFICATION_MARK);
  }

  // What to say for a failure that reads the same wherever it happens; null
  // when the caller has to say what it was doing.
  function commonProblem(err) {
    if (err.code === Code.network) return { text: UNREACHABLE };
    if (err.code === Code.unavailable) return { text: 'The server is unavailable right now. Try again in a moment.' };
    if (err.code === Code.unimplemented) return { text: CONSOLE_OFF };
    if (err.code === Code.unreadable) return { text: 'The server sent an answer the console could not read.' };
    if (needsVerifiedEmail(err)) return { text: VERIFY_EMAIL };
    return null;
  }

  function signInProblem(err) {
    if (err.code === Code.unauthenticated) return { text: 'That email address and password do not match an account.' };
    if (err.code === Code.resourceExhausted) return { text: 'There were too many attempts. Wait a while, then try again.' };
    if (err.code === Code.unavailable) return { text: 'Signing in with a password is unavailable right now. Try again in a moment.' };
    if (err.code === Code.failedPrecondition && mentions(err, PASSWORD_CHANGE_MARK)) {
      return { text: 'This password was issued by an administrator and has to be replaced before it works here. Sign in to your app to choose a new one, then come back.' };
    }
    if (err.code === Code.failedPrecondition && mentions(err, DATE_OF_BIRTH_MARK)) {
      return { text: 'This account needs a date of birth before it can sign in. Sign in to your app to add one, then come back.' };
    }
    if (err.code === Code.permissionDenied && mentions(err, HUMAN_CHECK_MARK)) {
      return { text: "This server asks for a check that you are human before a password sign-in, and the console has no way to show one. Ask the server's operator how to reach the console." };
    }
    if (err.code === Code.permissionDenied) return { text: 'This account is not allowed to sign in here.', detail: said(err) };
    if (err.code === Code.invalidArgument) return { text: 'Check the email address and password.', detail: said(err) };
    return commonProblem(err) || { text: 'Signing in did not work.', detail: said(err) };
  }

  function codeProblem(err) {
    if (err.code === Code.unauthenticated) {
      return { text: 'That code was not accepted. Each sign-in takes one try at the code, so enter your password again.' };
    }
    return signInProblem(err);
  }

  function createProblem(err) {
    if (err.code === Code.network) {
      return { text: 'The server could not be reached. The project may have been created all the same, so check the list before you try again.' };
    }
    if (err.code === Code.resourceExhausted) return { text: 'This account already owns as many projects as one account may.' };
    if (err.code === Code.invalidArgument) return { text: 'That name cannot be used.', detail: said(err) };
    if (err.code === Code.permissionDenied) return { text: 'This account is not allowed to create a project.', detail: said(err) };
    const common = commonProblem(err);
    if (common) return common;
    if (err.code === Code.failedPrecondition) return { text: 'Projects cannot be created from this account on this server.', detail: said(err) };
    return { text: 'The project could not be created.', detail: said(err) };
  }

  function loadProblem(err) {
    if (err.code === Code.permissionDenied) {
      return { text: 'You are not a member of this project, or it is no longer active.', detail: said(err) };
    }
    return commonProblem(err) || { text: "This project's settings could not be loaded.", detail: said(err) };
  }

  function saveProblem(err) {
    if (err.code === Code.invalidArgument) return { text: 'The server did not accept these settings.', detail: said(err) };
    if (err.code === Code.permissionDenied) return { text: "You are not allowed to change this project's settings.", detail: said(err) };
    if (err.code === Code.network) return { text: UNREACHABLE + ' Your changes are still here.' };
    const common = commonProblem(err);
    if (common) return common;
    if (err.code === Code.failedPrecondition) return { text: 'These settings cannot be changed from this session.', detail: said(err) };
    return { text: 'The settings were not saved.', detail: said(err) };
  }

  // ── What a project's settings are ────────────────────────────────────
  //
  // Each section is one key of the settings the server hands out, edited and
  // saved on its own. The fields, their JSON names, their allowed values and
  // their defaults are the server's (the Project*Config types); nothing here
  // decides what is valid, it only keeps the form from building what the
  // server is known to refuse.

  const KIND = Object.freeze({
    heading: 'heading', choice: 'choice', toggle: 'toggle', list: 'list',
    number: 'number', methods: 'methods', json: 'json', select: 'select',
  });
  const MODE = Object.freeze({ open: 'open', allowlist: 'allowlist', invite: 'invite', closed: 'closed' });
  const SIGNUP = Object.freeze({ self: 'self', admin: 'admin', off: 'off' });
  const ENTRY = Object.freeze({ email: 'email', domain: 'domain', origin: 'origin' });

  const modeIs = (mode) => (section) => token(section.mode) === mode;
  const modeAdmitsSomeone = (section) => [MODE.open, MODE.allowlist, MODE.invite].includes(token(section.mode));
  const turnsSomeoneAway = (section) => section.block_public_email_domains === true || hasItems(section.blocked_domains);
  const marketCode = (value) => (typeof value === 'string' ? value.trim().toUpperCase() : '');
  const marketCodes = (thresholds) => (isRecord(thresholds) ? Object.keys(thresholds).map(marketCode) : []);

  function refuseDomain(domain) {
    if (domain.includes('@')) return 'Enter only the domain, not an email address.';
    const labels = domain.split('.');
    if (labels.length < 2) return 'Enter a domain with a dot in it, such as example.com.';
    // An internationalized name is the server's to convert and check.
    if (NON_ASCII.test(domain)) return '';
    const plain = domain.length <= MAX_DOMAIN_LENGTH &&
      labels.every((label) => DOMAIN_LABEL.test(label) && !label.startsWith('-') && !label.endsWith('-'));
    return plain ? '' : 'Enter a plain domain such as example.com, with no wildcard, scheme or path.';
  }

  function refuseOrigin(origin) {
    if (origin === '*' || origin === 'null') return 'List each origin by name: this entry would let every website in.';
    return ORIGIN_SHAPE.test(origin) ? '' : 'Enter a scheme and host with nothing after it, such as https://app.example.com.';
  }

  function refuseThresholds(value) {
    if (!isRecord(value)) return 'Enter a JSON object keyed by market code.';
    const seen = new Set();
    for (const [code, pair] of Object.entries(value)) {
      const market = marketCode(code);
      if (!market) return 'A market code cannot be blank.';
      if (seen.has(market)) return 'The market ' + market + ' is listed more than once.';
      seen.add(market);
      if (!isRecord(pair) || !Number.isInteger(pair.child_max_age) || !Number.isInteger(pair.adult_age)) {
        return market + ' needs whole numbers for child_max_age and adult_age.';
      }
      if (pair.child_max_age < 0) return market + ': child_max_age cannot be negative.';
      if (pair.adult_age <= pair.child_max_age) return market + ': adult_age must be greater than child_max_age.';
    }
    return '';
  }

  const ENTRIES = Object.freeze({
    [ENTRY.email]: {
      clean: (text) => text.toLowerCase(),
      refuse: (text) => (EMAIL_SHAPE.test(text) ? '' : 'Enter a whole email address, such as name@example.com.'),
    },
    [ENTRY.domain]: { clean: (text) => text.toLowerCase(), refuse: refuseDomain },
    [ENTRY.origin]: { clean: (text) => text, refuse: refuseOrigin },
  });

  const SECTIONS = Object.freeze({
    access: {
      title: 'Who can sign up and sign in',
      summary: 'The access mode decides who may create an account, sign in or accept an invitation.',
      // An unset mode denies everyone, which is how every new project starts.
      banner: (stored) => (token(stored.mode) ? null : {
        title: 'This project is closed',
        text: 'No access mode has been chosen, so nobody can sign up or sign in. Choose one below and save.',
        detail: applyDelayNote(),
      }),
      check: (section) => (modeIs(MODE.allowlist)(section) && !hasItems(section.allowed_emails) && !hasItems(section.allowed_domains)
        ? ['An allowlist needs at least one email address or domain. To turn everyone away, choose Closed.']
        : []),
      fields: [
        {
          key: 'mode', kind: KIND.choice, label: 'Access mode',
          options: [
            { value: MODE.open, title: 'Open', text: 'Anyone can sign up and sign in.' },
            { value: MODE.allowlist, title: 'Allowlist', text: 'Only the email addresses and domains you list can sign up, sign in or accept an invitation.' },
            { value: MODE.invite, title: 'Invite only', text: 'Nobody signs up on their own. People who have an account sign in, and people an admin invited can accept.' },
            { value: MODE.closed, title: 'Closed', text: 'Nobody can sign up, sign in or accept an invitation.' },
          ],
        },
        {
          key: 'allowed_emails', kind: KIND.list, entry: ENTRY.email, applies: modeIs(MODE.allowlist),
          label: 'Allowed email addresses', placeholder: 'name@example.com',
          help: 'These exact addresses are let in.',
        },
        {
          key: 'allowed_domains', kind: KIND.list, entry: ENTRY.domain, applies: modeIs(MODE.allowlist),
          label: 'Allowed email domains', placeholder: 'example.com',
          help: 'Everyone with an address on one of these domains is let in, listed above or not.',
        },
        {
          key: 'admit_tenant_invitations', kind: KIND.toggle, applies: modeIs(MODE.invite),
          label: 'Let invited people create their account',
          help: 'A person with a pending invitation to an organization (tenant) can create the account it names, once they prove the address is theirs.',
        },
        {
          key: 'admit_domain_join', kind: KIND.toggle, applies: modeIs(MODE.invite),
          label: 'Let people on a joinable domain create their account',
          help: 'A person whose email domain lets its people join an organization (tenant) can create an account, once they prove the address is theirs. They join nothing until they choose to.',
        },
        {
          kind: KIND.heading, applies: modeAdmitsSomeone, label: 'Turned away regardless',
          help: 'These only ever refuse. They never let in anyone the access mode refuses.',
        },
        {
          key: 'block_public_email_domains', kind: KIND.toggle, applies: modeAdmitsSomeone,
          label: 'Refuse public email providers',
          help: 'Turns away addresses at consumer mailbox providers such as gmail.com or outlook.com, for a project that wants work email only.',
        },
        {
          key: 'blocked_domains', kind: KIND.list, entry: ENTRY.domain, applies: modeAdmitsSomeone,
          label: 'Blocked email domains', placeholder: 'example.com',
          help: 'Addresses on these domains are refused as well.',
        },
        {
          key: 'exempt_emails', kind: KIND.list, entry: ENTRY.email, applies: turnsSomeoneAway,
          label: 'Exempt email addresses', placeholder: 'name@example.com',
          help: 'These exact addresses pass the two rules above. This is not a second allowlist: an address the access mode refuses is still refused.',
        },
        { kind: KIND.heading, label: 'Accounts an organization manages' },
        {
          key: 'admit_managed_accounts', kind: KIND.toggle,
          label: 'Let organizations create accounts they manage',
          help: 'Owners and admins of an organization (tenant) can create accounts on a domain verified for it, where this server has managed accounts turned on.',
        },
        {
          key: 'admit_managed_accounts_self_service', kind: KIND.toggle, applies: (section) => section.admit_managed_accounts === true,
          label: 'Include organizations people created themselves',
          help: 'Extends this to organizations (tenants) made through self-service.',
        },
      ],
    },
    anonymous: {
      title: 'Anonymous sign-in',
      summary: 'Lets your app open a session for someone before they have given an email address or any other credential.',
      fields: [
        {
          key: 'enabled', kind: KIND.toggle, label: 'Allow anonymous sign-in',
          help: 'Off by default. It is separate from the access mode: a closed project can still hand out anonymous sessions. Turning such an account into a full one follows the sign-up rules.',
        },

          options: (section) => marketCodes(section.thresholds).filter(Boolean),
        },
      ],
    },
    cors: {
      title: 'Allowed web origins',
      summary: "A browser lets a web page call this server only from an origin listed here, or from one the server's operator allows for every project.",
      fields: [
        {
          key: 'allowed_origins', kind: KIND.list, entry: ENTRY.origin, label: 'Origins', placeholder: 'https://app.example.com',
          help: 'A scheme and host, with a port if it needs one and nothing after it. https://*.example.com covers every subdomain one level down. An app with its own scheme is listed as scheme://host.',
        },
