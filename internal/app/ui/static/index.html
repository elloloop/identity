<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --muted-text: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 8px 0 0;
            color: var(--muted-text);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--muted-text);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        button.submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        button.submit-btn:active {
            transform: translateY(1px);
        }

        .toggle-mode {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted-text);
        }

        .toggle-mode button {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: inherit;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .toggle-mode button:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .error-message {
            color: var(--danger);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-message {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            display: none;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        
        .result-data {
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted-text);
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 8px;
            display: none;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="header">
            <h1 id="title">Welcome back</h1>
            <p id="subtitle">Log in to your account to continue</p>
        </div>

        <div id="error-message" class="error-message" role="alert"></div>
        <div id="success-message" class="success-message" role="status"></div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required autocomplete="email" placeholder="name@example.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <!-- CAPTCHA widget, rendered only when configured and only in the
                 modes (login / sign-up) the server actually enforces. -->
            <div id="captcha-container" style="display: none; margin-bottom: 16px;"></div>

            <button type="submit" class="submit-btn" id="submit-btn">Log in</button>
        </form>

        <div class="toggle-mode">
            <span id="toggle-text">Don't have an account?</span>
            <button type="button" id="toggle-link">Sign up</button>
        </div>
        
        <div id="result-data" class="result-data"></div>
    </div>

    <script>
        {{.JSONConfig}}
        const config = window.serverConfig || { passwordSignupEnabled: true };

        let isLogin = true;
        const form = document.getElementById('auth-form');
        const title = document.getElementById('title');
        const subtitle = document.getElementById('subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const resultData = document.getElementById('result-data');

        if (!config.passwordSignupEnabled) {
            document.querySelector('.toggle-mode').style.display = 'none';
        }

        // CAPTCHA: the server injects the provider, PUBLIC site key and the
        // per-flow enforcement flags, so the widget renders exactly in the
        // modes where the server will require a token. The token is attached
        // to the request of whichever enforced mode is submitted.
        const captchaAvailable = config.captchaProvider === 'turnstile' && !!config.captchaSiteKey;
        const captchaLoadFailedMsg = 'The CAPTCHA failed to load. Check your connection and reload the page.';
        const captchaContainer = document.getElementById('captcha-container');
        let captchaToken = '';
        let captchaWidgetId = null;
        let turnstileLoad = null;

        function captchaRequired() {
            if (!captchaAvailable) return false;
            return isLogin ? !!config.captchaEnforceLogin : !!config.captchaEnforceSignup;
        }

        function loadTurnstile() {
            if (turnstileLoad) return turnstileLoad;
            turnstileLoad = new Promise((resolve, reject) => {
                if (window.turnstile) { resolve(); return; }
                const s = document.createElement('script');
                s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
                s.async = true;
                s.defer = true;
                s.onload = () => resolve();
                s.onerror = () => {
                    turnstileLoad = null; // allow a retry on the next sync
                    reject(new Error('captcha script failed to load'));
                };
                document.head.appendChild(s);
            });
            return turnstileLoad;
        }

        async function ensureCaptcha() {
            if (captchaWidgetId !== null) return;
            try {
                await loadTurnstile();
            } catch {
                errorMsg.textContent = captchaLoadFailedMsg;
                errorMsg.style.display = 'block';
                return;
            }
            // Re-check after the await: a concurrent call may have rendered.
            if (captchaWidgetId !== null) return;
            captchaWidgetId = window.turnstile.render(captchaContainer, {
                sitekey: config.captchaSiteKey,
                callback: (token) => { captchaToken = token; },
                'error-callback': () => { captchaToken = ''; },
                'expired-callback': () => { captchaToken = ''; },
            });
        }

        function resetCaptcha() {
            captchaToken = '';
            if (captchaWidgetId !== null && window.turnstile) {
                window.turnstile.reset(captchaWidgetId);
            }
        }

        function syncCaptchaVisibility() {
            if (captchaRequired()) {
                captchaContainer.style.display = 'block';
                ensureCaptcha();
            } else {
                captchaContainer.style.display = 'none';
            }
        }

        toggleLink.addEventListener('click', () => {
            isLogin = !isLogin;
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            resultData.style.display = 'none';
            
            if (isLogin) {
                title.textContent = 'Welcome back';
                subtitle.textContent = 'Log in to your account to continue';
                submitBtn.textContent = 'Log in';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign up';
            } else {
                title.textContent = 'Create an account';
                subtitle.textContent = 'Enter your details to get started';
                submitBtn.textContent = 'Sign up';
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Log in';
            }
            syncCaptchaVisibility();
        });

        // Show the widget if the page loads directly in sign-up mode.
        syncCaptchaVisibility();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // The current mode requires a CAPTCHA token when enforced. With no
            // rendered widget there is nothing the user can complete — keep the
            // load-failure guidance instead of asking for the impossible.
            if (captchaRequired() && !captchaToken) {
                errorMsg.textContent = captchaWidgetId === null
                    ? captchaLoadFailedMsg
                    : 'Please complete the CAPTCHA to continue.';
                errorMsg.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Please wait...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            resultData.style.display = 'none';

            const endpoint = isLogin
                ? '/identity.v1.IdentityService/PasswordLogin'
                : '/identity.v1.IdentityService/PasswordSignup';

            const payload = { email, password };
            if (captchaRequired()) {
                payload.captchaToken = captchaToken;
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    // A used/expired token can't be replayed — mint a fresh one.
                    if (captchaRequired()) resetCaptcha();
                    throw new Error(data.message || data.code || 'Authentication failed');
                }
                
                successMsg.textContent = isLogin ? 'Successfully logged in!' : 'Account created successfully!';
                successMsg.style.display = 'block';
                
                if (data.accessToken || data.access_token) {
                    const token = data.accessToken || data.access_token;
                    resultData.textContent = 'Token: ' + token.substring(0, 30) + '...';
                    resultData.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = isLogin ? 'Log in' : 'Sign up';
            }
        });
    </script>
</body>
</html>
