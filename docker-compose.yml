# Local development stack for the identity service.
#
# Brings up two services:
#   - postgres  : the primary datastore (Postgres on :5432). Data is held
#                 in a named volume so it survives container restarts but
#                 is wiped by `docker compose down -v`.
#   - identity  : the identity service itself, built from this repo.
#                 Connect/HTTP on :8080, Prometheus metrics on :9090.
#
# Quick start:
#   docker compose up -d --build
#   curl http://localhost:8080/health
#   curl http://localhost:8080/.well-known/jwks.json | jq .
#   docker compose logs -f identity
#   docker compose down -v        # stop and wipe the postgres volume
#
# Notes:
#   - SMTP is intentionally unset; the service falls back to the LogOnly
#     transport, so verification / reset emails appear in identity logs
#     instead of being delivered.
#   - OAuth providers are unset; OAuth RPCs return CodeUnavailable.
#   - JWT signing key is auto-generated at boot for development. JWKS is
#     served at /.well-known/jwks.json.

services:
  postgres:
    image: postgres:16.13-alpine3.23
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity"]
      interval: 5s
      timeout: 3s
      retries: 12

  identity:
    build:
      context: .
      target: server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GATEWAY_REPO_DRIVER: postgres
      GATEWAY_POSTGRES_DSN: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      # Pending migrations are applied automatically on first connect.
      GATEWAY_POSTGRES_AUTO_MIGRATE: "true"
      GATEWAY_DEFAULT_TENANT_ID: local
      GATEWAY_APP_BASE_URL: http://localhost:8080
      # SMTP_* intentionally unset — falls back to LogOnly transport.
      # OAuth provider configs intentionally unset — those RPCs return
      # CodeUnavailable until you wire them up via env vars.
    ports:
      - "8080:80"
      - "9090:9090"

volumes:
  postgres-data:
