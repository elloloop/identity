version: v2

modules:
  - path: proto
    name: buf.build/elloloop/identity

lint:
  use:
    - STANDARD

breaking:
  use:
    - FILE
  # Intentional, documented breaking change (v4.0.0, ADR-0012): the six
  # `captcha_token` request fields were removed when inline CAPTCHA became
  # the client-assurance layer — clients now send the assurance token in the
  # X-Assurance-Token header instead. Both the field NUMBER and the field
  # NAME are `reserved` in identity.proto, so the wire and JSON surfaces are
  # protected against reuse; the FILE ruleset's FIELD_NO_DELETE rule rejects
  # a deletion regardless of `reserved` (only the WIRE/WIRE_JSON rulesets
  # treat reserved as sufficient), so it is waived on exactly that one file.
  # Every other breaking guarantee — renumbered tags, reused field ids,
  # signature changes on surviving RPCs — stays enforced. Remove this entry
  # once v4.0.0 is the baseline buf breaking runs against.
  ignore_only:
    FIELD_NO_DELETE:
      - proto/identity/v1/identity.proto
