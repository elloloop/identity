version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
  ignore:
    - proto/entdb/entdb_options.proto

breaking:
  use:
    - FILE
  # Intentional, documented breaking change (v1.0 cleanup): the legacy
  # OrganizationSignup RPC and its Organization / OrganizationSignupRequest /
  # OrganizationSignupResponse messages were removed because the
  # Project/Tenant/Domain model supersedes them. These ignore_only entries
  # are scoped to identity.proto and to ONLY the two deletion rules, so every
  # other breaking guarantee (renumbered tags, reused field ids, signature
  # changes on surviving RPCs) stays enforced. Remove these entries once the
  # removal has landed on the baseline branch buf breaking runs against —
  # they are dead weight after this change merges.
  ignore_only:
    RPC_NO_DELETE:
      - proto/identity/identity.proto
    MESSAGE_NO_DELETE:
      - proto/identity/identity.proto
