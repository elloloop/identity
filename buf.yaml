version: v2

modules:
  - path: proto
    name: buf.build/elloloop/identity

lint:
  use:
    - STANDARD

breaking:
  # Intentional, documented breaking change (v4.0.0, ADR-0012): the six
  # `captcha_token` request fields were removed when inline CAPTCHA became
  # the client-assurance layer — clients now send the assurance token in the
  # X-Assurance-Token header instead. Both the field NUMBER and the field
  # NAME are `reserved` in identity.proto.
  #
  # FILE's FIELD_NO_DELETE rejects a deletion regardless of `reserved`, and
  # it has no reserved-aware variant — so an `ignore_only` waiver would turn
  # field-deletion checking OFF for the whole API indefinitely (an
  # unreserved deletion would then pass silently). Instead we drop that one
  # rule and add back its two reserved-aware equivalents, which accept this
  # change precisely BECAUSE the tags and names are reserved, and still
  # reject any future deletion that forgets to reserve them. Every other
  # breaking guarantee — renumbered tags, reused field ids, signature
  # changes on surviving RPCs — is untouched, and nothing here expires, so
  # there is no waiver to remember to remove.
  use:
    - FILE
    - FIELD_NO_DELETE_UNLESS_NAME_RESERVED
    - FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED
  except:
    - FIELD_NO_DELETE
