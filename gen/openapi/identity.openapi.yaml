      description: |-
        ─── OAuthIdentity (type_id 31) ────────────────────────────────────────

         Records the linkage between a local User and a stable provider-side
         identity (provider, provider_user_id). This is what lets OAuth login
         keep the same human linked to the same local account when the
         provider's email changes.

         Uniqueness on (provider, provider_user_id) is enforced server-side via
         the composite_unique declaration below. The SDK attaches the schema to
         ExecuteAtomic (ADR-031), and the server materialises a unique
         expression index in the same WAL event as the create, so two
         concurrent creates with the same tuple cannot both succeed.
    identity.schema.OAuthOneTimeCode:
      type: object
      properties:
        codeHash:
          type: string
          title: code_hash
        userId:
          type: string
          title: user_id
        expiresAt:
          type:
            - integer
            - string
          title: expires_at
          format: int64
        createdAt:
          type:
            - integer
            - string
          title: created_at
          format: int64
        consumedAt:
          type:
            - integer
            - string
          title: consumed_at
          format: int64
          description: 0 = unconsumed
      title: OAuthOneTimeCode
      additionalProperties: false
      description: |-
        ─── OAuthOneTimeCode (type_id 36) ─────────────────────────────────────

         The single-use handover artifact for the hosted OAuth flow. After the
         hosted callback (GET /oauth/callback/{provider}) completes the code
         exchange and authenticates the user, it mints an opaque one-time code,
         stores its SHA-256 hash here keyed to the user, and 302-redirects the
         browser to return_to?code=<otc>. The SPA exchanges the code via the
         RedeemOAuthCode RPC, which atomically consumes this row (consumed_at
         CAS from 0) and mints a fresh token pair.

         Only the user id + a short expiry are persisted — no token material is
         stored at rest. Single-use is enforced by the consumed_at compare-and-
         set so a replay (or two replicas racing the same code) yields exactly
         one winner; losers see Unauthenticated.
