      type: object
      properties:
        token:
          type: string
          title: token
      title: RedeemMagicLinkRequest
      additionalProperties: false
      description: |-
        RedeemMagicLink consumes the single-use token, resolves-or-creates the
         user keyed by the bound email, and issues a token pair. A replay or an
         expired token surfaces as CodeUnauthenticated. return_to echoes the
         allowlist-validated app URL the SPA should navigate to.
    identity.v1.RedeemMagicLinkResponse:
      type: object
      properties:
        user:
          title: user
          $ref: '#/components/schemas/identity.v1.User'
        accessToken:
          type: string
          title: access_token
        refreshToken:
          type: string
          title: refresh_token
        expiresIn:
          type: integer
          title: expires_in
          format: int32
        returnTo:
          type: string
          title: return_to
          description: allowlist-validated app URL bound at request time
      title: RedeemMagicLinkResponse
      additionalProperties: false
    identity.v1.RedeemOAuthCodeRequest:
      type: object
      properties:
        code:
          type: string
          title: code
          description: opaque one-time code from the hosted callback redirect
      title: RedeemOAuthCodeRequest
      additionalProperties: false
      description: |-
        RedeemOAuthCode exchanges the single-use one-time code handed to the
         SPA by the hosted OAuth callback (GET /oauth/callback/{provider} ->
         302 return_to?code=<otc>) for a backend-issued token pair. The code
         is single-use and short-lived; a replay returns CodeUnauthenticated.
    identity.v1.RedeemOAuthCodeResponse:
      type: object
      properties:
        user:
          title: user
          $ref: '#/components/schemas/identity.v1.User'
        accessToken:
          type: string
          title: access_token
          description: Backend-issued JWT
        refreshToken:
          type: string
          title: refresh_token
          description: For token rotation (send in RefreshToken RPC body)
        expiresIn:
          type: integer
          title: expires_in
          format: int32
          description: Access token lifetime in seconds
      title: RedeemOAuthCodeResponse
      additionalProperties: false
