        accessToken:
          type: string
          title: access_token
          description: Backend-issued JWT
        refreshToken:
          type: string
          title: refresh_token
          description: For token rotation (send in RefreshToken RPC body)
        expiresIn:
          type: integer
          title: expires_in
          format: int32
          description: Access token lifetime in seconds
      title: RedeemOAuthCodeResponse
      additionalProperties: false
