syntax = "proto3";

package identity.v1;

option go_package = "github.com/elloloop/identity/gen/go/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";

// ─── User ────────────────────────────────────────────────────────────

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INVITED = 2;
  USER_STATUS_DEACTIVATED = 3;
  USER_STATUS_SUSPENDED = 4;
  // PENDING_PARENTAL_CONSENT marks a child-band account created under
  // age-gating that has not yet obtained verifiable parental consent. Such
  // an account exists but cannot mint full access tokens until consent is
  // granted. Additive; all existing statuses keep their numbers.
  USER_STATUS_PENDING_PARENTAL_CONSENT = 5;
  // PENDING_DELETION marks an account whose owner requested self-service
  // deletion (GDPR Art 17). The account is disabled and scheduled for a
  // permanent purge once the grace window elapses; until then a successful
  // interactive login by the owner cancels the pending deletion and restores
  // the account to ACTIVE. Additive; all existing statuses keep their numbers.
  USER_STATUS_PENDING_DELETION = 6;
}

// AgeBand is the coarse age classification derived from a user's date of
// birth and the deployment's configured age thresholds. Zero-value
// (UNSPECIFIED) means age is unknown or age-gating is off.
enum AgeBand {
  AGE_BAND_UNSPECIFIED = 0;
  AGE_BAND_CHILD = 1;   // at/below the configured child-max age (COPPA-protected)
  AGE_BAND_TEEN = 2;    // minor, above child-max but below adult age
  AGE_BAND_ADULT = 3;   // at/above the adult age
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string role = 5;                      // "admin", "member", "guest"
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool totp_required = 8;               // true if the user has enrolled a TOTP credential
  UserStatus status = 9;
  string recovery_email = 10;
  int64 quota_bytes = 11;
  int64 last_login_at_ms = 12;
  bool email_verified = 13;
  int64 email_verified_at = 14;
  int32 failed_login_count = 15;          // # of consecutive failed PasswordLogin attempts
  int64 locked_until = 16;                // epoch ms; 0 = not locked, future = locked until
  bool idv_verified = 17;                 // Latest identity verification has reached APPROVED status.
  int64 idv_verified_at = 18;             // epoch ms; 0 = never verified
  string phone_number = 19;               // E.164 phone number the user has verified ownership of
  bool phone_verified = 20;               // true once an SMS OTP for phone_number was confirmed
  int64 phone_verified_at = 21;           // epoch ms; 0 = never verified
  int64 date_of_birth_ms = 22;            // epoch ms of date of birth; 0 = unknown
  bool is_minor = 23;                     // derived: true when age < adult age (age-gating on)
  AgeBand age_band = 24;                  // derived age band; UNSPECIFIED when unknown / gate off
  string external_id = 25;                 // IdP-owned stable identifier (SCIM externalId); unique per project when set
  // is_anonymous marks an account created by SignInAnonymously: a real
  // user with a stable id but NO credential of any kind. It has no email,
  // and is reachable only through its refresh token. Clears permanently on
  // UpgradeAnonymousAccount, which preserves the id.
  bool is_anonymous = 26;
  // market is the jurisdiction/market code (e.g. "IN", "US") captured at
  // account creation or set via SetAccountMarket. When the project configures
  // per-jurisdiction age thresholds (config_json `jurisdictions`), it selects
  // the threshold pair this account's age band derives from. Empty means "no
  // market on file" — the project default or the deployment-wide thresholds
  // apply.
  string market = 27;
  // username is the parent-chosen, project-unique handle identifying a
  // managed child account (children often have no email). Lowercase
  // alphanumerics plus `_`/`-`/`.`, 3..32 chars, normalized to lowercase at
  // write time. Empty on every account not created via
  // CreateManagedChildAccount. Unique within the project when non-empty, and
  // usable as the PasswordLogin identifier.
  string username = 28;
}

message CreateUserRequest {
  string email = 1;
  string name = 2;
  string avatar_url = 3;
  string role = 4;
  string tenant_id = 5;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string tenant_id = 2;
  string name = 3;
  string avatar_url = 4;
  string role = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message DeleteUserResponse {}

// Admin-only paginated user listing.
//   Requires the caller's JWT to carry role=admin.
//   Supports filtering by status and substring search on email/name.
message ListUsersRequest {
  string tenant_id = 1;
  string cursor = 2;
  int32 limit = 3;
  UserStatus status_filter = 4;     // USER_STATUS_UNSPECIFIED = no filter
  string search = 5;                // optional substring match on email/name
}

message ListUsersResponse {
  repeated User users = 1;
  string next_cursor = 2;
  int32 total_count = 3;
}

// ─── Group (formerly WorkingGroup) ──────────────────────────────────
// Note: the underlying graph DB node type is still ``WorkingGroup`` (type_id 2).
// Only the proto / RPC names have been renamed for clarity.

message Group {
  string id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreateGroupRequest {
  string name = 1;
  string description = 2;
  string tenant_id = 3;
  string created_by = 4;                // user_id of creator
}

message CreateGroupResponse {
  Group group = 1;
}

message UpdateGroupRequest {
  string group_id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
}

message UpdateGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string group_id = 1;
  string tenant_id = 2;
}

message DeleteGroupResponse {}

message ListGroupsRequest {
  string tenant_id = 1;
  string cursor = 2;
  int32 limit = 3;
  string name_filter = 4;           // optional substring match on group name
}

message ListGroupsResponse {
  repeated Group groups = 1;
  string next_cursor = 2;
}

// ─── Membership (edges: User ←MEMBER_OF→ Group) ──────────────

message AddGroupMemberRequest {
  string group_id = 1;
  string user_id = 2;
  string tenant_id = 3;
}

message AddGroupMemberResponse {}

message RemoveGroupMemberRequest {
  string group_id = 1;
  string user_id = 2;
  string tenant_id = 3;
}

message RemoveGroupMemberResponse {}

message ListGroupMembersRequest {
  string group_id = 1;
  string tenant_id = 2;
}

message ListGroupMembersResponse {
  repeated User members = 1;
}

// ─── Auth Messages ──────────────────────────────────────────────────

message BeginOAuthLoginRequest {
  string redirect_uri = 1;
  string provider     = 2;  // "google", "microsoft", "github", or "apple"
  string tenant       = 3;  // Microsoft tenant ID (optional)
}

message BeginOAuthLoginResponse {
  string authorization_url = 1;
  string state             = 2;
  string state_token       = 3;
  string code_verifier     = 4;
  int32 expires_in         = 5;
}

message OAuthLoginRequest {
  string code          = 1;
  string redirect_uri  = 2;
  string provider      = 3;  // "google", "microsoft", "github", or "apple"
  string code_verifier = 4;  // PKCE (optional)
  string tenant        = 5;  // Microsoft tenant ID (optional)
  string state         = 6;  // authorization callback state (required for server-owned flow)
  string state_token   = 7;  // opaque token minted by BeginOAuthLogin
  string apple_user_payload = 8; // one-time user payload from Apple's form_post callback
}

message OAuthLoginResponse {
  User user             = 1;
  string access_token   = 2;  // Backend-issued JWT
  reserved 3;                  // was id_token (removed)
  string refresh_token  = 4;  // For token rotation (send in RefreshToken RPC body)
  int32 expires_in      = 5;  // Access token lifetime in seconds
}

// NativeOAuthLoginRequest carries a native mobile-SDK ID token for
// server-side verification. Unlike OAuthLogin (which exchanges an OAuth
// authorization code through identity's own web client), this path takes the
// ID token a native SDK already obtained from the platform account picker
// (Google `google_sign_in`, Apple `sign_in_with_apple`) — no browser, no
// PKCE. Identity verifies the token's signature, issuer, expiry, and audience
// against the configured native audiences, then links/creates the user and
// issues identity tokens scoped to the product's project.
message NativeOAuthLoginRequest {
  // Provider key: "google" or "apple". Any other value is InvalidArgument.
  string provider = 1;

  // The native-SDK ID token (a JWT). For Google this is
  // GoogleSignInAuthentication.idToken; for Apple it is
  // credential.identityToken from sign_in_with_apple. Required.
  string id_token = 2;

  // Product/project selector (e.g. "easyloops" | "tortoise"), with the same
  // semantics as the hosted hub's ?product= query. The server maps it to an
  // identity Project (see GATEWAY_NATIVE_OAUTH_PRODUCT_PROJECTS) and scopes
  // token issuance to that project. An unknown/unresolvable product is
  // InvalidArgument.
  string product = 3;

  // Apple only: the RAW nonce the client passed to the native Sign in with
  // Apple request. Omit for Google.
  //
  // OPTIONAL but STRONGLY RECOMMENDED: nonce-based replay protection is only
  // enforced when this field is present. The convention (sign_in_with_apple /
  // Firebase) is that the client hashes a random raw nonce with SHA-256 and
  // sends the HEX digest as the native request `nonce`; Apple echoes that
  // digest verbatim in the id_token `nonce` claim. When this field is set the
  // server verifies id_token.nonce == hex(SHA-256(raw))
  // (base64url(SHA-256(raw)) is also accepted) and rejects a missing or
  // mismatched claim. When omitted, the token is still fully verified
  // (signature, iss, exp, aud) but NOT bound to a per-login nonce, so clients
  // SHOULD always generate and send a fresh raw nonce.
  string nonce = 4;
}

// NativeOAuthLoginResponse mirrors OAuthLoginResponse: the backend-issued
// token pair plus the resolved user.
message NativeOAuthLoginResponse {
  User user            = 1;
  string access_token  = 2;  // Backend-issued JWT
  string refresh_token = 3;  // For token rotation (send in RefreshToken RPC body)
  int32 expires_in     = 4;  // Access token lifetime in seconds
}

// RedeemOAuthCode exchanges the single-use one-time code handed to the
// SPA by the hosted OAuth callback (GET/POST /oauth/callback/{provider} ->
// 302 return_to?code=<otc>) for a backend-issued token pair. The code
// is single-use and short-lived; a replay returns CodeUnauthenticated.
message RedeemOAuthCodeRequest {
  string code = 1;  // opaque one-time code from the hosted callback redirect
}

message RedeemOAuthCodeResponse {
  User user            = 1;
  string access_token  = 2;  // Backend-issued JWT
  string refresh_token = 3;  // For token rotation (send in RefreshToken RPC body)
  int32 expires_in     = 4;  // Access token lifetime in seconds
}

message PasswordSignupRequest {
  string email    = 1;
  string password = 2;
  string recovery_email = 3;  // Optional: secondary contact address. Note: password reset links are sent to the account's PRIMARY verified email, not this address.
  reserved 4; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
  int64 date_of_birth_ms = 5; // Optional; epoch ms of date of birth. Required at signup when GATEWAY_AGEGATE_REQUIRE_DOB.
  // market is the jurisdiction/market code (e.g. "IN", "US") the account is
  // created under. Optional; when the project configures per-jurisdiction age
  // thresholds it must name one of them. Canonicalized (trimmed, upper-cased)
  // before storage.
  string market = 6;
}

message PasswordSignupResponse {
  string id_token      = 1;  // deprecated, kept for backward compat
  User user            = 2;
  string access_token  = 3;
  string refresh_token = 4;
  int32 expires_in     = 5;
}

message PasswordLoginRequest {
  // email is the login identifier: the account's email address, OR — when the
  // value contains no `@` — the username of a managed child account within
  // this project (see User.username). The response is identical whether the
  // identifier matched by email, by username, or not at all, so the endpoint
  // discloses neither which form matched nor whether the account exists.
  string email    = 1;
  string password = 2;
  reserved 3; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
}

message PasswordLoginResponse {
  string id_token = 1;       // Legacy local format (deprecated)
  User user       = 2;
  string access_token  = 3;  // Backend-issued JWT (empty when totp_required=true)
  string refresh_token = 4;  // For token rotation (empty when totp_required=true)
  int32 expires_in     = 5;  // Access token lifetime in seconds
  bool totp_required      = 6;  // true when the user has TOTP enabled; client must call VerifyTotp
  string login_challenge_id = 7;  // id of the pending LoginChallenge; pass to VerifyTotp
}

// ─── Required-DOB completion ──────────────────────────────────────────
// When GATEWAY_AGEGATE_REQUIRE_DOB is on, every session-issuing path
// refuses to mint tokens for an account with no date of birth
// (date_of_birth_ms = 0) and instead fails with CodeFailedPrecondition,
// the stable `dob_required` token in the message, and a
// DOBRequiredDetails error detail carrying a short-lived completion
// ticket. The client submits the date of birth through SubmitDateOfBirth,
// which is the only RPC that accepts the ticket. This applies to accounts
// created before the flag was enabled too: they hit the same step at
// their next login or refresh.
//
// CreateUser (admin-created accounts) needs no DOB field: it mints no
// tokens, so nothing is bypassed at creation — the created account meets
// the completion step at its first sign-in like any pre-flag account.

// DOBRequiredDetails is the error detail attached to the `dob_required`
// refusal returned by any session-issuing RPC when
// GATEWAY_AGEGATE_REQUIRE_DOB is on and the account has no date of birth.
message DOBRequiredDetails {
  // A short-lived (10 minute) bearer ticket whose only use is one
  // SubmitDateOfBirth call for the account it was minted for. It is NOT
  // an access token: it carries a `purpose` claim and authenticates no
  // other RPC.
  string completion_token = 1;
}

// SubmitDateOfBirth completes the required-DOB step: it verifies the
// completion ticket, stores the date of birth on the ticket's account,
// derives the age band under the account's jurisdiction, and only then
// issues a session. A CHILD-band result lands in
// USER_STATUS_PENDING_PARENTAL_CONSENT and is issued no tokens (the
// correct dead end on a self-signup path — a child arrives through the
// guardian flow, not alone). The DOB can be set exactly once: an account
// that already has one is CodeFailedPrecondition.
message SubmitDateOfBirthRequest {
  string completion_token  = 1;  // from the dob_required error detail
  int64 date_of_birth_ms   = 2;  // epoch ms; must be a plausible past date
}

message SubmitDateOfBirthResponse {
  User user            = 1;
  string access_token  = 2;  // empty when user.status is USER_STATUS_PENDING_PARENTAL_CONSENT
  string refresh_token = 3;  // empty likewise
  int32 expires_in     = 4;  // Access token lifetime in seconds
}

// ─── Passwordless Email Login (OTP code + magic link) ────────────────
// Authenticate by proving control of an email — no password. Both arms
// resolve-or-create the single account keyed by that email, so a
// passwordless login for an address that already has a password/OAuth
// account links to the SAME user rather than duplicating it. Accounts
// are created only on verify/redeem (never on request), gated by
// GATEWAY_PASSWORDLESS_SIGNUP_ENABLED.

// RequestEmailLoginCode emails a 6-digit one-time code to the address.
// Anti-enumeration: the response is identical whether or not the email
// already has an account (and whether or not auto-create is enabled).
message RequestEmailLoginCodeRequest {
  string email = 1;
  reserved 2; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
}

message RequestEmailLoginCodeResponse {
  // Always returns success (no enumeration).
}

// VerifyEmailLoginCode validates the OTP, resolves-or-creates the user
// keyed by email, and issues a token pair. A wrong code increments the
// per-code attempt counter; exceeding the cap invalidates the code.
message VerifyEmailLoginCodeRequest {
  string email = 1;
  string code  = 2;
}

message VerifyEmailLoginCodeResponse {
  User user            = 1;
  string access_token  = 2;
  string refresh_token = 3;
  int32 expires_in     = 4;
}

// RequestMagicLink emails a clickable single-use link. return_to is
// validated against the GATEWAY_OAUTH_ALLOWED_RETURN_URLS allowlist
// (shared with the hosted OAuth flow). Anti-enumeration: identical
// response regardless of account existence.
message RequestMagicLinkRequest {
  string email     = 1;
  string return_to = 2;  // app URL to return to; must match the allowlist
  reserved 3; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
}

message RequestMagicLinkResponse {
  // Always returns success (no enumeration).
}

// RedeemMagicLink consumes the single-use token, resolves-or-creates the
// user keyed by the bound email, and issues a token pair. A replay or an
// expired token surfaces as CodeUnauthenticated. return_to echoes the
// allowlist-validated app URL the SPA should navigate to.
message RedeemMagicLinkRequest {
  string token = 1;
}

message RedeemMagicLinkResponse {
  User user            = 1;
  string access_token  = 2;
  string refresh_token = 3;
  int32 expires_in     = 4;
  string return_to     = 5;  // allowlist-validated app URL bound at request time
}

// ─── Phone verification (SMS OTP) ───────────────────────────────────
//
// RequestPhoneVerification and VerifyPhoneCode prove the authenticated
// caller (identified by the access-token `sub`, not a field here) owns a
// phone number. RequestPhoneVerification texts a 6-digit code to the
// supplied number; VerifyPhoneCode confirms it and marks the user's
// phone verified. Both require auth.

message RequestPhoneVerificationRequest {
  string phone_number = 1;  // E.164 number to verify (e.g. "+14155550123")
}

message RequestPhoneVerificationResponse {
  // Empty: the code is delivered out of band via SMS.
}

message VerifyPhoneCodeRequest {
  string phone_number = 1;  // must match the number the code was sent to
  string code         = 2;  // the 6-digit OTP from the SMS
}

message VerifyPhoneCodeResponse {
  User user = 1;  // the updated user with phone_verified=true
}

// ─── Session / Token Auth ───────────────────────────────────────────

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

// ─── Self-Service Profile ────────────────────────────────────────────

message UpdateProfileRequest {
  // Omitted (empty-string) fields are unchanged.
  string name = 1;
  string avatar_url = 2;
}

message UpdateProfileResponse {
  User user = 1;
}

// ─── Password Management ────────────────────────────────────────────

message ChangePasswordRequest {
  string current_password = 1;
  string new_password     = 2;
}

message ChangePasswordResponse {}

// ─── Self-Service Account Deletion ───────────────────────────────────
// The caller is the account being deleted; it is derived from the auth
// header (there is no user_id field), matching the self-service pattern.

message DeleteMyAccountRequest {
  string reason = 1; // optional free-text, retained for audit only
}

message DeleteMyAccountResponse {
  int64 deletion_scheduled_at_ms = 1; // epoch ms the account is purged at
}

message CancelAccountDeletionRequest {}

message CancelAccountDeletionResponse {
  UserStatus status = 1; // resulting status (ACTIVE after a successful cancel)
}

// ─── Self-Service Data Export (GDPR Art 15 access + Art 20 portability) ──
// The caller downloads a structured, machine-readable copy of the personal
// data the identity service holds about them. The caller is derived from the
// auth header (there is no user_id field), matching the self-service pattern.
//
// The payload carries NO secret material: never a password hash, TOTP secret,
// recovery codes, or raw/hashed tokens — only the metadata a user is entitled
// to see about their own account, auth, and security records.

message ExportMyDataRequest {}

message ExportMyDataResponse {
  // format_version identifies the schema of this export document so a later
  // importer can evolve the shape unambiguously. The first version is 1.
  int32 format_version = 1;

  // exported_at_ms is the epoch-ms instant this export was produced.
  int64 exported_at_ms = 2;

  // user is the caller's full profile. The User message carries no secret
  // fields (no password hash, no TOTP secret).
  User user = 3;

  // sessions are the caller's active sessions — the same shape ListMySessions
  // returns (the session id is a node id, never the raw refresh token).
  repeated Session sessions = 4;

  // passkeys are the caller's registered passkey credentials — metadata only
  // (credential id, device name, timestamps), the same shape ListPasskeys
  // returns. Private keys / secrets are never included.
  repeated PasskeyCredentialInfo passkeys = 5;

  // linked_identities are the caller's connected OAuth provider identities —
  // the same shape ListLinkedIdentities returns (provider, provider_user_id,
  // email-at-link-time, linked-at).
  repeated LinkedIdentity linked_identities = 6;

  // totp_enabled reports whether the caller has an enrolled, verified TOTP
  // credential. The TOTP secret itself is NEVER included.
  bool totp_enabled = 7;

  // audit_events are the security/audit events where the caller is the actor
  // OR the target, newest first, capped by GATEWAY_EXPORT_MAX_AUDIT_EVENTS.
  repeated AuditEvent audit_events = 8;
}

// Password reset (replaces the deprecated self-serve ForgotPassword flow).
// The reset link is sent to the account's PRIMARY verified email — the
// address matching the supplied `email`. If no account matches, the
// request silently succeeds (no enumeration).
message RequestPasswordResetRequest {
  string email = 1;
  reserved 2; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
}

message RequestPasswordResetResponse {
  // Always returns success (no enumeration).
}

message ConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message ConfirmPasswordResetResponse {}

// ─── Email Verification ─────────────────────────────────────────────

message SendEmailVerificationRequest {}

message SendEmailVerificationResponse {}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  User user = 1;
}

// ─── Email Change ───────────────────────────────────────────────────
// Two-step primary-email change. The user must re-authenticate with their
// current password to request the change; a verification link is sent to
// the new address and a security notice to the old address. The swap only
// takes effect after the verification token is consumed.

message RequestEmailChangeRequest {
  string new_email = 1;
  string current_password = 2;
}

message RequestEmailChangeResponse {}

message ConfirmEmailChangeRequest {
  string token = 1;
}

message ConfirmEmailChangeResponse {
  User user = 1;
}

// ─── Identity Verification ──────────────────────────────────────────
// Document + selfie verification (e.g. for KYC). Pluggable provider:
// "azure" ships with the service; deployments can wire other providers
// (Onfido, Persona, etc.) through config without changing the API.

enum IdentityVerificationStatus {
  IDENTITY_VERIFICATION_STATUS_UNSPECIFIED = 0;
  IDENTITY_VERIFICATION_STATUS_PENDING = 1;     // Session created, client has not submitted yet
  IDENTITY_VERIFICATION_STATUS_IN_REVIEW = 2;   // Submitted, awaiting provider verdict
  IDENTITY_VERIFICATION_STATUS_APPROVED = 3;
  IDENTITY_VERIFICATION_STATUS_REJECTED = 4;
  IDENTITY_VERIFICATION_STATUS_EXPIRED = 5;
}

message IdentityVerification {
  string id = 1;
  string user_id = 2;
  string tenant_id = 3;
  string provider = 4;                              // "azure", "stub", ...
  string provider_session_id = 5;                   // Provider's check/session ID
  IdentityVerificationStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  string rejection_reason = 10;                     // Empty unless status = REJECTED
}

message BeginIdentityVerificationRequest {}

message BeginIdentityVerificationResponse {
  string verification_id = 1;
  string provider = 2;                              // Tells the client which SDK to load
  string session_token = 3;                         // Provider-specific; passed to client SDK
  google.protobuf.Timestamp expires_at = 4;
}

message GetIdentityVerificationStatusRequest {
  // Optional. When empty, the latest verification for the caller is returned.
  string verification_id = 1;
}

message GetIdentityVerificationStatusResponse {
  IdentityVerification verification = 1;
}

// ─── Verifiable Parental Consent ────────────────────────────────────
// A parent/guardian gives verifiable, recorded, revocable consent for a
// child-band account (one whose status is
// USER_STATUS_PENDING_PARENTAL_CONSENT), which transitions the child to
// USER_STATUS_ACTIVE. The service is deliberately product-neutral: it holds
// no notion of "household" or "family" — the caller's relationship to the
// child is established by whatever upstream system routes the request; this
// surface enforces only that the *consenting adult is who they claim to be*,
// to a standard proportionate to consenting on another person's behalf.

// ParentalConsentVerificationFactor is a strong, server-verified factor the
// consenting adult held on their OWN account at the instant consent was
// granted. GrantParentalConsent requires at least one; the set present is
// snapshotted onto the ConsentRecord so an auditor can later see how the
// adult's identity was assured. A verified email is deliberately NOT on this
// list — an email address is the ordinary login identifier and is not a
// factor strong enough to prove guardianship on someone else's behalf.
enum ParentalConsentVerificationFactor {
  PARENTAL_CONSENT_VERIFICATION_FACTOR_UNSPECIFIED = 0;
  // A phone number whose ownership the adult verified via SMS OTP.
  PARENTAL_CONSENT_VERIFICATION_FACTOR_VERIFIED_PHONE = 1;
  // A WebAuthn passkey registered to the adult's account.
  PARENTAL_CONSENT_VERIFICATION_FACTOR_PASSKEY = 2;
  // An identity-verification (document + selfie) that reached APPROVED.
  PARENTAL_CONSENT_VERIFICATION_FACTOR_IDENTITY_VERIFICATION = 3;
}

// ConsentRecord is the auditable, revocable artifact proving a specific adult
// granted parental consent for a specific child account. It is retained as a
// compliance/audit record and survives deletion of either referenced user,
// matching the audit-trail retention posture.
message ConsentRecord {
  // id is the stable identifier for this consent record.
  string id = 1;
  // child_user_id is the child-band account consent was granted for.
  string child_user_id = 2;
  // consenting_user_id is the adult who granted consent. It is derived
  // server-side from the caller's authenticated session, never from a
  // client-supplied field, so it cannot be spoofed by a modified client.
  string consenting_user_id = 3;
  // policy_version identifies the direct-notice / privacy policy the adult
  // was shown before consenting (COPPA direct-notice; UK Children's Code
  // Standard 4). A consent record with no notice version is not auditable.
  string policy_version = 4;
  // granted_at is the instant consent was recorded.
  google.protobuf.Timestamp granted_at = 5;
  // verification_factors are the strong verified factors present on the
  // consenting adult's account at the moment of consent. Always >= 1.
  repeated ParentalConsentVerificationFactor verification_factors = 6;
  // stepped_up is always true for a persisted grant: the consenting adult
  // re-authenticated at the moment of consent. Recorded explicitly so the
  // artifact is self-describing.
  bool stepped_up = 7;
  // consent_ip / consent_user_agent capture where the consenting action came
  // from, for the audit trail.
  string consent_ip = 8;
  string consent_user_agent = 9;
  // revoked_at is set when consent is withdrawn; unset while the consent is
  // active. revoked_by_user_id records who withdrew it.
  google.protobuf.Timestamp revoked_at = 10;
  string revoked_by_user_id = 11;
  // market is the jurisdiction/market code the child's age band resolved
  // under at grant time (the child's stored market, or the project's
  // configured default). Recorded so an auditor can see WHICH jurisdiction's
  // thresholds the consented classification derived from.
  string market = 12;
}

// ─── Account market ─────────────────────────────────────────────────────
// SetAccountMarket is the authenticated self-service RPC for changing the
// jurisdiction/market code an account's age band derives from. The change is
// audited (account_market_changed) and re-evaluates the band immediately: an
// account that newly classifies as CHILD under the new market's thresholds is
// re-gated to USER_STATUS_PENDING_PARENTAL_CONSENT and its sessions are
// revoked.

message SetAccountMarketRequest {
  // market is the jurisdiction/market code (e.g. "IN", "US") to store on the
  // caller's account. When the project configures per-jurisdiction age
  // thresholds it must name one of them.
  string market = 1;
}

message SetAccountMarketResponse {
  // user is the caller's account after the change, with the re-derived age
  // band and (possibly re-gated) status.
  User user = 1;
}


message GrantParentalConsentRequest {
  // child_user_id is the child-band account (currently in
  // USER_STATUS_PENDING_PARENTAL_CONSENT) consent is granted for.
  string child_user_id = 1;
  // policy_version identifies the notice the consenting adult was shown.
  // Required.
  string policy_version = 2;
  // step_up_password re-authenticates the consenting adult at the moment of
  // consent. The adult's identity is taken from the authenticated session,
  // never from this request; requiring the password here proves the live
  // actor is the account owner, not merely the holder of a valid session
  // token (closing the "spoofable consent" risk). The account must have a
  // password set.
  string step_up_password = 3;
}

message GrantParentalConsentResponse {
  ConsentRecord record = 1;
  // child_status is the child account's resulting status (ACTIVE on success).
  UserStatus child_status = 2;
}

message RevokeParentalConsentRequest {
  // child_user_id is the child-band account whose consent is withdrawn.
  string child_user_id = 1;
  // reason is optional free text, retained for the audit trail only.
  string reason = 2;
}

message RevokeParentalConsentResponse {
  // record is the now-revoked consent record.
  ConsentRecord record = 1;
  // child_status is the child account's resulting status
  // (PENDING_PARENTAL_CONSENT after a successful revoke).
  UserStatus child_status = 2;
}

// ─── Guardian edges ─────────────────────────────────────────────────
// A guardian edge (guardian_user_id -> child_user_id) is the account-graph
// authorization fact that one account manages another. Edges are created
// when verifiable parental consent is granted (and backfilled for consents
// granted before the edge model existed) and removed when that consent is
// revoked; unlike the consent record — an audit artifact retained after
// account deletion — an edge dies with either account it references.

// ListManagedChildren lists the child accounts the authenticated caller
// holds a guardian edge to. The guardian is always the session user: the
// request deliberately carries no user id field, so a client cannot steer
// the query at another account.
message ListManagedChildrenRequest {}

message ListManagedChildrenResponse {
  // children are the managed child accounts, with their age band derived
  // under the jurisdiction thresholds each resolves to.
  repeated User children = 1;
}

// GetGuardians lists the guardians of a child account. Callers must be a
// guardian of that child or a project admin; any other caller receives the
// same PERMISSION_DENIED whether or not the child account exists, so the
// surface discloses nothing about account existence.
message GetGuardiansRequest {
  // child_user_id is the child account whose guardians are listed.
  string child_user_id = 1;
}

message GetGuardiansResponse {
  repeated User guardians = 1;
}

// ─── Managed child accounts ───────────────────────────────────────────
// CreateManagedChildAccount is the parent-creates-child flow: an
// authenticated adult creates a minor's account directly — born
// USER_STATUS_ACTIVE under the adult's guardianship, never passing through
// USER_STATUS_PENDING_PARENTAL_CONSENT, because the consent evidence is
// captured in the SAME call (the ConsentRecord returned here is equivalent
// to a GrantParentalConsent grant). The child is identified within the
// project by a parent-chosen username (children often have no email) and
// signs in with it via PasswordLogin or a bootstrapped passkey.
//
// The calling adult is always the session user — the request deliberately
// carries no caller identity field. Both consent checks from
// GrantParentalConsent apply here unchanged: a strong verified factor on the
// adult's account AND a step-up password re-entry.
//
// This is NOT self-signup: the project access mode (open/allowlist/invite/
// closed) does not gate it. An active authenticated adult in the project may
// create children in it under any mode.

message CreateManagedChildAccountRequest {
  // username is the child account's project-unique handle: lowercase
  // alphanumerics plus `_`/`-`/`.`, 3..32 chars (normalized to lowercase).
  // A duplicate within the project is CodeAlreadyExists.
  string username = 1;
  // display_name is the child's display name (optional).
  string display_name = 2;
  // date_of_birth_ms is required on every call, age gate on or off: a managed
  // child account without a date of birth is never valid. Future or
  // implausibly old values are rejected; a DOB classifying as ADULT is
  // rejected (this RPC creates minor accounts only).
  int64 date_of_birth_ms = 3;
  // market is the jurisdiction/market code the child classifies under.
  // Optional; when the project configures per-jurisdiction age thresholds it
  // must name one of them.
  string market = 4;
  // avatar_url is the child's avatar (optional).
  string avatar_url = 5;
  // password is the parent-chosen password credential for the child. Exactly
  // one of password / passkey_enrolment must be set.
  string password = 6;
  // passkey_enrolment bootstraps a passkey on the child's device instead of a
  // password: the response carries an enrolment ticket the child's device
  // redeems through BeginPasskeyRegistration / CompletePasskeyRegistration
  // within 15 minutes.
  bool passkey_enrolment = 7;
  // policy_version identifies the direct-notice/privacy policy the adult was
  // shown before consenting, exactly as in GrantParentalConsent. Required.
  string policy_version = 8;
  // step_up_password re-authenticates the CALLING ADULT at the moment of
  // creation (verified against the adult's stored password hash), exactly as
  // in GrantParentalConsent.
  string step_up_password = 9;
}

message CreateManagedChildAccountResponse {
  // child is the created account: USER_STATUS_ACTIVE, no email, username set.
  User child = 1;
  // consent is the parental-consent record written atomically with the
  // account and the guardian edge — the consent-equivalence artifact.
  ConsentRecord consent = 2;
  // enrolment_token is set only when passkey_enrolment was requested: the
  // 15-minute ticket the child's device presents to
  // BeginPasskeyRegistration / CompletePasskeyRegistration.
  string enrolment_token = 3;
}

// ─── Admin Help Flow ────────────────────────────────────────────────
// Replaces the self-serve ForgotPassword flow. End users who can't log in
// raise a ticket; admins resolve it via the dashboard.

enum HelpRequestStatus {
  HELP_REQUEST_STATUS_UNSPECIFIED = 0;
  HELP_REQUEST_STATUS_PENDING = 1;
  HELP_REQUEST_STATUS_RESOLVED = 2;
  HELP_REQUEST_STATUS_REJECTED = 3;
}

message AdminHelpRequest {
  string id = 1;
  string email = 2;
  string reason = 3;
  string source_ip = 4;
  string user_agent = 5;
  HelpRequestStatus status = 6;
  string resolved_by = 7;
  string resolution_notes = 8;
  google.protobuf.Timestamp resolved_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message RequestAdminHelpRequest {
  string email = 1;
  string reason = 2;  // Optional — what the user is having trouble with
}

message RequestAdminHelpResponse {
  // Always success — no enumeration
}

message ListHelpRequestsRequest {
  HelpRequestStatus status_filter = 1;  // 0 = all
  string cursor = 2;
  int32 limit = 3;
}

message ListHelpRequestsResponse {
  repeated AdminHelpRequest requests = 1;
  string next_cursor = 2;
  int32 pending_count = 3;
}

message ResolveHelpRequestRequest {
  string request_id = 1;
  bool reject = 2;         // false = resolve, true = reject
  string resolution_notes = 3;
}

message ResolveHelpRequestResponse {
  AdminHelpRequest request = 1;
}

// ─── Passkey Messages ───────────────────────────────────────────

message PasskeyCredentialInfo {
  string credential_id = 1;
  string device_name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

// Registration (requires an authenticated session, OR a passkey-enrolment
// ticket minted by CreateManagedChildAccount for a passwordless child account)
message BeginPasskeyRegistrationRequest {
  string device_name = 1;
  // enrolment_token redeems a managed-child passkey-enrolment ticket (JWT
  // purpose `passkey_enrolment`, 15-minute TTL). When set, the ceremony
  // authenticates as the ticket's subject — the child account — INSTEAD of a
  // session; the ticket rides in the body because a purpose JWT is never a
  // session credential. The ticket is single-purpose but NOT single-use:
  // enrolling passkeys on two of the child's devices within the window is
  // legitimate. Mutually exclusive with an authenticated session.
  string enrolment_token = 2;
}

message BeginPasskeyRegistrationResponse {
  // JSON string of PublicKeyCredentialCreationOptions (frontend passes to navigator.credentials.create)
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeyRegistrationRequest {
  string challenge_id = 1;
  // JSON string of the PublicKeyCredential returned by navigator.credentials.create
  string credential_json = 2;
  string device_name = 3;
  // enrolment_token is the same ticket presented at Begin. Completing with it
  // creates the credential AND issues the child account's first session (see
  // CompletePasskeyRegistrationResponse.access_token).
  string enrolment_token = 4;
}

message CompletePasskeyRegistrationResponse {
  PasskeyCredentialInfo credential = 1;
  // access_token / refresh_token / expires_in carry the child account's first
  // session, set ONLY when the ceremony redeemed an enrolment ticket (the
  // child has no session yet — that is what the ticket bootstraps). A normal
  // session-authenticated completion leaves all three empty.
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
}

// Authentication (no session required)
message BeginPasskeyLoginRequest {
  string email = 1;  // optional — if empty, allows discoverable credentials (resident keys)
}

message BeginPasskeyLoginResponse {
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeyLoginRequest {
  string challenge_id = 1;
  string credential_json = 2;
}

message CompletePasskeyLoginResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
}

// Passkey-first signup (UNAUTHENTICATED account creation via a passkey).
//
// Unlike BeginPasskeyRegistration (which adds a passkey to an already
// authenticated account), this pair creates a brand-new account whose first
// and only credential is a passkey — no password, no session required up
// front. The server mints the new user id during Begin and binds it as the
// WebAuthn user handle so the credential registered here can log in later.
message BeginPasskeySignupRequest {
  string email = 1;
  string device_name = 2;
  reserved 3; reserved "captcha_token";  // Replaced by the X-Assurance-Token header (see IssueAssuranceToken)
}

message BeginPasskeySignupResponse {
  // JSON string of PublicKeyCredentialCreationOptions (frontend passes to navigator.credentials.create)
  string options_json = 1;
  string challenge_id = 2;
}

message CompletePasskeySignupRequest {
  string challenge_id = 1;
  // JSON string of the PublicKeyCredential returned by navigator.credentials.create
  string credential_json = 2;
  string email = 3;
  string device_name = 4;
  // 6-digit OTP emailed by BeginPasskeySignup. Proves control of the email
  // in-flow, so the account is created already-verified and an attacker cannot
  // plant a passkey on an unverified address (account pre-hijacking).
  string otp_code = 5;
}

message CompletePasskeySignupResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
}

// Management
message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated PasskeyCredentialInfo credentials = 1;
}

message DeletePasskeyRequest {
  string credential_id = 1;
}

message DeletePasskeyResponse {}

// ─── QR Login ───────────────────────────────────────────────────────

enum QrLoginStatus {
  QR_LOGIN_STATUS_UNSPECIFIED = 0;
  QR_LOGIN_STATUS_PENDING     = 1;
  QR_LOGIN_STATUS_APPROVED    = 2;
  QR_LOGIN_STATUS_REJECTED    = 3;
  QR_LOGIN_STATUS_EXPIRED     = 4;
  QR_LOGIN_STATUS_CONSUMED    = 5;
}

// Step 1: New device (unauthenticated) initiates a QR login.
message InitiateQrLoginRequest {
  string device_info = 1;  // e.g. "Pixel 8 Pro"
  string user_agent  = 2;
}

message InitiateQrLoginResponse {
  string session_id = 1;  // opaque token for polling
  string qr_url     = 2;  // URL to encode in the QR code
  int32  expires_in = 3;  // seconds until session expires
  // Returned only to the initiating device. Must be presented on every
  // PollQrLogin call. NEVER embedded in qr_url, so an attacker who only
  // sees the scanned QR code cannot poll for the issued tokens.
  string poll_secret = 4;
}

// Step 2a: Authenticated device looks up session details for display.
message GetQrLoginSessionRequest {
  string session_id = 1;
}

message GetQrLoginSessionResponse {
  QrLoginStatus status                 = 1;
  string new_device_info               = 2;
  string new_device_ip                 = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// Step 2b: Authenticated device approves (or rejects) the new device.
message ApproveQrLoginRequest {
  string session_id = 1;
  bool   approve    = 2;
}

message ApproveQrLoginResponse {
  QrLoginStatus status = 1;
}

// Step 3: New device polls for completion.
message PollQrLoginRequest {
  string session_id  = 1;
  // Returned by InitiateQrLogin only to the initiator. Required.
  string poll_secret = 2;
}

message PollQrLoginResponse {
  QrLoginStatus status = 1;
  // Populated only when status == QR_LOGIN_STATUS_APPROVED.
  User   user          = 2;
  string access_token  = 3;
  string refresh_token = 4;
  int32  expires_in    = 5;
}

// ─── 2FA TOTP ────────────────────────────────────────────────────────

message BeginTotpSetupRequest {}

message BeginTotpSetupResponse {
  string secret = 1;                    // Base32 (shown to user once)
  string qr_code_uri = 2;               // otpauth://totp/Glassa:user@example.com?secret=...&issuer=Glassa
  repeated string recovery_codes = 3;   // 10 one-time recovery codes (shown once)
}

message VerifyTotpSetupRequest {
  string code = 1;
}

message VerifyTotpSetupResponse {
  bool verified = 1;
}

message DisableTotpRequest {
  string password = 1;                  // Require password confirmation to disable
}

message DisableTotpResponse {}

message VerifyTotpRequest {
  string login_challenge_id = 1;        // From a pending login
  string code = 2;                      // TOTP code OR recovery code
}

message VerifyTotpResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
}

message RegenerateRecoveryCodesRequest {
  string password = 1;
}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

// ─── Session Management ─────────────────────────────────────────────

message Session {
  string session_id = 1;                // refresh token node id (NOT the raw token)
  string device_name = 2;
  string ip_address = 3;
  string user_agent = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool current = 8;                     // is this the session making the request
}

message ListMySessionsRequest {}

message ListMySessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeAllSessionsRequest {
  string password = 1;                  // Require password to revoke all
}

message RevokeAllSessionsResponse {
  int32 revoked_count = 1;
}

message SignOutEverywhereRequest {
  string password = 1;                  // Require password confirmation
}

message SignOutEverywhereResponse {
  int32 revoked_count = 1;
}

// ─── Audit Log ──────────────────────────────────────────────────────

message AuditEvent {
  string id = 1;
  string event_type = 2;                // see AuditEventType enum values in schema.yaml
  string actor_user_id = 3;
  string target_user_id = 4;
  string ip_address = 5;
  string user_agent = 6;
  bool success = 7;
  string details = 8;                   // JSON blob for event-specific data
  google.protobuf.Timestamp created_at = 9;
}

message ListAuditEventsRequest {
  string actor_user_id = 1;             // optional filter
  string target_user_id = 2;            // optional filter
  string event_type = 3;                // optional filter
  int64 start_time_ms = 4;              // optional: events >= this ms epoch
  int64 end_time_ms = 5;                // optional: events <= this ms epoch
  int32 limit = 6;                      // default 50, max 500
  string cursor = 7;                    // opaque pagination cursor (offset-based)
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_cursor = 2;
}

// ─── Admin User Management ──────────────────────────────────────────
// Google Workspace-style admin RPCs. ALL RPCs in this section require the
// caller's JWT to carry role=admin (enforced in the servicer per-method).

message InviteUserRequest {
  string email = 1;
  string name = 2;
  string role = 3;                   // "admin", "member", "guest"
  string recovery_email = 4;
  int64 quota_bytes = 5;
  // If false: create a pending invitation; the user completes signup via AcceptInvitation.
  // If true: create a fully-active user and return a temporary password to the admin.
  bool create_immediately = 6;
}

message InviteUserResponse {
  User user = 1;
  string invitation_token = 2;       // One-time setup token (shown to admin once, emailed in prod)
  string setup_url = 3;              // Full URL with token embedded
  string temporary_password = 4;     // Only set when create_immediately = true
}

message AcceptInvitationRequest {
  string invitation_token = 1;
  string password = 2;
  string name = 3;
}

message AcceptInvitationResponse {
  User user = 1;
  string access_token = 2;
  string refresh_token = 3;
  int32 expires_in = 4;
}

message DeactivateUserRequest {
  string user_id = 1;
  string reason = 2;
}

message DeactivateUserResponse {}

message ReactivateUserRequest {
  string user_id = 1;
}

message ReactivateUserResponse {}

message ResetUserPasswordRequest {
  string user_id = 1;
  // If true: generate a random temp password and return it to the admin.
  // If false: create a reset token the admin hands off to the user.
  bool generate_temp_password = 2;
}

message ResetUserPasswordResponse {
  string temporary_password = 1;     // Only set when generate_temp_password = true
  string reset_token = 2;            // Only set when generate_temp_password = false
}

message SetUserQuotaRequest {
  string user_id = 1;
  int64 quota_bytes = 2;
}

message SetUserQuotaResponse {}

// ─── Tenant domains (redesign) ───────────────────────────────────────

// Domain is an email domain bound to a Tenant within the caller's
// Project. Verifying it (DNS TXT or email) flips its status to verified
// and claims the owning tenant.
message Domain {
  string id = 1;
  string tenant_id = 2;
  string domain = 3;
  string verification_method = 4;      // "dns_txt" | "email"
  string status = 5;                   // "pending" | "verified" | "failed"
  google.protobuf.Timestamp verified_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateDomainRequest {
  string tenant_id = 1;
  string domain = 2;
  string verification_method = 3;      // "dns_txt" | "email"
}

message CreateDomainResponse {
  Domain domain = 1;
  // The DNS TXT challenge the caller must publish before VerifyDomain
  // succeeds. Populated for verification_method = "dns_txt"; empty for
  // "email" (which verifies by an out-of-band confirmation link).
  string dns_txt_name = 2;             // host the TXT record is published on
  string dns_txt_value = 3;            // exact TXT value to publish
}

message VerifyDomainRequest {
  string domain_id = 1;
}

message VerifyDomainResponse {
  Domain domain = 1;
}

message ListTenantDomainsRequest {
  string tenant_id = 1;
}

message ListTenantDomainsResponse {
  repeated Domain domains = 1;
}

// TenantMembership is a user's materialized relationship to a Tenant within
// the caller's Project.
message TenantMembership {
  string id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string source = 4;                   // "domain" | "invited" | "added"
  string role = 5;                     // "member" | "admin" | "owner"
  string status = 6;                   // "active" | "pending" | "inactive"
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// TenantInvitation is a pending offer to join a Tenant, addressed to an
// email. The raw redemption token is never exposed here — it travels only
// in the invitation email.
message TenantInvitation {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string invited_by = 4;
  string role = 5;                     // "member" | "admin" | "owner"
  string status = 6;                   // "pending" | "accepted" | "revoked" | "expired"
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp accepted_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

message CreateTenantInvitationRequest {
  string tenant_id = 1;
  string email = 2;
  string role = 3;                     // "member" (default) | "admin" | "owner"
}

message CreateTenantInvitationResponse {
  TenantInvitation invitation = 1;
  // raw_token is the unhashed redemption token. It is populated ONLY when
  // no mailer is configured (so a headless/dev deployment can still drive
  // the flow); when an email was dispatched it is empty, because the token
  // belongs in the recipient's inbox, not the API response.
  string raw_token = 2;
}

message AcceptTenantInvitationRequest {
  string token = 1;
}

message AcceptTenantInvitationResponse {
  TenantMembership membership = 1;
}

message ListTenantInvitationsRequest {
  string tenant_id = 1;
}

message ListTenantInvitationsResponse {
  repeated TenantInvitation invitations = 1;
}

message ListTenantMembersRequest {
  string tenant_id = 1;
}

message ListTenantMembersResponse {
  repeated TenantMembership members = 1;
}

message RemoveTenantMemberRequest {
  string tenant_id = 1;
  string user_id = 2;
}

message RemoveTenantMemberResponse {}

// ─── Control-plane admin (redesign) ──────────────────────────────────
//
// These are PLATFORM-operator RPCs used to provision projects, tenants and
// credentials out-of-band. They are NOT user-authenticated: the caller
// proves it is the operator by presenting the shared admin secret in the
// "X-Admin-Secret" header (constant-time compared against
// GATEWAY_ADMIN_API_SECRET). When that env var is unset the RPCs are
// DISABLED and return UNIMPLEMENTED, so a deployer who never configures the
// secret cannot have them reached.

message AdminCreateProjectRequest {
  string name = 1;
  // storage_scope_id maps the new project onto a physical storage scope (a
  // shard), exactly as the default project maps onto GATEWAY_DEFAULT_TENANT_ID.
  // Required and globally unique.
  string storage_scope_id = 2;
}

message AdminCreateProjectResponse {
  string project_id = 1;
}

message AdminCreateProjectCredentialRequest {
  string project_id = 1;
  // kind selects the credential type: "publishable" (a public lookup key,
  // no secret) or "secret" (a key whose secret half is shown ONCE).
  string kind = 2;
}

message AdminCreateProjectCredentialResponse {
  string credential_id = 1;
  // public_id is the non-secret lookup key (safe to embed in clients).
  string public_id = 2;
  // raw_key is the full credential, returned ONCE at creation and never
  // again — only its hash is stored. Empty for a publishable kind, which
  // has no secret half.
  string raw_key = 3;
}

message AdminAddProjectAuthDomainRequest {
  string project_id = 1;
  string hostname = 2;
  // is_primary makes this the project's primary serving host (used to build
  // branded links). At most one primary per project.
  bool is_primary = 3;
}

message AdminAddProjectAuthDomainResponse {}

// ProjectAuthDomain is a project's serving hostname as returned by the
// customer-facing custom-domain RPCs. verified_at_ms is 0 until ownership is
// proven (a deployer-seeded or operator-vouched domain is pre-verified); an
// unverified domain does NOT resolve requests.
message ProjectAuthDomain {
  string hostname = 1;
  bool is_primary = 2;
  // verified_at_ms is the epoch-millis the domain's ownership was proven, or 0
  // when it is still unverified (and therefore non-resolving).
  int64 verified_at_ms = 3;
}

message AddProjectAuthDomainRequest {
  string project_id = 1;
  string hostname = 2;
  // is_primary is RESERVED and NOT honored here: a request with is_primary=true
  // is rejected with InvalidArgument. A custom domain is always added
  // non-primary. To make a verified custom domain the project's primary serving
  // host, add it non-primary, verify it, then call SetPrimaryAuthDomain —
  // promotion requires a verified domain and is applied atomically.
  bool is_primary = 3;
}

message AddProjectAuthDomainResponse {
  ProjectAuthDomain domain = 1;
  // txt_name is the DNS record name (the hostname itself) the caller must
  // create a TXT record on to prove ownership.
  string txt_name = 2;
  // txt_value is the exact TXT record value to publish. It is deterministic
  // per (project, hostname), so re-issuing returns the same challenge.
  string txt_value = 3;
}

message VerifyProjectAuthDomainRequest {
  string project_id = 1;
  string hostname = 2;
}

message VerifyProjectAuthDomainResponse {
  ProjectAuthDomain domain = 1;
}

message ListProjectAuthDomainsRequest {
  string project_id = 1;
}

message ListProjectAuthDomainsResponse {
  repeated ProjectAuthDomain domains = 1;
}

message SetPrimaryAuthDomainRequest {
  string project_id = 1;
  string hostname = 2;
}

message SetPrimaryAuthDomainResponse {
  ProjectAuthDomain domain = 1;
}

message AdminCreateTenantRequest {
  string project_id = 1;
  string name = 2;
  string primary_domain = 3;
}

message AdminCreateTenantResponse {
  string tenant_id = 1;
}

message AdminAddTenantAdminRequest {
  string project_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  // role grants tenant administration: "owner" (default) or "admin".
  string role = 4;
}

message AdminAddTenantAdminResponse {
  TenantMembership membership = 1;
}

// CreateFirstPlatformAdmin is the trust-on-first-use (TOFU) bootstrap that
// establishes the FIRST platform admin on a fresh deployment. It is
// self-securing: it succeeds ONLY while the platform_admins table is empty,
// and once any admin exists the path is permanently closed (FAILED_PRECONDITION),
// so it can never be used to escalate privilege on an already-provisioned
// deployment. The emptiness check + insert are atomic, so two racing bootstraps
// create exactly one admin and the loser is rejected.
//
// Its authentication depends on how the deployment is configured, so a fresh
// internet-exposed deployment can be hardened against an anonymous caller
// winning the first-admin race:
//   - When GATEWAY_ADMIN_API_SECRET is UNSET it is zero-config and reachable
//     without any credential — the one Admin* RPC that does not need the shared
//     admin secret — so a brand-new deployer can stand up the initial operator.
//   - When GATEWAY_ADMIN_API_SECRET is SET it is gated on that secret exactly
//     like every other Admin* RPC: the caller must present the matching
//     X-Admin-Secret header or the call is rejected (PERMISSION_DENIED).
//   - When GATEWAY_DISABLE_FIRST_ADMIN_BOOTSTRAP=true it is closed entirely and
//     always rejected (FAILED_PRECONDITION), regardless of whether any admin
//     exists — for operators who create the first admin out of band.
//
// It is available only on the postgres control-plane driver; the memory driver
// deployments (which have no platform_admins table) return UNIMPLEMENTED.
message CreateFirstPlatformAdminRequest {
  string email = 1;
  // password is optional. When blank the server generates a strong one and
  // returns it ONCE in generated_password; when supplied it must meet the
  // password-strength policy or the call is rejected (INVALID_ARGUMENT).
  string password = 2;
}

message CreateFirstPlatformAdminResponse {
  string admin_id = 1;
  string email = 2;
  // generated_password carries a server-generated password shown EXACTLY
  // once, and only when the request left password blank. It is empty when
  // the caller supplied their own password.
  string generated_password = 3;
}

// LoginPolicy is a claimed tenant's authentication policy, as authored and
// read back by the operator RPCs. It mirrors service.LoginPolicy.
message LoginPolicy {
  string project_id = 1;
  string tenant_id = 2;
  // allowed_methods is a comma-separated allow-list of login-method tokens
  // ("email_otp", "password", "oauth", "passkey", "sso"). Empty means no
  // restriction (the login path falls back to its safe default).
  string allowed_methods = 3;
  // sso_required forces SSO; sso_connection_json carries the IdP connection
  // config as a JSON object ("{}" when unset).
  bool sso_required = 4;
  string sso_connection_json = 5;
  // require_2fa forces a second factor after the primary method.
  bool require_2fa = 6;
  int64 created_at_ms = 7;
  int64 updated_at_ms = 8;
  // password_min_length is the tenant's minimum password length. 0 means "use
  // the global minimum"; a tenant can only ever raise the floor, never lower it.
  int32 password_min_length = 9;
  // session_idle_timeout_seconds invalidates a session unused for this long. 0
  // means "no idle timeout" (global behavior).
  int64 session_idle_timeout_seconds = 10;
  // session_absolute_timeout_seconds invalidates a session older than this,
  // measured from the original login regardless of activity. 0 means "no
  // absolute timeout".
  int64 session_absolute_timeout_seconds = 11;
}

message UpsertLoginPolicyRequest {
  string project_id = 1;
  string tenant_id = 2;
  string allowed_methods = 3;
  bool sso_required = 4;
  string sso_connection_json = 5;
  bool require_2fa = 6;
  // password_min_length tightens the tenant's minimum password length (0 =
  // global default; tenants tighten, never loosen).
  int32 password_min_length = 7;
  // session_idle_timeout_seconds / session_absolute_timeout_seconds set the
  // tenant's idle and absolute session timeouts (0 = no timeout).
  int64 session_idle_timeout_seconds = 8;
  int64 session_absolute_timeout_seconds = 9;
}

message UpsertLoginPolicyResponse {
  LoginPolicy policy = 1;
}

message GetLoginPolicyRequest {
  string project_id = 1;
  string tenant_id = 2;
}

message GetLoginPolicyResponse {
  // policy is unset when no LoginPolicy exists for (project, tenant) — the
  // login path then imposes no restriction.
  LoginPolicy policy = 1;
}

message DeleteLoginPolicyRequest {
  string project_id = 1;
  string tenant_id = 2;
}

message DeleteLoginPolicyResponse {}

message UpsertProjectConfigRequest {
  string project_id = 1;
  // config_json is the project's full config blob (a JSON object). It
  // REPLACES the project's existing config; an empty value normalises to
  // "{}" (no per-project overrides). A malformed blob is rejected
  // (INVALID_ARGUMENT).
  string config_json = 2;
}

message UpsertProjectConfigResponse {
  string config_json = 1;
}

message GetProjectConfigRequest {
  string project_id = 1;
}

message GetProjectConfigResponse {
  // config_json is the project's stored config blob ("{}" when unset).
  string config_json = 1;
}

// ─── Per-project OAuth provider authoring (admin) ─────────────────────
//
// These author a project's hosted/native OAuth providers WITHOUT the
// operator hand-crafting encrypted secrets. On a write the operator sends
// the PLAINTEXT secret over TLS; the server encrypts it with
// GATEWAY_PROJECT_SECRETS_KEY and stores it. Reads NEVER return a secret —
// they set has_client_secret / has_private_key instead. Operator-only, like
// the other Admin* RPCs, and UNIMPLEMENTED on a build with no control plane.

// ProjectOAuthProviderConfig is one provider block of a project's hosted/native
// OAuth configuration. Secret fields (client_secret, apple_private_key) are
// WRITE-ONLY: they are accepted on a write and never returned on a read.
message ProjectOAuthProviderConfig {
  // provider is the provider key this block configures: "google", "microsoft",
  // "apple", "github", or "oidc". Required.
  string provider = 1;

  // client_id is the OAuth client id. For the hosted flow it is required; for a
  // native-only Google/Apple/Microsoft it is the web client id.
  string client_id = 2;

  // client_secret is the PLAINTEXT client secret (Google/Microsoft/GitHub/OIDC),
  // sent only on a write over TLS and stored encrypted at rest. It is NEVER returned
  // on a read (see has_client_secret). On a write an EMPTY value keeps the
  // currently-stored secret, so non-secret fields can be edited without
  // re-sending it; send a non-empty value to set or rotate the secret.
  string client_secret = 3;

  // has_client_secret is READ-only: true when a client secret is stored for the
  // provider. It is ignored on a write.
  bool has_client_secret = 4;

  // native_audiences is the accepted native ID-token `aud` allow-list
  // (Google/Apple/Microsoft native mobile-SDK login). Empty disables native
  // login for the provider.
  repeated string native_audiences = 5;

  // Google endpoint overrides — optional, default to the live Google endpoints
  // (used by tests / self-hosted proxies).
  string google_authorization_url = 6;
  string google_token_url = 7;
  string google_jwks_url = 8;
  string google_issuer = 9;

  // microsoft_tenant_id pins a single Azure AD tenant (empty = multi-tenant).
  // microsoft_issuer_format is the fmt string the accepted issuer is built from;
  // it must contain exactly one %s verb (the token's tid). Empty uses the live
  // default.
  string microsoft_tenant_id = 10;
  string microsoft_issuer_format = 11;

  // microsoft_allowed_tenants is a multi-tenant allow-list of Azure AD directory
  // (tenant) GUIDs. When non-empty, a Microsoft token whose `tid` is not a member
  // is rejected (hosted + native) — the several-trusted-tenants counterpart to
  // the single microsoft_tenant_id pin, closing the nOAuth account-takeover
  // vector for multi-tenant apps. Entries must be GUIDs (a token's `tid` is
  // always a directory GUID, so a domain-form entry could never match and is
  // rejected at config time). Empty imposes no allow-list.
  repeated string microsoft_allowed_tenants = 19;

  // apple_team_id / apple_key_id identify the Apple signing key. apple_private_key
  // is the PLAINTEXT PKCS#8 key (Apple has no client secret); it is write-only,
  // stored encrypted, and empty-keeps like client_secret.
  string apple_team_id = 12;
  string apple_key_id = 13;
  string apple_private_key = 14;

  // has_private_key is READ-only: true when an Apple private key is stored for
  // the provider. It is ignored on a write.
  bool has_private_key = 15;

  // oidc_issuer / oidc_discovery_url locate the generic OIDC provider's metadata
  // (one is required). oidc_scopes is a space-separated scope list (empty
  // defaults to "openid email profile"; "openid" is always ensured).
  string oidc_issuer = 16;
  string oidc_discovery_url = 17;
  string oidc_scopes = 18;

  // GitHub endpoint overrides — optional, default to the live GitHub endpoints
  // (used by tests / self-hosted GitHub Enterprise proxies). GitHub is
  // hosted-only (GitHub OAuth issues no ID token), so it has no native_audiences.
  string github_authorization_url = 20;
  string github_token_url = 21;
  string github_user_url = 22;
  string github_user_mail_url = 23;
}

message AdminSetProjectOAuthProviderRequest {
  string project_id = 1;
  // config carries the provider key plus its non-secret fields and any
  // plaintext secret to store. It fully replaces the named provider's block,
  // preserving every OTHER key in the project's config (branding, passkey, …).
  ProjectOAuthProviderConfig config = 2;
}

message AdminSetProjectOAuthProviderResponse {
  // config is the stored provider config with secrets REDACTED (has_* flags set
  // instead of any secret material).
  ProjectOAuthProviderConfig config = 1;
}

// AdminSetProjectAssurance authors a project's client-assurance app
// identity (config_json `assurance`). The Play Integrity service-account
// key is supplied in PLAINTEXT and encrypted server-side under
// GATEWAY_PROJECT_SECRETS_KEY, exactly like an OAuth client secret; leave
// it empty to keep the stored one when rotating other Android fields.
//
// The write MERGES per platform: supplying any field of a platform
// replaces that platform's block, while a platform you do not mention is
// left exactly as stored. That matters because the stored
// service-account key is ciphertext the operator cannot recover — an
// iOS-only rotation must never destroy it. To remove a platform, set its
// clear_ios / clear_android flag explicitly.
message AdminSetProjectAssuranceRequest {
  string project_id = 1;
  ProjectAssuranceConfig config = 2;
}

message AdminSetProjectAssuranceResponse {
  // config is the stored assurance config with the service-account key
  // REDACTED (has_service_account_key set instead of any key material).
  ProjectAssuranceConfig config = 1;
}

// ProjectAssuranceConfig is one project's attestation app identity. Both
// platform blocks are optional and independent.
message ProjectAssuranceConfig {
  // iOS App Attest: team id + bundle id form the App ID; env is
  // "production" (default) or "development".
  string ios_team_id   = 1;
  string ios_bundle_id = 2;
  string ios_env       = 3;

  // Android Play Integrity.
  string android_package_name = 4;
  repeated string android_cert_sha256_digests = 5;
  // Write-only: the Google service-account JSON key, in plaintext. Stored
  // encrypted; never returned by a read.
  string android_service_account_key = 6;
  // Read-only: whether a service-account key is stored.
  bool has_service_account_key = 7;

  // Explicit removal. Setting a clear flag deletes that platform's stored
  // block (including, for Android, the encrypted service-account key).
  // Omitting a platform LEAVES IT UNCHANGED — deletion is never implicit.
  bool clear_ios     = 8;
  bool clear_android = 9;
}

// AdminGetProjectAssurance reads back a project's assurance app identity
// with the service-account key REDACTED — has_service_account_key is the
// signal that an encrypted key survived a rotation.
message AdminGetProjectAssuranceRequest {
  string project_id = 1;
}

message AdminGetProjectAssuranceResponse {
  ProjectAssuranceConfig config = 1;
}

message AdminDeleteProjectOAuthProviderRequest {
  string project_id = 1;
  // provider is the provider key to remove: "google", "microsoft", "apple",
  // "github", or "oidc". Removing an absent provider is a no-op (idempotent).
  string provider = 2;
}

message AdminDeleteProjectOAuthProviderResponse {}

message AdminListProjectOAuthProvidersRequest {
  string project_id = 1;
}

message AdminListProjectOAuthProvidersResponse {
  // providers lists every configured provider with secrets REDACTED, ordered by
  // provider key.
  repeated ProjectOAuthProviderConfig providers = 1;
}

// ─── Service ─────────────────────────────────────────────────────────

// ── Client assurance (attestation) ─────────────────────────────────────────

// CreateAssuranceChallenge issues a one-time nonce an attestation or
// assertion must be bound to. Web evidence needs no challenge (the
// captcha provider runs its own).
message CreateAssuranceChallengeRequest {
  string platform = 1;  // "ios" | "android"
}

message CreateAssuranceChallengeResponse {
  string challenge_id = 1;
  // challenge is a base64url nonce. iOS uses this STRING's UTF-8 bytes as
  // the App Attest clientData; Android passes the STRING verbatim as the
  // Play Integrity nonce (Play echoes it back and the server compares it
  // as a string).
  string challenge     = 2;
  int64  expires_at_ms = 3;
}

// IssueAssuranceToken exchanges verified platform evidence for an
// assurance token. Exactly the fields for `platform` are consulted.
message IssueAssuranceTokenRequest {
  string platform     = 1;  // "ios" | "android" | "web"
  string challenge_id = 2;  // ios + android

  // iOS: DCAppAttestService.attestKey output.
  string key_id             = 3;  // standard-base64 key identifier
  bytes  attestation_object = 4;  // raw CBOR attestation object

  // Android: Play Integrity API token (server-side decoded via Google).
  string integrity_token = 5;

  // Web: Turnstile / reCAPTCHA solution.
  string web_token = 6;
}

message IssueAssuranceTokenResponse {
  // assurance_token is a JWT signed by this deployment's JWKS with
  // aud="assurance" and NO subject — it asserts the client, never a user.
  // Attach it as the X-Assurance-Token header.
  string assurance_token = 1;
  int64  expires_at_ms   = 2;
}

// RefreshAssuranceToken renews an assurance token without a full
// re-attestation: iOS-only, via an App Attest assertion over a fresh
// challenge signed by the device's Secure Enclave key. Android clients
// re-run IssueAssuranceToken (Play Integrity has no persistent key).
message RefreshAssuranceTokenRequest {
  string challenge_id = 1;
  string key_id       = 2;
  bytes  assertion    = 3;  // raw CBOR assertion object
}

message RefreshAssuranceTokenResponse {
  string assurance_token = 1;
  int64  expires_at_ms   = 2;
}

// ── Anonymous identity ─────────────────────────────────────────────────────

// SignInAnonymously creates a brand-new account with NO credential and
// returns it with a token pair. Every call mints a NEW user: there is
// nothing to authenticate against, so a returning client is recognised
// only by the refresh token it persisted. Lose that token and the account
// is unreachable forever.
//
// Availability is a per-project switch (`anonymous.enabled` in the project
// config, GATEWAY_ANONYMOUS_ENABLED for the default project), default OFF.
// SIGN-IN is INDEPENDENT of the project access mode: a project running
// mode=closed — admitting no new identified users — may still hand out
// anonymous sessions, because the access mode governs which
// email-identified humans may sign up and log in, a different question.
// Gate anonymous traffic with the assurance layer
// (GATEWAY_ANONYMOUS_REQUIRE_ASSURANCE) rather than the access mode.
// UpgradeAnonymousAccount is NOT independent of it — see that RPC.
//
// Anonymous users are reaped after GATEWAY_ANONYMOUS_RETENTION_DAYS of
// inactivity (default 30, measured from the last token refresh).
message SignInAnonymouslyRequest {}

message SignInAnonymouslyResponse {
  User   user          = 1;  // is_anonymous is true; email is empty
  string access_token  = 2;
  string refresh_token = 3;  // the account's ONLY means of return — persist it
  int32  expires_in    = 4;  // access token lifetime in seconds
}

// UpgradeAnonymousAccount attaches a permanent credential to the CALLING
// anonymous account, in place, PRESERVING ITS ID — the server half of
// Firebase's linkWithCredential. Everything written against the anonymous
// id stays attached to the same subject, so no data migration is needed.
//
// Requires an authenticated anonymous caller (the access token identifies
// the account; there is no user_id field, so one account can never upgrade
// another). Exactly one credential must be set.
//
// Enforced with SIGNUP semantics against the project access mode, because
// attaching a credential provisions an email-identified account in the
// project's namespace. Under mode=closed (the DEFAULT), invite, or an
// off-list allowlist this returns PERMISSION_DENIED and the account stays
// anonymous — so a project must be open for the upgrade half to work.
//
// When GATEWAY_AUTH_REQUIRE_VERIFIED_EMAIL is on (the default), the password
// arm promotes the account and returns NO tokens, mirroring PasswordSignup;
// the client drives "check your email".
//
// Errors: PERMISSION_DENIED when the access mode forbids provisioning;
// FAILED_PRECONDITION when the caller is not anonymous (a second upgrade
// would silently rebind an identified account); ALREADY_EXISTS when the
// credential already belongs to someone else — matching
// linkWithCredential's credential-already-in-use, and deliberately NOT
// merging the two accounts; UNAVAILABLE when local auth is disabled.
message UpgradeAnonymousAccountRequest {
  oneof credential {
    PasswordCredential password = 1;
    OAuthCredential    oauth    = 2;
  }
}

// PasswordCredential upgrades the account to an email + password login.
// The email must be unclaimed within the project.
message PasswordCredential {
  string email    = 1;
  string password = 2;
  string name     = 3;  // optional display name
}

// OAuthCredential upgrades the account to a federated login. The server
// performs the provider code exchange itself — the client never asserts
// the identity — exactly as OAuthLogin and LinkIdentity do.
message OAuthCredential {
  string provider      = 1;  // "google" | "microsoft" | "apple" | "github" | "oidc"
  string code          = 2;
  string redirect_uri  = 3;
  string code_verifier = 4;
  string state         = 5;
  string state_token   = 6;
}

message UpgradeAnonymousAccountResponse {
  User   user          = 1;  // same id as before; is_anonymous now false
  string access_token  = 2;  // reissued so the anonymous claim is dropped
  string refresh_token = 3;
  int32  expires_in    = 4;
}

// ── Linked identities (self-service connected accounts) ────────────────────
//
// User-managed OAuth/OIDC identity links. These let an authenticated user
// see which providers are connected to their account, attach a new verified
// provider identity, and disconnect one — without losing the ability to sign
// in. They operate over the same (provider, provider_user_id) link store that
// implicit login-time auto-linking writes to; the auto-link behaviour is
// unchanged.

// LinkedIdentity is one connected provider identity for the authenticated user.
message LinkedIdentity {
  string provider            = 1;  // "google", "microsoft", "github", "apple", ...
  string provider_user_id    = 2;  // stable provider subject
  string email_at_link_time  = 3;  // email the provider asserted when linked
  int64  linked_at           = 4;  // epoch ms the link was created
}

message ListLinkedIdentitiesRequest {}

message ListLinkedIdentitiesResponse {
  repeated LinkedIdentity identities = 1;
}

// LinkIdentity attaches a freshly-verified OAuth identity to the
// authenticated caller. The server performs the provider code exchange
// itself (the client is never trusted to assert the identity), exactly like
// OAuthLogin, then persists the (provider, provider_user_id) link against the
// caller's user id. If that provider identity is already linked to a
// different user the call fails (CodeAlreadyExists).
message LinkIdentityRequest {
  string code          = 1;  // authorization code from the provider callback
  string redirect_uri  = 2;
  string provider      = 3;  // "google", "microsoft", "github", "apple", ...
  string code_verifier = 4;  // PKCE (optional)
  string state         = 5;  // authorization callback state
  string state_token   = 6;  // opaque token minted by BeginOAuthLogin
}

message LinkIdentityResponse {
  LinkedIdentity identity = 1;
}

// UnlinkIdentity disconnects a provider identity from the authenticated
// caller. It refuses (CodeFailedPrecondition) to remove the user's LAST
// remaining sign-in credential: if the user has no password and no passkey,
// the final linked provider cannot be removed, so the account can never be
// locked out of its own sign-in.
message UnlinkIdentityRequest {
  string provider         = 1;
  string provider_user_id = 2;
}

message UnlinkIdentityResponse {}

service IdentityService {
  // Authentication
  rpc BeginOAuthLogin(BeginOAuthLoginRequest) returns (BeginOAuthLoginResponse);
  rpc OAuthLogin(OAuthLoginRequest) returns (OAuthLoginResponse);
  rpc NativeOAuthLogin(NativeOAuthLoginRequest) returns (NativeOAuthLoginResponse);
  rpc RedeemOAuthCode(RedeemOAuthCodeRequest) returns (RedeemOAuthCodeResponse);
  rpc PasswordSignup(PasswordSignupRequest) returns (PasswordSignupResponse);
  rpc PasswordLogin(PasswordLoginRequest) returns (PasswordLoginResponse);
  // Required-DOB completion step (GATEWAY_AGEGATE_REQUIRE_DOB): the only
  // RPC that accepts the completion ticket carried by the dob_required
  // error detail. Unauthenticated — the caller holds a ticket, not a
  // session.
  rpc SubmitDateOfBirth(SubmitDateOfBirthRequest) returns (SubmitDateOfBirthResponse);

  // Passwordless email login (OTP code + magic link)
  rpc RequestEmailLoginCode(RequestEmailLoginCodeRequest) returns (RequestEmailLoginCodeResponse);
  rpc VerifyEmailLoginCode(VerifyEmailLoginCodeRequest) returns (VerifyEmailLoginCodeResponse);
  rpc RequestMagicLink(RequestMagicLinkRequest) returns (RequestMagicLinkResponse);
  rpc RedeemMagicLink(RedeemMagicLinkRequest) returns (RedeemMagicLinkResponse);

  // Client assurance — App Check-style attestation, independent of user
  // identity. A client proves it is a genuine build on genuine hardware
  // (iOS App Attest / Android Play Integrity) or a human-passed web
  // client (Turnstile / reCAPTCHA), and receives a short-lived assurance
  // token to attach as the X-Assurance-Token header on subsequent RPCs.
  rpc CreateAssuranceChallenge(CreateAssuranceChallengeRequest) returns (CreateAssuranceChallengeResponse);
  rpc IssueAssuranceToken(IssueAssuranceTokenRequest) returns (IssueAssuranceTokenResponse);
  rpc RefreshAssuranceToken(RefreshAssuranceTokenRequest) returns (RefreshAssuranceTokenResponse);

  // Phone verification (SMS OTP) — proves the authenticated caller owns a phone number
  rpc RequestPhoneVerification(RequestPhoneVerificationRequest) returns (RequestPhoneVerificationResponse);
  rpc VerifyPhoneCode(VerifyPhoneCodeRequest) returns (VerifyPhoneCodeResponse);

  // Session / Token Auth
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Self-service profile
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Self-service account market (jurisdiction) change. Audited; re-derives
  // the caller's age band under the new market's thresholds and re-gates the
  // account to PENDING_PARENTAL_CONSENT when it newly classifies as CHILD.
  rpc SetAccountMarket(SetAccountMarketRequest) returns (SetAccountMarketResponse);

  // Self-service account deletion (GDPR Art 17). The caller schedules
  // deletion of their OWN account (grace-period soft delete); a login during
  // the window, or an explicit cancel, restores it.
  rpc DeleteMyAccount(DeleteMyAccountRequest) returns (DeleteMyAccountResponse);
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse);

  // Self-service data export (GDPR Art 15 access + Art 20 portability). The
  // caller downloads a structured, machine-readable copy of the personal data
  // the identity service holds about them. Secret material is never included.
  rpc ExportMyData(ExportMyDataRequest) returns (ExportMyDataResponse);

  // Password Management
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);

  // Email Verification
  rpc SendEmailVerification(SendEmailVerificationRequest) returns (SendEmailVerificationResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);

  // Email Change (primary-email rotation, double-opt-in)
  rpc RequestEmailChange(RequestEmailChangeRequest) returns (RequestEmailChangeResponse);
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse);

  // Identity Verification (document + selfie via pluggable provider)
  rpc BeginIdentityVerification(BeginIdentityVerificationRequest) returns (BeginIdentityVerificationResponse);
  rpc GetIdentityVerificationStatus(GetIdentityVerificationStatusRequest) returns (GetIdentityVerificationStatusResponse);

  // Verifiable Parental Consent — grant/withdraw a recorded, revocable
  // parental consent for a child-band account, moving it in/out of
  // USER_STATUS_PENDING_PARENTAL_CONSENT. Both server-side checks in
  // GrantParentalConsent (a strong verified factor on the consenting adult's
  // account AND a step-up re-authentication at the moment of consent) are
  // mandatory; a client cannot bypass them.
  rpc GrantParentalConsent(GrantParentalConsentRequest) returns (GrantParentalConsentResponse);
  rpc RevokeParentalConsent(RevokeParentalConsentRequest) returns (RevokeParentalConsentResponse);

  // Guardian edges — the account-graph facts recording which adult accounts
  // manage which child accounts. ListManagedChildren is self-only (the
  // guardian is always the session user); GetGuardians is callable by a
  // guardian of the child or a project admin, and answers identically whether
  // or not the child exists (no existence disclosure).
  rpc ListManagedChildren(ListManagedChildrenRequest) returns (ListManagedChildrenResponse);
  rpc GetGuardians(GetGuardiansRequest) returns (GetGuardiansResponse);

  // Managed child accounts — the parent-creates-child flow. An authenticated
  // adult creates a minor's account (born USER_STATUS_ACTIVE under the
  // caller's guardianship, consent recorded atomically in the same call),
  // identified by a parent-chosen username, with either a parent-chosen
  // password or a passkey-enrolment ticket as the child's credential. The
  // calling adult is the session user; the project access mode does not gate
  // this (it is not self-signup).
  rpc CreateManagedChildAccount(CreateManagedChildAccountRequest) returns (CreateManagedChildAccountResponse);

  // Admin help (replaces self-serve ForgotPassword)
  rpc RequestAdminHelp(RequestAdminHelpRequest) returns (RequestAdminHelpResponse);
  rpc ListHelpRequests(ListHelpRequestsRequest) returns (ListHelpRequestsResponse);
  rpc ResolveHelpRequest(ResolveHelpRequestRequest) returns (ResolveHelpRequestResponse);

  // Passkey / WebAuthn
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc CompletePasskeyRegistration(CompletePasskeyRegistrationRequest) returns (CompletePasskeyRegistrationResponse);
  // Passkey-first signup — unauthenticated account creation via a passkey.
  rpc BeginPasskeySignup(BeginPasskeySignupRequest) returns (BeginPasskeySignupResponse);
  rpc CompletePasskeySignup(CompletePasskeySignupRequest) returns (CompletePasskeySignupResponse);
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (BeginPasskeyLoginResponse);
  rpc CompletePasskeyLogin(CompletePasskeyLoginRequest) returns (CompletePasskeyLoginResponse);
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);

  // QR Login (cross-device authorization)
  rpc InitiateQrLogin(InitiateQrLoginRequest) returns (InitiateQrLoginResponse);
  rpc GetQrLoginSession(GetQrLoginSessionRequest) returns (GetQrLoginSessionResponse);
  rpc ApproveQrLogin(ApproveQrLoginRequest) returns (ApproveQrLoginResponse);
  rpc PollQrLogin(PollQrLoginRequest) returns (PollQrLoginResponse);

  // 2FA TOTP
  rpc BeginTotpSetup(BeginTotpSetupRequest) returns (BeginTotpSetupResponse);
  rpc VerifyTotpSetup(VerifyTotpSetupRequest) returns (VerifyTotpSetupResponse);
  rpc DisableTotp(DisableTotpRequest) returns (DisableTotpResponse);
  rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);

  // Session management
  rpc ListMySessions(ListMySessionsRequest) returns (ListMySessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
  rpc SignOutEverywhere(SignOutEverywhereRequest) returns (SignOutEverywhereResponse);

  // Audit log
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);

  // Users
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // Admin-only paginated user listing — supports filters and search.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // Groups (formerly WorkingGroup — graph DB type still WorkingGroup)
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);

  // Membership (graph edges)
  rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse);
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse);
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);

  // Tenant domains (redesign). Authenticated, project-scoped, and gated
  // on the caller being an owner/admin member of the target tenant — with
  // one exception: VerifyDomain on a still-latent tenant that has no
  // members yet is open, so the first verifier becomes its owner.
  // Available only on the postgres control-plane driver; the memory driver
  // deployments return Unimplemented.
  rpc CreateDomain(CreateDomainRequest) returns (CreateDomainResponse);
  rpc VerifyDomain(VerifyDomainRequest) returns (VerifyDomainResponse);
  rpc ListTenantDomains(ListTenantDomainsRequest) returns (ListTenantDomainsResponse);

  // Tenant membership (redesign). Authenticated, project-scoped, and —
  // except for AcceptTenantInvitation — gated on the caller being an
  // owner/admin member of the target tenant. AcceptTenantInvitation is the
  // redeemer's own action: any authenticated caller may redeem a token, but
  // only for an invitation addressed to their own account email. Available
  // only on the postgres control-plane driver; memory deployments
  // return Unimplemented.
  rpc CreateTenantInvitation(CreateTenantInvitationRequest) returns (CreateTenantInvitationResponse);
  rpc AcceptTenantInvitation(AcceptTenantInvitationRequest) returns (AcceptTenantInvitationResponse);
  rpc ListTenantInvitations(ListTenantInvitationsRequest) returns (ListTenantInvitationsResponse);
  rpc ListTenantMembers(ListTenantMembersRequest) returns (ListTenantMembersResponse);
  rpc RemoveTenantMember(RemoveTenantMemberRequest) returns (RemoveTenantMemberResponse);

  // Admin user management (caller must have role=admin). Enforced in the
  // servicer via _require_admin(ctx); all admin RPCs audit-log their actions.
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse);
  rpc DeactivateUser(DeactivateUserRequest) returns (DeactivateUserResponse);
  rpc ReactivateUser(ReactivateUserRequest) returns (ReactivateUserResponse);
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse);
  rpc SetUserQuota(SetUserQuotaRequest) returns (SetUserQuotaResponse);

  // Control-plane admin (redesign). PLATFORM-operator RPCs that provision
  // projects/tenants/credentials out-of-band. Authenticated by the shared
  // admin secret in the "X-Admin-Secret" header (NOT a user JWT); disabled
  // (UNIMPLEMENTED) unless GATEWAY_ADMIN_API_SECRET is set.
  rpc AdminCreateProject(AdminCreateProjectRequest) returns (AdminCreateProjectResponse);
  rpc AdminCreateProjectCredential(AdminCreateProjectCredentialRequest) returns (AdminCreateProjectCredentialResponse);
  rpc AdminAddProjectAuthDomain(AdminAddProjectAuthDomainRequest) returns (AdminAddProjectAuthDomainResponse);
  // Customer-owned custom auth-domains: a project registers a serving
  // hostname, proves ownership via a DNS TXT challenge, then it resolves.
  // An unverified custom domain does NOT resolve requests.
  rpc AddProjectAuthDomain(AddProjectAuthDomainRequest) returns (AddProjectAuthDomainResponse);
  rpc VerifyProjectAuthDomain(VerifyProjectAuthDomainRequest) returns (VerifyProjectAuthDomainResponse);
  rpc ListProjectAuthDomains(ListProjectAuthDomainsRequest) returns (ListProjectAuthDomainsResponse);
  // SetPrimaryAuthDomain promotes a VERIFIED custom auth-domain to the
  // project's primary serving host, atomically demoting the current primary in
  // the same transaction. Only a verified domain may be promoted.
  rpc SetPrimaryAuthDomain(SetPrimaryAuthDomainRequest) returns (SetPrimaryAuthDomainResponse);
  rpc AdminCreateTenant(AdminCreateTenantRequest) returns (AdminCreateTenantResponse);
  rpc AdminAddTenantAdmin(AdminAddTenantAdminRequest) returns (AdminAddTenantAdminResponse);

  // Trust-on-first-use bootstrap of the FIRST platform admin: succeeds only
  // while platform_admins is empty, then permanently closes (FAILED_PRECONDITION).
  // Zero-config only when GATEWAY_ADMIN_API_SECRET is unset; when it is set the
  // call requires the X-Admin-Secret header (PERMISSION_DENIED otherwise), and
  // GATEWAY_DISABLE_FIRST_ADMIN_BOOTSTRAP=true closes it entirely
  // (FAILED_PRECONDITION). Postgres-only; the memory driver returns UNIMPLEMENTED.
  rpc CreateFirstPlatformAdmin(CreateFirstPlatformAdminRequest) returns (CreateFirstPlatformAdminResponse);

  // Self-service linked identities (connected accounts). Authenticated by the
  // caller's user JWT; each operates only on the caller's own links.
  rpc ListLinkedIdentities(ListLinkedIdentitiesRequest) returns (ListLinkedIdentitiesResponse);
  rpc LinkIdentity(LinkIdentityRequest) returns (LinkIdentityResponse);
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);

  // Per-tenant LoginPolicy authoring. These write the policy the login path
  // enforces (allowed methods, SSO-required, require-2FA) for a claimed
  // tenant within a project — at most one policy per (project, tenant).
  // Operator-only: authenticated by the shared admin secret, like the other
  // Admin* RPCs, and UNIMPLEMENTED on a build with no control plane.
  rpc UpsertLoginPolicy(UpsertLoginPolicyRequest) returns (UpsertLoginPolicyResponse);
  rpc GetLoginPolicy(GetLoginPolicyRequest) returns (GetLoginPolicyResponse);
  rpc DeleteLoginPolicy(DeleteLoginPolicyRequest) returns (DeleteLoginPolicyResponse);

  // Per-project config authoring. UpsertProjectConfig replaces a project's
  // config_json blob (the typed knobs an operator sets — e.g. CORS allowed
  // origins); GetProjectConfig reads it back. Operator-only, like the other
  // Admin* RPCs, and UNIMPLEMENTED on a build with no control plane.
  rpc UpsertProjectConfig(UpsertProjectConfigRequest) returns (UpsertProjectConfigResponse);
  rpc GetProjectConfig(GetProjectConfigRequest) returns (GetProjectConfigResponse);

  // Per-project OAuth provider authoring. AdminSetProjectOAuthProvider
  // sets/rotates one provider (encrypting any plaintext secret server-side and
  // merging it into config_json without disturbing other keys);
  // AdminDeleteProjectOAuthProvider removes one provider;
  // AdminListProjectOAuthProviders lists the configured providers with secrets
  // redacted. Operator-only, like the other Admin* RPCs, and UNIMPLEMENTED on a
  // build with no control plane.
  rpc AdminSetProjectOAuthProvider(AdminSetProjectOAuthProviderRequest) returns (AdminSetProjectOAuthProviderResponse);
  // SignInAnonymously creates a credential-less account and returns it with
  // a token pair. Every call mints a NEW user; the refresh token is the
  // account's only means of return. Per-project switch, default off, and
  // independent of the access mode.
  rpc SignInAnonymously(SignInAnonymouslyRequest) returns (SignInAnonymouslyResponse);
  // UpgradeAnonymousAccount attaches a permanent credential to the CALLING
  // anonymous account in place, preserving its id. Requires an
  // authenticated anonymous caller; exactly one credential must be set.
  // Gated by the project access mode with signup semantics, so it returns
  // PERMISSION_DENIED on a closed/invite/off-list project.
  rpc UpgradeAnonymousAccount(UpgradeAnonymousAccountRequest) returns (UpgradeAnonymousAccountResponse);
  // Per-project client-assurance authoring. Takes the Play Integrity
  // service-account key in plaintext and encrypts it server-side, so an
  // operator never has to reimplement the at-rest encryption.
  rpc AdminSetProjectAssurance(AdminSetProjectAssuranceRequest) returns (AdminSetProjectAssuranceResponse);
  rpc AdminGetProjectAssurance(AdminGetProjectAssuranceRequest) returns (AdminGetProjectAssuranceResponse);
  rpc AdminDeleteProjectOAuthProvider(AdminDeleteProjectOAuthProviderRequest) returns (AdminDeleteProjectOAuthProviderResponse);
  rpc AdminListProjectOAuthProviders(AdminListProjectOAuthProvidersRequest) returns (AdminListProjectOAuthProvidersResponse);
}
