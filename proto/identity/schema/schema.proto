// Identity Service — EntDB Schema
//
// Defines all node types and edge types used by the identity service.
// Proto field numbers correspond to EntDB field_ids on disk — they are
// STABLE and must never be renumbered.
//
// Generate with:
//   entdb generate proto/identity/schema.proto --go ...
//   entdb generate proto/identity/schema.proto --python ...

syntax = "proto3";

package identity.schema;

option go_package = "github.com/elloloop/identity/gen/go/identity/schema";

import "entdb/entdb_options.proto";

// ═══════════════════════════════════════════════════════════════════════
// Node Types
// ═══════════════════════════════════════════════════════════════════════

// ─── User (type_id 1) ──────────────────────────────────────────────────

message User {
    option (entdb.node) = {
        type_id: 1
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "id"
        description: "A user in the system"
    };

    string email              = 1  [(entdb.field) = { required: true, unique: true, searchable: true, pii: true }];
    string name               = 2  [(entdb.field) = { required: true, searchable: true, pii: true }];
    string role               = 3  [(entdb.field) = { enum_values: "admin,member,guest", default_value: "member", pii_false: true }];
    string avatar_url         = 4  [(entdb.field) = { pii: true }];
    int64  created_at         = 5  [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  updated_at         = 6  [(entdb.field) = { kind: "timestamp", pii_false: true }];
    string password_hash      = 7  [(entdb.field) = { pii_false: true, description: "bcrypt hash — never exposed via RPC" }];
    bool   totp_required      = 8  [(entdb.field) = { indexed: true, pii_false: true }];
    int64  failed_login_count = 9  [(entdb.field) = { pii_false: true }];
    int64  locked_until       = 10 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    string status             = 11 [(entdb.field) = { enum_values: "active,invited,deactivated,suspended", indexed: true, pii_false: true }];
    string recovery_email     = 12 [(entdb.field) = { pii: true }];
    string invited_by         = 13 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  invited_at         = 14 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  quota_bytes        = 15 [(entdb.field) = { pii_false: true }];
    int64  deactivated_at     = 16 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  last_login_at      = 17 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    bool   email_verified     = 18 [(entdb.field) = { default_value: "false", pii_false: true, indexed: true }];
    int64  email_verified_at  = 19 [(entdb.field) = { pii_false: true }];
    bool   idv_verified       = 20 [(entdb.field) = { default_value: "false", pii_false: true, indexed: true }];
    int64  idv_verified_at    = 21 [(entdb.field) = { pii_false: true }];
    string phone_number       = 22 [(entdb.field) = { pii: true }];
    bool   phone_verified     = 23 [(entdb.field) = { default_value: "false", pii_false: true, indexed: true }];
    int64  phone_verified_at  = 24 [(entdb.field) = { pii_false: true }];
}

// ─── WorkingGroup (type_id 2) ──────────────────────────────────────────

message WorkingGroup {
    option (entdb.node) = {
        type_id: 2
        tenant_visible: true
        data_policy: DATA_POLICY_BUSINESS
        description: "A working group (team/department) within a tenant"
    };

    string name        = 1 [(entdb.field) = { required: true, searchable: true }];
    string description = 2 [(entdb.field) = { searchable: true }];
    string created_by  = 3 [(entdb.field) = { kind: "ref", ref_type_id: 1 }];
    int64  created_at  = 4 [(entdb.field) = { kind: "timestamp" }];
    int64  updated_at  = 5 [(entdb.field) = { kind: "timestamp" }];
}

// ─── RefreshToken (type_id 5) ──────────────────────────────────────────

message RefreshToken {
    option (entdb.node) = {
        type_id: 5
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "A hashed refresh token bound to a user session"
    };

    string token_hash   = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id      = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string device_info  = 3 [(entdb.field) = { pii: true }];
    int64  expires_at   = 4 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  created_at   = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    string device_name  = 6 [(entdb.field) = { pii: true }];
    string ip_address   = 7 [(entdb.field) = { pii: true }];
    string user_agent   = 8 [(entdb.field) = { pii: true }];
    int64  last_used_at = 9 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  consumed_at  = 10 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── PasswordResetToken (type_id 19) ───────────────────────────────────

message PasswordResetToken {
    option (entdb.node) = {
        type_id: 19
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "A short-lived token for password reset flows"
    };

    string token_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id     = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  expires_at  = 3 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at  = 4 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  consumed_at = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }]; // 0 = unconsumed
}

// ─── PasskeyCredential (type_id 20) ────────────────────────────────────

message PasskeyCredential {
    option (entdb.node) = {
        type_id: 20
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "A WebAuthn/FIDO2 passkey credential registered by a user"
    };

    string credential_id = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id       = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string public_key    = 3 [(entdb.field) = { required: true, pii_false: true }];
    int64  sign_count    = 4 [(entdb.field) = { pii_false: true }];
    string device_name   = 5 [(entdb.field) = { pii: true }];
    string aaguid        = 6 [(entdb.field) = { pii_false: true, description: "Authenticator Attestation GUID" }];
    string transports    = 7 [(entdb.field) = { pii_false: true, description: "Comma-separated transport hints (usb, ble, nfc, internal)" }];
    int64  created_at    = 8 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  last_used_at  = 9 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── PasskeyChallenge (type_id 21) ─────────────────────────────────────

message PasskeyChallenge {
    option (entdb.node) = {
        type_id: 21
        data_policy: DATA_POLICY_EPHEMERAL
        description: "A short-lived WebAuthn challenge for registration or authentication"
    };

    string challenge      = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id        = 2 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string challenge_type = 3 [(entdb.field) = { enum_values: "registration,authentication", pii_false: true }];
    int64  expires_at     = 4 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at     = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── QrLoginSession (type_id 22) ───────────────────────────────────────

message QrLoginSession {
    option (entdb.node) = {
        type_id: 22
        data_policy: DATA_POLICY_EPHEMERAL
        description: "A cross-device QR login session"
    };

    string session_id             = 1  [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string status                 = 2  [(entdb.field) = { enum_values: "pending,approved,rejected,expired,consumed", indexed: true, pii_false: true }];
    string user_id                = 3  [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string new_device_info        = 4  [(entdb.field) = { pii: true }];
    string new_device_ip          = 5  [(entdb.field) = { pii: true }];
    string new_device_user_agent  = 6  [(entdb.field) = { pii: true }];
    string approved_device_info   = 7  [(entdb.field) = { pii: true }];
    int64  expires_at             = 8  [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  created_at             = 9  [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  updated_at             = 10 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    // sha256(poll_secret); the plaintext is returned only to the initiating
    // device. PollQrLogin rejects sessions where the presented secret does
    // not hash to this value.
    string poll_secret_hash       = 11 [(entdb.field) = { pii_false: true }];
}

// ─── TotpCredential (type_id 23) ───────────────────────────────────────

message TotpCredential {
    option (entdb.node) = {
        type_id: 23
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "A TOTP (time-based one-time password) credential for 2FA"
    };

    string user_id          = 1 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string secret_encrypted = 2 [(entdb.field) = { required: true, pii_false: true, description: "AES-encrypted TOTP secret" }];
    bool   verified         = 3 [(entdb.field) = { indexed: true, pii_false: true }];
    int64  created_at       = 4 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  last_used_at     = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── RecoveryCode (type_id 24) ─────────────────────────────────────────

message RecoveryCode {
    option (entdb.node) = {
        type_id: 24
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "A one-time recovery code for 2FA backup access"
    };

    string user_id    = 1 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string code_hash  = 2 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    bool   used       = 3 [(entdb.field) = { indexed: true, pii_false: true }];
    int64  created_at = 4 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  used_at    = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── LoginChallenge (type_id 25) ───────────────────────────────────────

message LoginChallenge {
    option (entdb.node) = {
        type_id: 25
        data_policy: DATA_POLICY_EPHEMERAL
        description: "A pending login challenge awaiting 2FA verification"
    };

    string challenge_id = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id      = 2 [(entdb.field) = { required: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  expires_at   = 3 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at   = 4 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── AuditEvent (type_id 26) ───────────────────────────────────────────

message AuditEvent {
    option (entdb.node) = {
        type_id: 26
        data_policy: DATA_POLICY_AUDIT
        subject_field: "actor_user_id"
        description: "An immutable security audit log entry"
    };

    string event_type      = 1 [(entdb.field) = { enum_values: "login_success,login_failure,login_locked,account_locked,logout,password_changed,password_reset,totp_enabled,totp_disabled,totp_verified,passkey_added,passkey_removed,passkey_used,session_revoked,user_invited,user_deactivated,user_reactivated,admin_reset_password,oauth_login,qr_login_approved,qr_login_rejected", indexed: true, pii_false: true }];
    string actor_user_id   = 2 [(entdb.field) = { indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string target_user_id  = 3 [(entdb.field) = { indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string ip_address      = 4 [(entdb.field) = { pii: true }];
    string user_agent      = 5 [(entdb.field) = { pii: true }];
    bool   success         = 6 [(entdb.field) = { indexed: true, pii_false: true }];
    string details         = 7 [(entdb.field) = { kind: "json", pii_false: true, description: "JSON blob with event-specific data" }];
    int64  created_at      = 8 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true }];
}

// ─── UserInvitation (type_id 27) ───────────────────────────────────────

message UserInvitation {
    option (entdb.node) = {
        type_id: 27
        data_policy: DATA_POLICY_EPHEMERAL
        description: "An admin-issued invitation for a new user to join the tenant"
    };

    string token_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string email       = 2 [(entdb.field) = { required: true, unique: true, indexed: true, searchable: true, pii: true }];
    string user_id     = 3 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string invited_by  = 4 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string role        = 5 [(entdb.field) = { enum_values: "admin,member,guest", pii_false: true }];
    int64  expires_at  = 6 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  accepted_at = 7 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  created_at  = 8 [(entdb.field) = { kind: "timestamp", pii_false: true }];
}

// ─── AdminHelpRequest (type_id 28) ─────────────────────────────────────

message AdminHelpRequest {
    option (entdb.node) = {
        type_id: 28
        data_policy: DATA_POLICY_BUSINESS
        description: "A help request from a user who cannot log in, resolved by an admin"
    };

    string email            = 1 [(entdb.field) = { required: true, searchable: true, indexed: true, pii: true }];
    string reason           = 2 [(entdb.field) = { searchable: true, pii_false: true }];
    string source_ip        = 3 [(entdb.field) = { pii: true }];
    string user_agent       = 4 [(entdb.field) = { pii: true }];
    string status           = 5 [(entdb.field) = { enum_values: "pending,resolved,rejected", indexed: true, pii_false: true }];
    string resolved_by      = 6 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string resolution_notes = 7 [(entdb.field) = { pii_false: true }];
    int64  resolved_at      = 8 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    int64  created_at       = 9 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true }];
}

// ─── EmailVerificationToken (type_id 29) ───────────────────────────────

message EmailVerificationToken {
    option (entdb.node) = {
        type_id: 29
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "A short-lived token for email verification flows"
    };

    string token_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id     = 2 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string email       = 3 [(entdb.field) = { required: true, indexed: true, pii: true }];
    int64  expires_at  = 4 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at  = 5 [(entdb.field) = { required: true, pii_false: true }];
    int64  consumed_at = 6 [(entdb.field) = { pii_false: true }]; // 0 = unconsumed
}

// ─── EmailChangeToken (type_id 30) ─────────────────────────────────────

message EmailChangeToken {
    option (entdb.node) = {
        type_id: 30
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "A short-lived token for email change confirmation flows"
    };

    string token_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id     = 2 [(entdb.field) = { kind: "ref", ref_type_id: 1, pii_false: true }];
    string old_email   = 3 [(entdb.field) = { pii: true }];
    string new_email   = 4 [(entdb.field) = { pii: true }];
    int64  expires_at  = 5 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at  = 6 [(entdb.field) = { required: true, pii_false: true }];
    int64  consumed_at = 7 [(entdb.field) = { pii_false: true }]; // 0 = unconsumed
}

// ─── OAuthIdentity (type_id 31) ────────────────────────────────────────
//
// Records the linkage between a local User and a stable provider-side
// identity (provider, provider_user_id). This is what lets OAuth login
// keep the same human linked to the same local account when the
// provider's email changes.
//
// Uniqueness on (provider, provider_user_id) is enforced server-side via
// the composite_unique declaration below. The SDK attaches the schema to
// ExecuteAtomic (ADR-031), and the server materialises a unique
// expression index in the same WAL event as the create, so two
// concurrent creates with the same tuple cannot both succeed.
message OAuthIdentity {
    option (entdb.node) = {
        type_id: 31
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "Linkage between a local User and a provider-side stable identity (provider, sub)."
        composite_unique: {
            name: "provider_user_id"
            fields: ["provider", "provider_user_id"]
        }
    };

    string user_id            = 1 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string provider           = 2 [(entdb.field) = { required: true, indexed: true, searchable: true, enum_values: "google,microsoft,github,apple", pii_false: true }];
    string provider_user_id   = 3 [(entdb.field) = { required: true, indexed: true, pii: true, description: "Stable per-provider user id (e.g. OIDC sub)." }];
    string email_at_link_time = 4 [(entdb.field) = { pii: true, description: "Snapshot of provider email when first linked, for audit." }];
    int64  created_at         = 5 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
}

// ─── Organization (type_id 33) ─────────────────────────────────────────
//
// Identity-layer organisation entity used by `mode=multi` deployments.
// Maps 1:1 to a tenant-shard-db tenant (see decision log §2 in
// docs/IDENTITY.md): every Organization row's storage scope IS the
// matching tenant. There is therefore no `tenant_id` field on the
// payload — the row only exists inside its own tenant's data plane,
// and identity-layer code already knows which tenant it's reading.
//
// `slug` is the URL-safe identifier deployers expose to end-users
// (`acmecorp.example.com` → tenant slug `acmecorp`). It must be unique
// within a deployment; identity enforces uniqueness by using the slug
// AS the tenant id passed to `Admin.CreateTenant`, so collisions
// surface as an EntDB-level error at signup time.
//
// `display_name` is the human-readable organisation name shown in
// product UIs. It is not part of routing and is not required to be
// unique.
//
// `owner_user_id` records which identity-layer User row created the
// org (the first admin from `OrganizationSignup`). Subsequent admin
// changes do not move it — it is provenance, not authority.
message Organization {
    option (entdb.node) = {
        type_id: 33
        data_policy: DATA_POLICY_BUSINESS
        description: "An identity-layer organisation; maps 1:1 to a tenant-shard-db tenant."
    };

    string slug          = 1 [(entdb.field) = { required: true, unique: true, indexed: true, searchable: true, pii_false: true, description: "URL-safe identifier; matches the tenant-shard-db tenant id." }];
    string display_name  = 2 [(entdb.field) = { required: true, searchable: true, pii: true }];
    string owner_user_id = 3 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  created_at    = 4 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  updated_at    = 5 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
}

// ─── OrganizationMembership (type_id 34) ───────────────────────────────
//
// One row per (organization, user) pairing. Lets identity answer
// "which organisations does this user belong to?" without scanning
// every Organization row.
//
// Storage-layer `TenantMember` is the source of truth for "can this
// user write to this tenant"; OrganizationMembership is a per-tenant
// secondary index keyed on (organization_id, user_id) that identity
// uses for product-layer listings. It is created alongside every
// identity-side user-added-to-tenant operation.
//
// Note: the membership row lives inside the organisation's own
// tenant scope. ListOrganizationsForUser fans out across configured
// tenants in `mode=multi`; the fan-out shape is defined by the
// per-request tenant resolution layer (slice 3 of #93).
message OrganizationMembership {
    option (entdb.node) = {
        type_id: 34
        data_policy: DATA_POLICY_BUSINESS
        subject_field: "user_id"
        description: "Identity-layer membership row linking a User to an Organization."
    };

    string organization_id = 1 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 33, pii_false: true }];
    string user_id         = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string role            = 3 [(entdb.field) = { enum_values: "admin,member,guest", default_value: "member", pii_false: true }];
    int64  created_at      = 4 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
}

// ─── Session (type_id 35) ──────────────────────────────────────────────
//
// One row per logged-in session for `GATEWAY_REVOCATION_MODE=session`
// deployments. Access tokens minted under that mode carry an `sid`
// claim referencing this row; verification middleware looks the row
// up (via an in-process cache with configurable TTL) and rejects the
// request when `revoked_at_ms != 0`.
//
// The two-mode contract is documented in docs/IDENTITY.md (decision
// log §6). In `mode=ttl` (the default) Sessions are never created and
// the lookup is skipped entirely — this node type costs zero on the
// hot path for deployers who never opt in.
//
// Why a separate node type from RefreshToken: a refresh token rotates
// on every use (consumed_at is the serialization point for replay
// detection), whereas a session stays stable for the lifetime of the
// login. Conflating them would force cache invalidation on every
// legitimate rotation, defeating the warm-cache hot path.
//
// Type_id 35 is the next free slot after Organization (33) and
// OrganizationMembership (34); see proto field comment at the top
// of this file — node type ids on disk are STABLE and must never
// be renumbered.
message Session {
    option (entdb.node) = {
        type_id: 35
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "An access-token-bound session row for mode=session revocation."
    };

    string sid            = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true, description: "Stable per-session id; carried as the `sid` claim on access tokens." }];
    string user_id        = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  created_at_ms  = 3 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  revoked_at_ms  = 4 [(entdb.field) = { kind: "timestamp", indexed: true, pii_false: true, description: "0 = active; non-zero = revoked at this epoch ms." }];
}

// ─── IdentityVerification (type_id 32) ─────────────────────────────────
//
// One row per document + selfie verification session run for a User.
// The Provider field names the backing implementation (e.g. "azure",
// "stub"); ProviderSessionID is the provider's own identifier for the
// check, used to correlate webhooks and follow-up status fetches.
//
// Status moves through:  pending → in_review → (approved | rejected) ;
// expired is a terminal state for sessions the user never finished.
//
// Application code MUST enforce uniqueness on (verification_id) per
// tenant; EntDB does not currently provide composite unique constraints
// across (tenant, secondary key).
message IdentityVerificationRecord {
    option (entdb.node) = {
        type_id: 32
        data_policy: DATA_POLICY_PERSONAL
        subject_field: "user_id"
        description: "A document + selfie identity-verification session tracked against a User."
    };

    string verification_id     = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true }];
    string user_id             = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    string provider            = 3 [(entdb.field) = { required: true, indexed: true, enum_values: "azure,stub,onfido,persona,veriff", pii_false: true }];
    string provider_session_id = 4 [(entdb.field) = { indexed: true, pii_false: true }];
    string status              = 5 [(entdb.field) = { required: true, indexed: true, enum_values: "pending,in_review,approved,rejected,expired", pii_false: true }];
    int64  created_at          = 6 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  updated_at          = 7 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  completed_at        = 8 [(entdb.field) = { kind: "timestamp", pii_false: true }];
    string rejection_reason    = 9 [(entdb.field) = { pii: true, description: "Provider verdict reason; empty unless status = rejected." }];
}

// ─── OAuthOneTimeCode (type_id 36) ─────────────────────────────────────
//
// The single-use handover artifact for the hosted OAuth flow. After the
// hosted callback (GET /oauth/callback/{provider}) completes the code
// exchange and authenticates the user, it mints an opaque one-time code,
// stores its SHA-256 hash here keyed to the user, and 302-redirects the
// browser to return_to?code=<otc>. The SPA exchanges the code via the
// RedeemOAuthCode RPC, which atomically consumes this row (consumed_at
// CAS from 0) and mints a fresh token pair.
//
// Only the user id + a short expiry are persisted — no token material is
// stored at rest. Single-use is enforced by the consumed_at compare-and-
// set so a replay (or two replicas racing the same code) yields exactly
// one winner; losers see Unauthenticated.
message OAuthOneTimeCode {
    option (entdb.node) = {
        type_id: 36
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "Single-use, short-lived code handing a hosted-OAuth login back to the SPA."
    };

    string code_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true, description: "sha256(one-time code); plaintext is returned only in the callback redirect." }];
    string user_id    = 2 [(entdb.field) = { required: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true }];
    int64  expires_at = 3 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at = 4 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  consumed_at = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }]; // 0 = unconsumed
}

// ─── EmailLoginCode (type_id 37) ───────────────────────────────────────
//
// The OTP arm of passwordless email login. RequestEmailLoginCode mints a
// 6-digit code, stores its SHA-256 hash here keyed to the email (NOT a
// user — the user may not exist yet), and emails the plaintext.
// VerifyEmailLoginCode looks the row up by email, compares the hash,
// and on a match resolves-or-creates the user and issues tokens.
//
// Keyed by email (unique) rather than the code hash because the code is
// only 6 digits: a global unique index on a 6-digit value would collide
// across users, and brute-force protection needs to find the active code
// for an email even when the *guess* is wrong (to bump attempt_count).
// A new request overwrites the previous code for the same email, so at
// most one code is live per inbox at a time.
//
// Single-use is enforced by the consumed_at compare-and-set; brute force
// is bounded by attempt_count — VerifyEmailLoginCode invalidates the
// code once attempts reach the configured cap.
message EmailLoginCode {
    option (entdb.node) = {
        type_id: 37
        data_policy: DATA_POLICY_EPHEMERAL
        description: "Single-use, short-lived OTP for passwordless email login, keyed by email."
    };

    string email         = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii: true, description: "Lowercased recipient email; at most one live code per address." }];
    string code_hash     = 2 [(entdb.field) = { required: true, pii_false: true, description: "sha256(6-digit code); plaintext is sent only in the email." }];
    int64  expires_at    = 3 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at    = 4 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  consumed_at   = 5 [(entdb.field) = { kind: "timestamp", pii_false: true }]; // 0 = unconsumed
    int64  attempt_count = 6 [(entdb.field) = { pii_false: true, description: "Failed verify attempts; the code is invalidated at the configured cap." }];
    int64  max_attempts  = 7 [(entdb.field) = { pii_false: true, description: "Attempt cap captured at mint time so a config change doesn't move the goalposts mid-flight." }];
}

// ─── MagicLinkToken (type_id 38) ───────────────────────────────────────
//
// The magic-link arm of passwordless email login. RequestMagicLink mints
// a high-entropy opaque token, stores its SHA-256 hash here bound to the
// requested email and the (allowlist-validated) return_to, and emails the
// clickable link. RedeemMagicLink consumes the row (consumed_at CAS from
// 0), resolves-or-creates the user by the bound email, and issues tokens.
//
// Only the email + return_to + a short expiry are persisted — the token
// plaintext lives solely in the email. Single-use is enforced by the
// consumed_at compare-and-set so a replay (or two clicks racing) yields
// exactly one winner; losers see Unauthenticated.
message MagicLinkToken {
    option (entdb.node) = {
        type_id: 38
        data_policy: DATA_POLICY_EPHEMERAL
        description: "Single-use, short-lived magic-link token for passwordless email login, bound to an email."
    };

    string token_hash  = 1 [(entdb.field) = { required: true, unique: true, indexed: true, pii_false: true, description: "sha256(opaque token); plaintext is sent only in the email link." }];
    string email       = 2 [(entdb.field) = { required: true, indexed: true, pii: true, description: "Lowercased email the link proves control of." }];
    string return_to   = 3 [(entdb.field) = { pii_false: true, description: "Allowlist-validated app URL the redeem flow returns to." }];
    int64  expires_at  = 4 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at  = 5 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  consumed_at = 6 [(entdb.field) = { kind: "timestamp", pii_false: true }]; // 0 = unconsumed
}

// ─── PhoneVerificationCode (type_id 39) ────────────────────────────────

message PhoneVerificationCode {
    option (entdb.node) = {
        type_id: 39
        data_policy: DATA_POLICY_EPHEMERAL
        subject_field: "user_id"
        description: "Single-use, short-lived SMS OTP for phone-ownership verification, keyed by user."
    };

    string user_id       = 1 [(entdb.field) = { required: true, unique: true, indexed: true, kind: "ref", ref_type_id: 1, pii_false: true, description: "Owning user; at most one live code per user." }];
    string phone_number  = 2 [(entdb.field) = { required: true, pii: true, description: "E.164 number the code proves control of." }];
    string code_hash     = 3 [(entdb.field) = { required: true, pii_false: true, description: "sha256(6-digit code); plaintext is sent only in the SMS." }];
    int64  expires_at    = 4 [(entdb.field) = { required: true, kind: "timestamp", indexed: true, pii_false: true }];
    int64  created_at    = 5 [(entdb.field) = { required: true, kind: "timestamp", pii_false: true }];
    int64  consumed_at   = 6 [(entdb.field) = { kind: "timestamp", pii_false: true }]; // 0 = unconsumed
    int64  attempt_count = 7 [(entdb.field) = { pii_false: true, description: "Failed verify attempts; the code is invalidated at the configured cap." }];
    int64  max_attempts  = 8 [(entdb.field) = { pii_false: true, description: "Attempt cap captured at mint time." }];
}

