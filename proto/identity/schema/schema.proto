// ─── MemberOf (edge_id 101): User → WorkingGroup ───────────────────────

message MemberOf {
    option (entdb.edge) = {
        edge_id: 101
        name: "MEMBER_OF"
        description: "User belongs to a working group"
    };
}

// ─── UserPasskey (edge_id 216): User → PasskeyCredential ───────────────

message UserPasskey {
    option (entdb.edge) = {
        edge_id: 216
        name: "USER_PASSKEY"
        data_policy: DATA_POLICY_PERSONAL
        on_subject_exit: SUBJECT_EXIT_FROM
        description: "User owns a passkey credential"
    };
}

// ─── UserTotp (edge_id 217): User → TotpCredential ────────────────────

message UserTotp {
    option (entdb.edge) = {
        edge_id: 217
        name: "USER_TOTP"
        unique_per_from: true
        data_policy: DATA_POLICY_PERSONAL
        on_subject_exit: SUBJECT_EXIT_FROM
        description: "User has a TOTP credential (at most one per user)"
    };
}

// ─── UserRecoveryCode (edge_id 218): User → RecoveryCode ──────────────

