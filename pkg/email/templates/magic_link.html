<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your sign-in link</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #222; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">Sign in</h1>
  <p style="font-size: 15px; line-height: 1.5;">Click the button below to sign in. The link works once and expires in {{.ExpiresIn}}.</p>
  <p style="margin: 24px 0;">
    <a href="{{.Link}}" style="display: inline-block; background: #111; color: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 15px;">Sign in</a>
  </p>
  <p style="font-size: 13px; color: #666; line-height: 1.5;">If the button doesn't work, paste this link into your browser:<br><span style="word-break: break-all;">{{.Link}}</span></p>
  <p style="font-size: 13px; color: #666; line-height: 1.5;">If you didn't request this, you can safely ignore this email.</p>
</body>
</html>
