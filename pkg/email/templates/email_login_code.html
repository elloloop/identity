<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your login code</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #222; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h1 style="font-size: 20px; margin: 0 0 16px;">Your login code</h1>
  <p style="font-size: 15px; line-height: 1.5;">Enter this code to finish signing in. It expires in {{.ExpiresIn}}.</p>
  <p style="margin: 24px 0;">
    <span style="display: inline-block; font-size: 30px; letter-spacing: 8px; font-weight: 600; background: #f4f4f5; padding: 12px 20px; border-radius: 8px;">{{.Code}}</span>
  </p>
  <p style="font-size: 13px; color: #666; line-height: 1.5;">If you didn't request this, you can safely ignore this email.</p>
</body>
</html>
